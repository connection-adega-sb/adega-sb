<style>
  /* Layout: espelho do módulo de Vendas — topo estrutura com abas; funil Pedido → Nota → Recebimento → Pagamento; editor em 3 colunas — ADEGA SB · azul profundo, laranja e pérola (brandbook 2026) · Simone Alves Nascimento, CNPJ 43.466.024/0001-43 */
  :root {
    --bg-fundo:#E9EAEC; --white:#FFFFFF; --estrutura:#232F3E; --estrutura-light:#2E3D50;
    --acao-100:#FFF1DC; --acao-300:#FFC266; --acao-600:#A85F00; --acao-600-dark:#8F4A00;
    --ink:#10151C; --ink-soft:#525B6B; --ink-faint:#C9CDD3; --border:#CDD1D6; --line-input:#7A7F87;
    --ok:#1E7F4F; --bad:#B42318; --warn:#B54708;
    color-scheme: light;
  }
  html, body { height: 100%; background: var(--bg-fundo); color: var(--ink); font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif; }
  #root { height: 100%; }
  .display { font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif; font-weight: 700; color: var(--estrutura); letter-spacing: .01em; }
  .label { display:block; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .scrollbar-none::-webkit-scrollbar { display: none; } .scrollbar-none { scrollbar-width: none; }
  button, input, select { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; }
  button:focus-visible { outline: 2px solid var(--estrutura); outline-offset: 2px; }
  /* Borda de controle com contraste ≥ 3:1 (WCAG 1.4.11): cards usam --border, inputs usam --line-input */
  input[class*="border-line"], select[class*="border-line"], textarea[class*="border-line"] { border-color: var(--line-input); }
  input:focus, select:focus { outline: none; border-color: var(--estrutura) !important; }
  input:disabled, select:disabled { background: #F2F3F5; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

// Custos: nacional = mercadorias + frete − desconto; importação = custo de nacionalização completo
function custos(c) {
  if (c.origem === 'nacional') {
    const merc = c.itens.reduce((a, i) => a + i.qtd * i.custo, 0);
    const total = Math.max(0, merc + c.frete - c.desconto);
    const fator = merc ? total / merc : 1;
    return { merc, total, linhas: [['Mercadorias', merc], ['Frete', c.frete], ['Desconto', -c.desconto]],
      unit: Object.fromEntries(c.itens.map(i => [i.pid, i.custo * fator])) };
  }
  const im = c.imp; const cb = im.cambio;
  const fobM = c.itens.reduce((a, i) => a + i.qtd * i.custo, 0);
  const fob = fobM * cb, cif = fob + (im.freteInt + im.seguro) * cb;
  const ii = cif * im.ii / 100, ipi = (cif + ii) * im.ipi / 100;
  const pis = cif * 2.1 / 100, cofins = cif * 9.65 / 100;
  const baseIcms = (cif + ii + ipi + pis + cofins + im.despesas) / (1 - im.icms / 100);
  const icms = baseIcms * im.icms / 100;
  const total = cif + ii + ipi + pis + cofins + im.despesas + icms;
  return { merc: fob, fobM, total, linhas: [
      [`Mercadorias (FOB ${moeda(fobM, im.moeda)})`, fob], ['Frete e seguro internacional', cif - fob], [`II (${im.ii}%)`, ii], [`IPI (${im.ipi}%)`, ipi],
      ['PIS (2,1%) e COFINS (9,65%)', pis + cofins], ['Despesas aduaneiras', im.despesas], [`ICMS (${im.icms}%)`, icms]],
    unit: Object.fromEntries(c.itens.map(i => [i.pid, fobM ? (i.custo * i.qtd / fobM) * total / i.qtd : 0])) };
}
const gerarTitulos = (total, cond) => {
  const d = DIAS[cond]; const base = Math.floor(total / d.length * 100) / 100;
  return d.map((dias, i) => ({ parcela: `${i + 1}/${d.length}`, venc: dataMais(dias), valor: i === d.length - 1 ? +(total - base * (d.length - 1)).toFixed(2) : base, pago: false }));
};

// Compara a nota do fornecedor com o pedido de compra
function comparar(itensPedido, itensNota) {
  const div = [];
  const ids = [...new Set([...itensPedido.map(i => i.pid), ...itensNota.map(i => i.pid)])];
  ids.forEach(pid => {
    const a = itensPedido.find(i => i.pid === pid), b = itensNota.find(i => i.pid === pid), n = prod(pid).name;
    if (!b) div.push(`${n}: não veio na nota`);
    else if (!a) div.push(`${n}: está na nota, mas não no pedido`);
    else {
      if (a.qtd !== b.qtd) div.push(`${n}: pedido ${a.qtd} un., nota ${b.qtd} un.`);
      if (Math.abs(a.custo - b.custo) > 0.009) div.push(`${n}: preço no pedido ${brl(a.custo)}, na nota ${brl(b.custo)}`);
    }
  });
  return div;
}

/* ---------- ETAPAS ---------- */
function passos(c) {
  const notaOk = c.nota && c.nota.status === 'ok';
  const pagos = c.titulos.length > 0 && c.titulos.every(t => t.pago);
  const abertos = c.titulos.filter(t => !t.pago).length;
  return [
    { k: 'pedido', nome: 'Pedido de compra', num: c.pedido || 'Entrada direta', feito: true },
    { k: 'nota', nome: 'Nota de entrada', num: c.nota ? `NF ${c.nota.numero}${c.nota.status === 'divergente' ? ' · divergente' : c.nota.status === 'transmitida' ? ' · transmitindo' : ''}` : c.origem === 'importacao' ? 'Após o desembaraço' : 'Aguardando o fornecedor', feito: notaOk, erro: c.nota?.status === 'divergente' },
    { k: 'receb', nome: 'Recebimento', num: c.conferido ? (c.conferencia?.divergencias.length ? 'Conferido com falta' : 'Conferido') : TRANSP[c.transp.status][0] + (atrasada(c) ? ' · atrasado' : ''), feito: c.conferido, erro: atrasada(c) || (c.conferencia?.divergencias.length > 0) },
    { k: 'pag', nome: 'Pagamento', num: pagos ? 'Quitado' : c.titulos.length ? `${abertos} ${abertos === 1 ? 'parcela' : 'parcelas'} a pagar` : 'Gerado ao concluir', feito: pagos },
  ];
}
function Etapas({ c, grande }) {
  const ps = passos(c); const atual = ps.findIndex(p => !p.feito);
  if (!grande) return (
    <span className="inline-flex items-center gap-1">
      {ps.map((p, i) => (
        <React.Fragment key={p.k}>
          {i > 0 && <span className={`w-3 h-[2px] ${p.feito || p.erro ? 'bg-estrutura' : 'bg-line'}`} />}
          <span title={p.nome} className={`w-2.5 h-2.5 rounded-full ${p.erro ? 'bg-bad' : p.feito ? 'bg-estrutura' : i === atual ? 'bg-acao-600' : 'bg-white border border-line'}`} />
        </React.Fragment>
      ))}
    </span>
  );
  return (
    <ol className="grid grid-cols-2 sm:grid-cols-4 gap-2">
      {ps.map((p, i) => {
        const at = i === atual && !p.erro;
        return (
          <li key={p.k} className={`rounded-card border px-3 py-2.5 min-w-0 ${p.erro ? 'border-bad bg-bad/5' : at ? 'border-acao-600 bg-acao-100' : p.feito ? 'border-estrutura/30 bg-white' : 'border-line bg-white'}`}>
            <span className="flex items-center gap-1.5">
              <span className={`w-5 h-5 shrink-0 rounded-full text-[11px] font-bold flex items-center justify-center ${p.erro ? 'bg-bad text-white' : p.feito ? 'bg-estrutura text-white' : at ? 'bg-acao-600 text-white' : 'bg-fundo text-ink-soft'}`}>{p.erro ? '!' : p.feito ? '✓' : i + 1}</span>
              <span className={`text-[13px] font-bold truncate ${at ? 'text-acao-700' : 'text-estrutura'}`}>{p.nome}</span>
            </span>
            <span className="block text-[11.5px] text-ink-soft mt-0.5 truncate tabular-nums">{p.num}</span>
          </li>
        );
      })}
    </ol>
  );
}

/* ---------- AÇÃO SUGERIDA (lista e recebimento) ---------- */
function acaoDe(c) {
  if (c.nota?.status === 'divergente') return { lbl: 'Resolver divergência', tom: 'bad' };
  if (chegou(c) && !c.conferido) return { lbl: 'Conferir mercadoria', tom: 'pri' };
  if (!c.nota && c.origem === 'importacao' && idxT(c) >= FLUXO.importacao.indexOf('desembaraco')) return { lbl: 'Emitir NF de entrada', tom: 'pri' };
  if (!c.nota && c.origem === 'nacional') return { lbl: 'Vincular nota', tom: atrasada(c) ? 'bad' : 'pri' };
  if (!c.conferido) return { lbl: 'Ver rastreio', tom: atrasada(c) ? 'bad' : 'sec' };
  if (c.titulos.some(t => !t.pago)) return { lbl: 'Ver pagamentos', tom: 'sec' };
  return { lbl: 'Ver compra', tom: 'sec' };
}
const tomCls = t => t === 'bad' ? 'bg-bad text-white hover:opacity-90' : t === 'pri' ? 'bg-acao-600 hover:bg-acao-700 text-white' : 'bg-white border-[1.5px] border-line text-estrutura hover:border-estrutura';

/* ---------- RECEBIMENTO (fila de chegadas) ---------- */

  const ativas = compras.filter(c => !c.conferido);
  const grupos = {
    caminho: { nome: 'A caminho', sub: 'Nacional em transporte', f: c => c.origem === 'nacional' && !chegou(c), icon: 'truck' },
    aduana: { nome: 'Importação', sub: 'Embarque, porto e aduana', f: c => c.origem === 'importacao' && !chegou(c), icon: 'ship' },
    atraso: { nome: 'Atrasadas', sub: 'Passou da previsão', f: c => atrasada(c), icon: 'alert' },
    conferir: { nome: 'A conferir', sub: 'Chegou na loja', f: c => chegou(c), icon: 'box' },
  };
  const lista = ativas.filter(c => filtro === 'todos' || grupos[filtro].f(c));

        {Object.entries(grupos).map(([k, g]) => {

              className={`text-left p-3.5 rounded-card border bg-white shadow-card ${on ? 'border-acao-600 ring-2 ring-acao-300' : 'border-line hover:border-estrutura'}`}>
              <span className="flex items-center justify-between"><span className="label">{g.nome}</span><span className={alerta ? 'text-bad' : 'text-estrutura'}><Icon n={g.icon} /></span></span>
              <span className={`display block text-2xl tabular-nums mt-1 ${alerta ? '!text-bad' : ''}`}>{n}</span>
              <span className="block text-[12px] text-ink-soft">{g.sub}</span>
            </button>
          );

      </div>
      <div className="bg-white border border-line rounded-card shadow-card overflow-hidden">

      </div>
    </div>
  );
}

      <p className="text-sm text-ink-soft max-w-3xl">O sistema consulta a SEFAZ e baixa o XML de toda nota emitida para o CNPJ {EMPRESA.cnpj}. Vincule ao pedido de compra (o sistema confere item a item), crie uma entrada direta quando não houve pedido, ou desconheça a operação se a nota não for sua.</p>
      <div className="flex gap-2">
        {[['Pendente', 'A tratar'], ['tratadas', 'Tratadas'], ['todas', 'Todas']].map(([k, l]) => (
          <button key={k} onClick={() => setFiltro(k)} aria-pressed={filtro === k}
            className={`px-4 py-2 rounded-full text-[13.5px] border ${filtro === k ? 'bg-estrutura border-estrutura text-white font-bold' : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>{l}</button>
        ))}
      </div>
      <div className="bg-white border border-line rounded-card shadow-card overflow-hidden">
        <ul className="divide-y divide-fundo">
          {lista.map(x => {
            const pedidoMatch = compras.find(c => c.pedido && !c.nota && c.fornecedor.doc === x.emitente.cnpj);
            const div = pedidoMatch ? comparar(pedidoMatch.itens, x.itens) : [];
            const tratada = x.usadaEm || x.manifestacao === 'Desconhecida';
            return (
              <li key={x.id} className="p-4 grid lg:grid-cols-[1fr_auto] gap-3 items-center">
                <div className="min-w-0 space-y-1">
                  <p className="text-sm"><strong className="text-estrutura tabular-nums">NF {x.numero}</strong> <span className="text-ink-soft">série {x.serie}</span> · <span className="font-semibold">{x.emitente.nome}</span></p>
                  <p className="text-[12px] text-ink-soft tabular-nums">{x.emitente.cnpj} · {x.emitente.uf} · emitida {x.data} · {x.itens.reduce((a, i) => a + i.qtd, 0)} un. · <strong className="text-estrutura">{brl(totalNota(x))}</strong></p>
                  <p className="flex flex-wrap gap-1.5 items-center">
                    <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${x.manifestacao === 'Desconhecida' ? 'bg-bad text-white' : x.manifestacao === 'Pendente' ? 'bg-fundo text-ink' : 'bg-ok text-white'}`}>Manifestação: {x.manifestacao === 'Pendente' ? 'pendente' : x.manifestacao.toLowerCase()}</span>
                    {x.usadaEm && <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-estrutura/10 text-estrutura">Vinculada a {x.usadaEm}</span>}
                    {!tratada && pedidoMatch && <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${div.length ? 'bg-bad text-white' : 'bg-ok/10 text-ok'}`}>{pedidoMatch.pedido}: {div.length ? `${div.length} ${div.length === 1 ? 'divergência' : 'divergências'}` : 'confere com o pedido'}</span>}
                    {!tratada && !pedidoMatch && <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-acao-100 text-acao-700">Sem pedido deste fornecedor</span>}
                  </p>
                  {!tratada && div.length > 0 && <ul className="text-[12px] text-bad list-disc pl-5">{div.map(d => <li key={d}>{d}</li>)}</ul>}
                </div>
                {!tratada && (
                  <div className="flex flex-wrap gap-2 lg:justify-end">
                    {pedidoMatch
                      ? <button onClick={() => vincular(pedidoMatch.id, x.id)} className={`px-4 py-2 rounded-full text-[13px] font-bold flex items-center gap-1.5 ${tomCls(div.length ? 'bad' : 'pri')}`}><Icon n="link" className="w-3.5 h-3.5" />Vincular ao {pedidoMatch.pedido}</button>
                      : <button onClick={() => criarEntrada(x.id)} className={`px-4 py-2 rounded-full text-[13px] font-bold flex items-center gap-1.5 ${tomCls('pri')}`}><Icon n="plus" className="w-3.5 h-3.5" />Criar entrada direta</button>}
                    <button onClick={() => desconhecer(x.id)} className="px-4 py-2 rounded-full text-[13px] font-bold bg-white border-[1.5px] border-line text-ink-soft hover:border-bad hover:text-bad">Desconhecer</button>
                  </div>
                )}
              </li>
            );
          })}
          {lista.length === 0 && <li className="p-10 text-center text-sm text-ink-soft">Nenhuma nota nesta situação.</li>}
        </ul>
      </div>
    </div>
  );
}

/* ---------- EDITOR / DETALHE ---------- */
function Editor({ compra: inicial, salvar, voltar, notify, proxNum, notas, vincular, recusarNota }) {
  const [c, setC] = useState(inicial);
  const [busca, setBusca] = useState('');
  const [hl, setHl] = useState(0);
  const [erro, setErro] = useState('');
  const [recebido, setRecebido] = useState({});
  const buscaRef = useRef(null);
  useEffect(() => setC(inicial), [inicial]);
  const novo = !inicial.pedido && !inicial.nota;
  const editavel = novo || !c.nota;
  const k = custos(c);
  const imp = c.origem === 'importacao';
  const up = patch => setC(x => ({ ...x, ...patch }));
  const upF = patch => setC(x => ({ ...x, fornecedor: { ...x.fornecedor, ...patch } }));
  const upI = patch => setC(x => ({ ...x, imp: { ...x.imp, ...patch } }));
  const upT = patch => setC(x => ({ ...x, transp: { ...x.transp, ...patch } }));
  const gravar = () => !novo && salvar(c);

  const mudarOrigem = o => setC(x => ({ ...x, origem: o,
    fornecedor: { ...x.fornecedor, pais: o === 'nacional' ? 'Brasil' : (x.fornecedor.pais === 'Brasil' ? 'Japão' : x.fornecedor.pais) },
    imp: x.imp || { moeda: 'USD', cambio: MOEDAS.USD, di: '', freteInt: 0, seguro: 0, ii: 18, ipi: 9.75, icms: 18, despesas: 0 },
    itens: x.itens.map(i => ({ ...i, custo: o === 'importacao' ? (prod(i.pid).fob || 1) : prod(i.pid).custo })),
    transp: { ...x.transp, status: FLUXO[o][0] } }));

  const resultados = useMemo(() => {
    const t = busca.trim().toLowerCase(); if (t.length < 2) return [];
    return PRODUTOS.filter(p => p.name.toLowerCase().includes(t) || p.code.includes(t)).slice(0, 6);
  }, [busca]);
  useEffect(() => setHl(0), [busca]);
  const addItem = p => {
    setC(x => { const ex = x.itens.find(i => i.pid === p.id);
      return { ...x, itens: ex ? x.itens.map(i => i.pid === p.id ? { ...i, qtd: i.qtd + 1 } : i) : [...x.itens, { pid: p.id, qtd: 1, custo: imp ? (p.fob || 1) : p.custo }] }; });
    setBusca(''); buscaRef.current?.focus();
  };
  const setItem = (pid, patch) => setC(x => ({ ...x, itens: x.itens.map(i => i.pid === pid ? { ...i, ...patch } : i) }));
  const del = pid => setC(x => ({ ...x, itens: x.itens.filter(i => i.pid !== pid) }));

  const salvarPedido = () => {
    if (!c.itens.length) return setErro('Adicione pelo menos um produto.');
    if (!c.fornecedor.nome.trim()) return setErro('Informe o fornecedor.');
    if (!imp && !ehCNPJ(c.fornecedor.doc)) return setErro('Fornecedor nacional precisa de CNPJ (é por ele que a nota é vinculada).');
    setErro('');
    const num = c.pedido || `PC-0${proxNum('PC')}`;
    const doc = { ...c, pedido: num, criado: c.criado || `05/10 · ${agoraHora()}`,
      transp: { ...c.transp, eventos: c.transp.eventos.length ? c.transp.eventos : [{ quando: `05/10 · ${agoraHora()}`, texto: 'Pedido de compra emitido', local: 'ADEGA SB' }] } };
    salvar(doc); notify(`Pedido de compra ${num} salvo`);
    if (novo) voltar();
  };
  const enviarPedido = () => {
    if (!emailOk(c.fornecedor.email || '')) return setErro('Cadastre o e-mail do fornecedor para enviar o pedido.');
    setErro(''); salvar({ ...c, envios: [{ quando: `05/10 · ${agoraHora()}`, para: c.fornecedor.email }, ...(c.envios || [])] });
    notify(`PDF do ${c.pedido} enviado para ${c.fornecedor.email}`);
  };
  // Importação: a própria loja emite a NF-e de entrada (CFOP 3102) com base na DI/DUIMP
  const emitirEntrada = () => {
    if (!c.imp.di.trim()) return setErro('Informe o número da DI ou DUIMP para emitir a nota de entrada.');
    setErro('');
    const nota = { tipo: 'propria', numero: String(proxNum('NF')).padStart(6, '0'), serie: '1', chave: '', em: `05/10 · ${agoraHora()}`, status: 'transmitida', divergencias: [], manifestacao: '—', itens: c.itens };
    const doc = { ...c, nota }; salvar(doc);
    setTimeout(() => { salvar({ ...doc, nota: { ...nota, status: 'ok', chave: chave44() } }); notify(`NF-e de entrada ${nota.numero} autorizada (CFOP 3102)`); }, 1300);
  };
  const aceitarDivergencia = () => { salvar({ ...c, nota: { ...c.nota, status: 'ok', aceitaCom: c.nota.divergencias } }); notify(`Nota ${c.nota.numero} aceita com divergência`); };

  const esperado = pid => (c.nota?.itens.find(i => i.pid === pid) || c.itens.find(i => i.pid === pid)).qtd;
  const qtdRec = pid => recebido[pid] ?? esperado(pid);
  const faltas = c.itens.map(i => ({ pid: i.pid, esp: esperado(i.pid), rec: qtdRec(i.pid) })).filter(x => x.rec !== x.esp);
  const concluir = () => {
    if (!c.nota || c.nota.status !== 'ok') return setErro(imp ? 'Emita a NF-e de entrada antes de concluir.' : 'Vincule a nota do fornecedor antes de concluir o recebimento.');
    setErro('');
    const divs = faltas.map(f => `${prod(f.pid).name}: esperado ${f.esp}, recebido ${f.rec}`);
    const somar = c.itens.reduce((a, i) => a + qtdRec(i.pid), 0);
    c.itens.forEach(i => { prod(i.pid).stock += qtdRec(i.pid); });
    salvar({ ...c, conferido: true, concluida: true, conferencia: { em: `05/10 · ${agoraHora()}`, divergencias: divs },
      nota: { ...c.nota, manifestacao: c.nota.tipo === 'fornecedor' ? 'Confirmada' : c.nota.manifestacao },
      titulos: gerarTitulos(k.total, c.condicao) });
    notify(`Recebimento concluído: +${somar} un. no estoque e ${DIAS[c.condicao].length} ${DIAS[c.condicao].length === 1 ? 'título' : 'títulos'} a pagar`);
  };
  const pagar = i => { salvar({ ...c, titulos: c.titulos.map((t, j) => j === i ? { ...t, pago: true } : t) }); notify(`Parcela ${c.titulos[i].parcela} paga`); };

  const fluxo = FLUXO[c.origem]; const it = idxT(c);
  const podeEmitirImp = imp && !c.nota && !novo && it >= fluxo.indexOf('desembaraco');

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="display text-[21px] pn:text-[26px] leading-tight">
          {novo ? 'Novo pedido de compra' : (c.pedido || 'Entrada direta')}
          <span className="font-body text-[14.5px] font-normal text-ink-soft"> - {novo ? 'escolha a origem, o fornecedor e os produtos' : `${ORIGENS[c.origem].nome} · ${c.fornecedor.nome}`}</span>
        </h1>
        <button onClick={voltar} className="px-4 py-2 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center gap-1.5"><Icon n="back" />Voltar</button>
      </div>

      {!novo && <Etapas c={c} grande />}

      {c.nota?.status === 'divergente' && (
        <div className="p-3.5 rounded-card border border-bad bg-bad/5 text-sm space-y-2">
          <p className="flex gap-2"><span className="text-bad shrink-0"><Icon n="alert" className="w-5 h-5" /></span>
            <span><strong className="text-bad">A NF {c.nota.numero} não confere com o pedido.</strong> Fale com o fornecedor antes de aceitar.</span></p>
          <ul className="list-disc pl-10 text-bad text-[13px]">{c.nota.divergencias.map(d => <li key={d}>{d}</li>)}</ul>
        </div>
      )}

      <div className="grid pn:grid-cols-[1fr_340px] xl:grid-cols-[1fr_656px] gap-4 items-start">
        {/* DOCUMENTO */}
        <div className="space-y-4 min-w-0">
          <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-4">
            <div>
              <span className="label mb-2">Origem da compra</span>
              <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Origem da compra">
                {Object.entries(ORIGENS).map(([key, o]) => (
                  <button key={key} role="radio" aria-checked={c.origem === key} disabled={!novo} onClick={() => mudarOrigem(key)}
                    className={`flex items-center gap-3 p-3 rounded-card border text-left disabled:cursor-not-allowed ${c.origem === key ? 'bg-acao-100 border-acao-600' : 'bg-white border-line enabled:hover:border-estrutura disabled:opacity-50'}`}>
                    <span className={`w-9 h-9 shrink-0 rounded-full flex items-center justify-center ${c.origem === key ? 'bg-acao-600 text-white' : 'bg-fundo text-estrutura'}`}><Icon n={o.icon} /></span>
                    <span className="min-w-0"><span className={`block text-sm font-bold ${c.origem === key ? 'text-acao-700' : 'text-estrutura'}`}>{o.nome}</span><span className="block text-xs text-ink-soft">{o.desc}</span></span>
                  </button>
                ))}
              </div>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Campo id="f-nome" label="Fornecedor">
                <input id="f-nome" className={inputCls} disabled={!editavel} value={c.fornecedor.nome} onChange={e => upF({ nome: e.target.value })} onBlur={gravar} placeholder="Razão social" />
              </Campo>
              {imp ? (
                <Campo id="f-pais" label="País de origem">
                  <input id="f-pais" className={inputCls} disabled={!editavel} value={c.fornecedor.pais} onChange={e => upF({ pais: e.target.value })} onBlur={gravar} />
                </Campo>
              ) : (<>
                <Campo id="f-doc" label="CNPJ" hint="A nota do fornecedor é encontrada por ele">
                  <input id="f-doc" className={`${inputCls} tabular-nums`} disabled={!editavel} value={c.fornecedor.doc} onChange={e => upF({ doc: e.target.value })} onBlur={gravar} placeholder="00.000.000/0000-00" />
                </Campo>
                <Campo id="f-uf" label="UF do fornecedor">
                  <select id="f-uf" className={inputCls} disabled={!editavel} value={c.fornecedor.uf} onChange={e => upF({ uf: e.target.value })} onBlur={gravar}>{UFS.map(u => <option key={u}>{u}</option>)}</select>
                </Campo>
              </>)}
              <Campo id="f-email" label="E-mail do fornecedor" hint="Recebe o PDF do pedido de compra">
                <input id="f-email" type="email" className={inputCls} value={c.fornecedor.email} onChange={e => upF({ email: e.target.value.trim() })} onBlur={gravar} placeholder="pedidos@fornecedor.com" />
              </Campo>
            </div>
            {imp && (
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3 border-t border-fundo">
                <Campo id="i-moeda" label="Moeda">
                  <select id="i-moeda" className={inputCls} disabled={!editavel} value={c.imp.moeda} onChange={e => upI({ moeda: e.target.value, cambio: MOEDAS[e.target.value] })} onBlur={gravar}>{Object.keys(MOEDAS).map(m => <option key={m}>{m}</option>)}</select>
                </Campo>
                <Campo id="i-cambio" label="Câmbio (R$)">
                  <input id="i-cambio" type="number" step="0.0001" className={`${inputCls} tabular-nums`} disabled={!editavel} value={c.imp.cambio} onChange={e => upI({ cambio: Number(e.target.value) || 0 })} onBlur={gravar} />
                </Campo>
                <div className="col-span-2">
                  <Campo id="i-di" label="DI / DUIMP" hint="Número do registro na Receita Federal">
                    <input id="i-di" className={`${inputCls} tabular-nums`} disabled={!!c.nota} value={c.imp.di} onChange={e => upI({ di: e.target.value })} onBlur={gravar} placeholder="26/0000000-0" />
                  </Campo>
                </div>
              </div>
            )}
          </section>

          {/* Itens */}
          <section className="bg-white border border-line rounded-card shadow-card overflow-hidden">
            <div className="flex items-center justify-between px-4 py-3 border-b border-line">
              <h2 className="display text-base">Produtos <span className="text-[11px] font-bold px-2 py-0.5 bg-acao-100 text-acao-700 rounded-full font-body tabular-nums align-middle">{c.itens.reduce((a, i) => a + i.qtd, 0)}</span></h2>
              <span className="text-[12px] text-ink-soft">{imp ? `Preço em ${c.imp.moeda}, custo final em R$` : 'Custo final já com frete e desconto'}</span>
            </div>
            {editavel && (
              <div className="relative p-3 border-b border-line">
                <span className="absolute left-7 top-1/2 -translate-y-1/2 text-ink-soft"><Icon n="search" /></span>
                <label htmlFor="busca" className="sr-only">Adicionar produto</label>
                <input id="busca" ref={buscaRef} value={busca} onChange={e => setBusca(e.target.value)} autoComplete="off"
                  onKeyDown={e => {
                    if (e.key === 'ArrowDown') { e.preventDefault(); setHl(h => Math.min(h + 1, resultados.length - 1)); }
                    if (e.key === 'ArrowUp') { e.preventDefault(); setHl(h => Math.max(h - 1, 0)); }
                    if (e.key === 'Enter') { const ex = PRODUTOS.find(p => p.code === busca.trim()); if (ex) addItem(ex); else if (resultados[hl]) addItem(resultados[hl]); }
                  }}
                  placeholder="Código de barras ou nome para adicionar" className="w-full pl-10 pr-4 py-2.5 bg-white border border-line rounded-full text-sm" />
                {resultados.length > 0 && (
                  <ul className="absolute z-20 left-3 right-3 top-full mt-1 bg-white border border-line rounded-card shadow-soft overflow-hidden">
                    {resultados.map((p, i) => (
                      <li key={p.id}>
                        <button onMouseEnter={() => setHl(i)} onMouseDown={e => e.preventDefault()} onClick={() => addItem(p)}
                          className={`w-full grid grid-cols-[1fr_auto] gap-3 items-center px-4 py-2.5 text-left border-l-[3px] ${i === hl ? 'bg-acao-100 border-acao-600' : 'border-transparent'}`}>
                          <span className="min-w-0"><span className="block text-sm font-semibold truncate">{p.name}</span><span className="block text-[11.5px] text-ink-soft tabular-nums">#{p.code} · estoque {p.stock} un.</span></span>
                          <span className="font-display font-bold text-estrutura tabular-nums">{imp ? moeda(p.fob || 1, c.imp.moeda) : brl(p.custo)}</span>
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            )}
            <div className="hidden sm:grid grid-cols-[1fr_96px_110px_104px_32px] gap-3 px-4 py-2 bg-fundo/40 border-b border-line">
              {['Produto', 'Qtd', imp ? `Preço (${c.imp.moeda})` : 'Custo un.', 'Custo final un.', ''].map((h, i) => <span key={i} className={`label ${i >= 2 && i < 4 ? 'text-right' : ''} ${i === 1 ? 'text-center' : ''}`}>{h}</span>)}
            </div>
            <ul className="divide-y divide-fundo">
              {c.itens.map(i => { const p = prod(i.pid); return (
                <li key={i.pid} className="grid grid-cols-[1fr_auto] sm:grid-cols-[1fr_96px_110px_104px_32px] gap-x-3 gap-y-2 items-center px-4 py-3">
                  <span className="min-w-0"><span className="block text-sm font-semibold truncate">{p.name}</span><span className="block text-[11.5px] text-ink-soft tabular-nums">#{p.code} · NCM {p.ncm} · estoque {p.stock}</span></span>
                  <span className="sm:hidden justify-self-end font-display font-bold text-estrutura tabular-nums">{brl(k.unit[i.pid] || 0)}</span>
                  {editavel
                    ? <input aria-label={`Quantidade de ${p.name}`} value={i.qtd} onChange={e => setItem(i.pid, { qtd: Math.max(1, Number(e.target.value.replace(/\D/g, '')) || 1) })}
                        className="w-full max-w-[96px] px-3 py-1.5 border border-line rounded-full text-center text-sm font-bold text-estrutura tabular-nums" />
                    : <span className="text-sm font-bold text-estrutura tabular-nums sm:text-center">{i.qtd} un.</span>}
                  {editavel
                    ? <input aria-label={`Custo de ${p.name}`} type="number" step="0.01" value={i.custo} onChange={e => setItem(i.pid, { custo: Number(e.target.value) || 0 })}
                        className="w-full max-w-[110px] justify-self-end px-3 py-1.5 border border-line rounded-full text-right text-[13px] tabular-nums" />
                    : <span className="text-right text-[13px] text-ink-soft tabular-nums">{imp ? moeda(i.custo, c.imp.moeda) : brl(i.custo)}</span>}
                  <span className="hidden sm:block text-right font-display font-bold text-estrutura tabular-nums" title="Custo que vai para o estoque">{brl(k.unit[i.pid] || 0)}</span>
                  {editavel ? <button onClick={() => del(i.pid)} aria-label={`Remover ${p.name}`} className="justify-self-end p-1.5 text-ink-soft hover:text-acao-700 hover:bg-acao-100 rounded-panel"><Icon n="trash" /></button> : <span className="hidden sm:block" />}
                </li>
              ); })}
              {c.itens.length === 0 && <li className="p-8 text-center text-sm text-ink-soft">Nenhum produto. Use a busca acima.</li>}
            </ul>
          </section>
        </div>

        {/* COLUNAS DA DIREITA */}
        <aside className="grid gap-4 items-start xl:grid-cols-2">
          <div className="space-y-4 min-w-0">
            <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-3">
              <h2 className="display text-base">{imp ? 'Custo de importação' : 'Resumo'}</h2>
              {imp && editavel && (
                <div className="grid grid-cols-2 gap-2">
                  {[['freteInt', `Frete int. (${c.imp.moeda})`], ['seguro', `Seguro (${c.imp.moeda})`], ['ii', 'II (%)'], ['ipi', 'IPI (%)'], ['icms', 'ICMS (%)'], ['despesas', 'Despesas (R$)']].map(([f, l]) => (
                    <Campo key={f} id={`i-${f}`} label={l}>
                      <input id={`i-${f}`} type="number" step="0.01" className={`${inputCls} !py-1.5 tabular-nums`} value={c.imp[f]} onChange={e => upI({ [f]: Number(e.target.value) || 0 })} onBlur={gravar} />
                    </Campo>
                  ))}
                </div>
              )}
              {!imp && editavel && (
                <div className="space-y-2 text-sm">
                  {[['frete', 'Frete (R$)'], ['desconto', 'Desconto (R$)']].map(([f, l]) => (
                    <div key={f} className="flex justify-between items-center text-ink-soft">
                      <label htmlFor={f}>{l}</label>
                      <input id={f} type="number" min="0" step="0.01" value={c[f] || ''} placeholder="0,00" onChange={e => up({ [f]: Math.max(0, Number(e.target.value)) })} onBlur={gravar}
                        className="w-28 px-3 py-1.5 bg-white border border-line rounded-full text-right text-[13px] tabular-nums" />
                    </div>
                  ))}
                </div>
              )}
              <dl className="text-[13px] space-y-1">
                {k.linhas.filter(([, v]) => v !== 0).map(([l, v]) => (
                  <div key={l} className="flex justify-between gap-3 text-ink-soft"><dt>{l}</dt><dd className="tabular-nums">{v < 0 ? `− ${brl(-v)}` : brl(v)}</dd></div>
                ))}
              </dl>
              <div className="rounded-card bg-acao-100 border border-acao-300 px-4 py-3">
                <span className="label">{imp ? 'Custo total nacionalizado' : 'Total da compra'}</span>
                <span className="display block text-[28px] leading-tight tabular-nums">{brl(k.total)}</span>
              </div>
              {imp && <p className="text-[11.5px] text-ink-soft">Simulação. Os créditos de IPI, PIS, COFINS e ICMS dependem do seu regime tributário.</p>}
              <Campo id="cond" label="Condição de pagamento">
                <select id="cond" className={inputCls} disabled={c.concluida} value={c.condicao} onChange={e => up({ condicao: e.target.value })} onBlur={gravar}>{CONDICOES.map(x => <option key={x}>{x}</option>)}</select>
              </Campo>
            </section>

            {/* Nota de entrada */}
            <section className={`bg-white border rounded-card shadow-card p-4 space-y-2.5 ${c.nota?.status === 'divergente' ? 'border-bad' : 'border-line'}`}>
              <div className="flex items-center justify-between gap-2"><h2 className="display text-base">Nota de entrada</h2><NotaBadge c={c} /></div>
              <dl className="text-[13px] space-y-1.5">
                <div className="flex justify-between gap-3"><dt className="text-ink-soft">CFOP de entrada</dt><dd className="font-bold text-estrutura tabular-nums">{cfopEntrada(c)}</dd></div>
                <p className="text-[11.5px] text-ink-soft -mt-1">{CFOP_DESC[cfopEntrada(c)]}</p>
                <div className="flex justify-between gap-3"><dt className="text-ink-soft">Emitida por</dt><dd className="font-semibold text-right">{imp ? 'ADEGA SB (importadora)' : 'Fornecedor'}</dd></div>
                {c.nota && <div className="flex justify-between gap-3"><dt className="text-ink-soft">Número / série</dt><dd className="font-bold text-estrutura tabular-nums">{c.nota.numero} / {c.nota.serie}</dd></div>}
                {c.nota?.tipo === 'fornecedor' && <div className="flex justify-between gap-3"><dt className="text-ink-soft">Manifestação</dt><dd className="font-semibold">{c.nota.manifestacao}</dd></div>}
              </dl>
              {c.nota?.chave && <p className="text-[11px] text-ink-soft tabular-nums break-all select-all">Chave {c.nota.chave}</p>}
              {c.nota?.aceitaCom && <p className="text-[12px] text-warn font-semibold">Aceita com {c.nota.aceitaCom.length} {c.nota.aceitaCom.length === 1 ? 'divergência' : 'divergências'} registradas.</p>}

              {!c.nota && !novo && !imp && (() => {
                const doForn = notas.filter(x => !x.usadaEm && x.manifestacao !== 'Desconhecida' && x.emitente.cnpj === c.fornecedor.doc);
                return doForn.length
                  ? doForn.map(x => { const div = comparar(c.itens, x.itens); return (
                      <BtnPri key={x.id} onClick={() => vincular(c.id, x.id)} className={div.length ? '!bg-bad !shadow-none' : ''}><Icon n="link" />Vincular NF {x.numero}{div.length ? ` (${div.length} divergência${div.length > 1 ? 's' : ''})` : ''}</BtnPri>
                    ); })
                  : <p className="text-[12.5px] text-ink-soft flex gap-1.5"><Icon n="doc" className="w-4 h-4 shrink-0 mt-0.5 text-estrutura" />Nenhuma nota deste CNPJ na SEFAZ ainda. Ela aparece aqui sozinha quando o fornecedor faturar.</p>;
              })()}
              {podeEmitirImp && <BtnPri onClick={emitirEntrada}><Icon n="doc" />Emitir NF-e de entrada (3102)</BtnPri>}
              {imp && !c.nota && !novo && !podeEmitirImp && <p className="text-[12.5px] text-ink-soft">A nota de entrada é emitida quando a carga entra em desembaraço.</p>}
              {c.nota?.status === 'divergente' && (
                <div className="grid grid-cols-2 gap-2">
                  <BtnSec onClick={aceitarDivergencia}>Aceitar assim</BtnSec>
                  <BtnSec onClick={() => recusarNota(c.id)} className="hover:!border-bad hover:!text-bad">Recusar nota</BtnSec>
                </div>
              )}
            </section>

            {/* Contas a pagar */}
            {c.titulos.length > 0 && (
              <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-2.5">
                <div className="flex items-center justify-between"><h2 className="display text-base">Contas a pagar</h2><span className="text-[12px] text-ink-soft tabular-nums">{c.condicao}</span></div>
                <ul className="divide-y divide-fundo">
                  {c.titulos.map((t, i) => (
                    <li key={i} className="flex items-center gap-3 py-2">
                      <span className="flex-1 min-w-0"><span className="block text-[13px] font-bold text-estrutura tabular-nums">{t.parcela} · {brl(t.valor)}</span><span className="block text-[11.5px] text-ink-soft tabular-nums">Vence {t.venc}</span></span>
                      {t.pago ? <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-ok text-white">Paga</span>
                        : <button onClick={() => pagar(i)} className="px-3 py-1.5 rounded-full text-[12.5px] font-bold bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura">Marcar paga</button>}
                    </li>
                  ))}
                </ul>
              </section>
            )}
          </div>

          <div className="space-y-4 min-w-0">
            {/* Transporte e recebimento */}
            <section className={`bg-white border rounded-card shadow-card p-4 space-y-3 ${atrasada(c) ? 'border-bad' : 'border-line'}`}>
              <div className="flex items-center justify-between gap-2"><h2 className="display text-base">Recebimento</h2>{c.conferido ? <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-ok text-white">Conferido</span> : <TranspBadge c={c} />}</div>
              <ol className="flex items-center gap-1" aria-label="Progresso do transporte">
                {fluxo.map((s, i) => <li key={s} title={TRANSP[s][0]} className={`h-1.5 flex-1 rounded-full ${i <= it ? (chegou(c) ? 'bg-ok' : 'bg-estrutura') : 'bg-fundo'}`} />)}
              </ol>
              <div className="grid grid-cols-2 gap-2">
                <div className="col-span-2"><Campo id="t-transp" label="Transportadora">
                  <input id="t-transp" className={inputCls} disabled={c.conferido} value={c.transp.transportadora} onChange={e => upT({ transportadora: e.target.value })} onBlur={gravar} placeholder={imp ? 'Armador ou companhia aérea' : 'Quem entrega'} />
                </Campo></div>
                <Campo id="t-cod" label={imp ? 'BL / AWB' : 'Código de rastreio'}>
                  <input id="t-cod" className={`${inputCls} tabular-nums uppercase`} disabled={c.conferido} value={c.transp.codigo} onChange={e => upT({ codigo: e.target.value.toUpperCase() })} onBlur={gravar} placeholder="Opcional" />
                </Campo>
                <Campo id="t-prev" label="Previsão (dd/mm)">
                  <input id="t-prev" className={`${inputCls} tabular-nums ${atrasada(c) ? '!border-bad text-bad font-bold' : ''}`} disabled={c.conferido} value={c.transp.previsao} onChange={e => upT({ previsao: e.target.value })} onBlur={gravar} placeholder="00/00" />
                </Campo>
              </div>
              {!chegou(c) && !novo && (
                <BtnSec onClick={() => { const n = avancar(c); salvar(n); notify(`${c.pedido}: ${TRANSP[n.transp.status][0].toLowerCase()}`); }}>
                  <Icon n="truck" />{it === fluxo.length - 2 ? 'Registrar chegada na loja' : 'Atualizar rastreio'}
                </BtnSec>
              )}

              {/* Conferência */}
              {chegou(c) && !c.conferido && (
                <div className="rounded-card border border-acao-600 bg-acao-100/40 p-3 space-y-2.5">
                  <span className="label">Conferência · conte o que chegou</span>
                  <ul className="space-y-2">
                    {c.itens.map(i => { const esp = esperado(i.pid); const r = qtdRec(i.pid); return (
                      <li key={i.pid} className="grid grid-cols-[1fr_auto_76px] gap-2 items-center">
                        <span className="min-w-0 text-[12.5px] font-semibold truncate">{prod(i.pid).name}</span>
                        <span className="text-[11.5px] text-ink-soft tabular-nums whitespace-nowrap">de {esp}</span>
                        <input aria-label={`Recebido de ${prod(i.pid).name}`} value={r} onChange={e => setRecebido(x => ({ ...x, [i.pid]: Math.max(0, Number(e.target.value.replace(/\D/g, '')) || 0) }))}
                          className={`px-2 py-1.5 border rounded-full text-center text-sm font-bold tabular-nums ${r !== esp ? 'border-bad text-bad' : 'border-line text-estrutura'}`} />
                      </li>
                    ); })}
                  </ul>
                  {faltas.length > 0 && <p className="text-[12px] text-bad font-semibold">{faltas.length} {faltas.length === 1 ? 'item diferente' : 'itens diferentes'} da nota. O recebimento fica registrado com a diferença.</p>}
                  <BtnPri onClick={concluir}><Icon n="check" />{faltas.length ? 'Concluir com diferença' : 'Concluir recebimento'}</BtnPri>
                  <p className="text-[11.5px] text-ink-soft text-center">Ao concluir: estoque atualizado, nota confirmada na SEFAZ e parcelas lançadas.</p>
                </div>
              )}
              {c.conferido && c.conferencia && (
                <div className="text-[12.5px] space-y-1">
                  <p className="text-ok font-semibold flex gap-1.5"><Icon n="check" className="w-4 h-4" />Conferido em {c.conferencia.em}</p>
                  {c.conferencia.divergencias.map(d => <p key={d} className="text-bad">{d}</p>)}
                </div>
              )}

              <div>
                <span className="label mb-2">Histórico</span>
                <ol className="relative border-l-2 border-fundo ml-1.5 space-y-3">
                  {c.transp.eventos.map((e, i) => (
                    <li key={i} className="pl-4 relative">
                      <span className={`absolute -left-[7px] top-1 w-3 h-3 rounded-full border-2 border-white ${i === 0 ? (chegou(c) ? 'bg-ok' : 'bg-acao-600') : 'bg-line'}`} />
                      <span className={`block text-[13px] ${i === 0 ? 'font-bold text-estrutura' : ''}`}>{e.texto}</span>
                      <span className="block text-[11.5px] text-ink-soft tabular-nums">{e.quando} · {e.local}</span>
                    </li>
                  ))}
                  {c.transp.eventos.length === 0 && <li className="pl-4 text-[12.5px] text-ink-soft">Os eventos aparecem depois de salvar o pedido.</li>}
                </ol>
              </div>
            </section>

            {/* Ações */}
            <section className="space-y-2">
              {erro && <p className="text-[13px] text-bad font-semibold px-1">{erro}</p>}
              {editavel && <BtnPri onClick={salvarPedido} className="!py-3.5"><Icon n="clip" className="w-5 h-5" />{novo ? 'Salvar pedido de compra' : 'Salvar alterações'}</BtnPri>}
              {!novo && c.pedido && !c.concluida && (
                <BtnSec onClick={enviarPedido}><Icon n="mail" />Enviar pedido ao fornecedor (PDF)</BtnSec>
              )}
              {(c.envios || []).length > 0 && (
                <p className="text-[11.5px] text-ink-soft px-1">Pedido enviado {c.envios.length}× · último em {c.envios[0].quando} para {c.envios[0].para}</p>
              )}
            </section>
          </div>
        </aside>
      </div>
    </div>
  );
}

/* ---------- APP ---------- */
function App() {
  const [compras, setCompras] = useState(COMPRAS_INICIAIS);
  const [notas, setNotas] = useState(NOTAS_SEFAZ);
  const [view, setView] = useState({ tela: 'lista' });
  const [toast, setToast] = useState(null);
  const cont = useRef({ PC: 331, EN: 46, NF: 4535 });
  const tRef = useRef(null);
  const notify = m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), 3400); };
  const proxNum = k => cont.current[k]++;

  const salvar = c => setCompras(cs => cs.some(x => x.id === c.id) ? cs.map(x => x.id === c.id ? c : x) : [c, ...cs]);

  const vincular = (cid, xid) => {
    const x = notas.find(n => n.id === xid); const c = compras.find(k => k.id === cid);
    const div = comparar(c.itens, x.itens);
    salvar({ ...c, nota: { tipo: 'fornecedor', numero: x.numero, serie: x.serie, chave: x.chave, em: x.data, status: div.length ? 'divergente' : 'ok', divergencias: div, manifestacao: 'Ciência', itens: x.itens, xml: x.id },
      transp: c.transp.status === 'aguardando' ? avancar(c).transp : c.transp });
    setNotas(ns => ns.map(n => n.id === xid ? { ...n, usadaEm: c.pedido, manifestacao: 'Ciência' } : n));
    notify(div.length ? `NF ${x.numero} vinculada ao ${c.pedido} com ${div.length} divergência(s)` : `NF ${x.numero} vinculada ao ${c.pedido} · confere com o pedido`);
    setView({ tela: 'editor', id: cid, de: view.tela === 'editor' ? view.de : view.tela });
  };
  const recusarNota = cid => {
    const c = compras.find(k => k.id === cid);
    setNotas(ns => ns.map(n => n.id === c.nota.xml ? { ...n, usadaEm: null, manifestacao: 'Desconhecida' } : n));
    salvar({ ...c, nota: null }); notify(`NF ${c.nota.numero} recusada e operação desconhecida na SEFAZ`);
  };
  const criarEntrada = xid => {
    const x = notas.find(n => n.id === xid); const id = 'e' + Date.now(); const num = `EN-00${proxNum('EN')}`;
    const c = { id, pedido: num, origem: 'nacional', criado: x.data, concluida: false, conferido: false,
      fornecedor: { nome: x.emitente.nome, doc: x.emitente.cnpj, ie: '', uf: x.emitente.uf, email: '', pais: 'Brasil' },
      itens: x.itens.map(i => ({ ...i })), frete: x.frete, desconto: 0, condicao: '28 dias', titulos: [], envios: [],
      nota: { tipo: 'fornecedor', numero: x.numero, serie: x.serie, chave: x.chave, em: x.data, status: 'ok', divergencias: [], manifestacao: 'Ciência', itens: x.itens, xml: x.id },
      transp: { transportadora: 'Transportadora do fornecedor', codigo: '', previsao: '', status: 'transito', eventos: [{ quando: x.data, texto: 'Nota emitida pelo fornecedor; mercadoria em trânsito', local: x.emitente.uf }] } };
    setCompras(cs => [c, ...cs]);
    setNotas(ns => ns.map(n => n.id === xid ? { ...n, usadaEm: num, manifestacao: 'Ciência' } : n));
    notify(`Entrada direta ${num} criada a partir da NF ${x.numero}`);
    setView({ tela: 'editor', id, de: 'notas' });
  };
  const desconhecer = xid => { setNotas(ns => ns.map(n => n.id === xid ? { ...n, manifestacao: 'Desconhecida' } : n)); notify('Operação desconhecida: a SEFAZ registra que essa compra não é sua'); };

  const novo = () => {
    const id = 'n' + Date.now();
    setView({ tela: 'editor', id, de: 'lista', rascunho: { id, pedido: null, origem: 'nacional', criado: null, concluida: false, conferido: false,
      fornecedor: { nome: '', doc: '', ie: '', uf: 'SP', email: '', pais: 'Brasil' }, itens: [], frete: 0, desconto: 0, condicao: '28 dias',
      nota: null, titulos: [], envios: [], transp: { transportadora: '', codigo: '', previsao: '', status: 'aguardando', eventos: [] } } });
  };
  const abrir = id => setView({ tela: 'editor', id, de: view.tela === 'editor' ? view.de : view.tela });

  const atual = view.tela === 'editor' ? (compras.find(c => c.id === view.id) || view.rascunho) : null;
  const pendNotas = notas.filter(x => !x.usadaEm && x.manifestacao !== 'Desconhecida').length;
  const pendReceb = compras.filter(c => !c.conferido && (chegou(c) || atrasada(c))).length;
  const abas = [['lista', 'Compras', 0], ['receb', 'Recebimento', pendReceb], ['notas', 'Notas recebidas', pendNotas]];

  return (
    <div className="min-h-full flex flex-col bg-fundo font-body text-ink">
      <header className="bg-estrutura border-b border-white/10 shrink-0">
        <div className="flex items-center justify-between gap-3 px-4 pn:px-6 py-3">
          <div className="flex items-center gap-3 min-w-0">
            <img src={LOGO} alt="ADEGA SB" className="h-10 sm:h-11 w-auto shrink-0" />
            <div className="min-w-0">
              <p className="sr-only">ADEGA SB</p>
              <p className="text-[10.5px] font-extrabold uppercase tracking-[.1em] text-white/70 truncate">ERP · Compras · {hoje}</p>
            </div>
          </div>
          <nav className="flex gap-1.5 overflow-x-auto scrollbar-none" aria-label="Seções de compras">
            {abas.map(([key, l, n]) => {
              const on = view.tela === key || (view.tela === 'editor' && (view.de || 'lista') === key);
              return (
                <button key={key} onClick={() => setView({ tela: key })} aria-current={on ? 'page' : undefined}
                  className={`px-3.5 py-2 rounded-full text-[13.5px] whitespace-nowrap flex items-center gap-1.5 ${on ? 'bg-acao-600 text-white font-bold' : 'text-white/85 font-semibold hover:bg-white/10'}`}>
                  {l}{n > 0 && <span className={`text-[11px] rounded-full px-1.5 tabular-nums ${on ? 'bg-white text-acao-700' : 'bg-acao-600 text-white'}`}>{n}</span>}
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      <main className="flex-1 w-full max-w-[1440px] mx-auto px-4 pn:px-8 py-5 pn:py-6">
        {view.tela === 'lista' && <Lista compras={compras} abrir={abrir} novo={novo} irNotas={() => setView({ tela: 'notas' })} notasPendentes={pendNotas} />}
        {view.tela === 'receb' && <Recebimento compras={compras} salvar={salvar} abrir={abrir} notify={notify} />}
        {view.tela === 'notas' && <NotasRecebidas notas={notas} compras={compras} vincular={vincular} criarEntrada={criarEntrada} desconhecer={desconhecer} />}
        {view.tela === 'editor' && atual && <Editor key={atual.id} compra={atual} salvar={salvar} voltar={() => setView({ tela: view.de || 'lista' })} notify={notify} proxNum={proxNum} notas={notas} vincular={vincular} recusarNota={recusarNota} />}
      </main>

      {toast && (
        <div role="status" className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-2 px-5 py-3 bg-estrutura text-white font-semibold text-sm rounded-full shadow-soft max-w-[calc(100%-32px)]">
          <span className="text-acao-300"><Icon n="check" /></span>{toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
