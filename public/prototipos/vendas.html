  /* Layout: topo estrutura com abas do módulo; lista com funil Pedido → Venda → Nota; editor em 2 colunas (documento | resumo fiscal) — ADEGA SB · azul profundo, laranja e pérola (brandbook 2026) · Simone Alves Nascimento, CNPJ 43.466.024/0001-43 */
  :root {
    --bg-fundo:#E9EAEC; --white:#FFFFFF; --estrutura:#232F3E; --estrutura-light:#2E3D50;
    --acao-100:#FFF1DC; --acao-300:#FFC266; --acao-600:#A85F00; --acao-600-dark:#8F4A00;
    --ink:#10151C; --ink-soft:#525B6B; --ink-faint:#C9CDD3; --border:#CDD1D6; --line-input:#7A7F87;
    --ok:#1E7F4F; --bad:#B42318; --warn:#B54708;

  html, body { height: 100%; background: var(--bg-fundo); color: var(--ink); font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif; }

  .display { font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif; font-weight: 700; color: var(--estrutura); letter-spacing: .01em; }

  .scrollbar-none::-webkit-scrollbar { display: none; } .scrollbar-none { scrollbar-width: none; }
  button, input, select { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; }
  button:focus-visible { outline: 2px solid var(--estrutura); outline-offset: 2px; }
  /* Borda de controle com contraste ≥ 3:1 (WCAG 1.4.11): cards usam --border, inputs usam --line-input */
  input[class*="border-line"], select[class*="border-line"], textarea[class*="border-line"] { border-color: var(--line-input); }
  input:focus, select:focus { outline: none; border-color: var(--estrutura) !important; }
  input:disabled, select:disabled { background: #F2F3F5; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

// Regras fiscais simplificadas para revenda de mercadoria de terceiros
function fiscal(doc) {
  const cnpj = ehCNPJ(doc.cliente.doc);
  const contribuinte = cnpj && doc.cliente.ie.trim() !== '';
  const mesmaUF = doc.cliente.uf === EMITENTE.uf;
  const modelo = doc.canal === 'varejo' && !cnpj && mesmaUF ? 'NFC-e' : 'NF-e';
  const cfop = mesmaUF ? '5102' : contribuinte ? '6102' : '6108';
  const cfopDesc = { '5102': 'Venda de mercadoria de terceiros dentro do estado',
    '6102': 'Venda de mercadoria de terceiros para contribuinte de outro estado',
    '6108': 'Venda de mercadoria a não contribuinte de outro estado' }[cfop];
  return { modelo, codModelo: modelo === 'NFC-e' ? '65' : '55', cfop, cfopDesc, contribuinte, cnpj };
}
function totais(doc) {
  const sub = doc.itens.reduce((a, i) => a + i.preco * i.qtd, 0);
  const imp = doc.itens.filter(i => prod(i.pid).origem !== 0).reduce((a, i) => a + i.preco * i.qtd, 0);
  return { sub, imp, total: Math.max(0, sub - doc.desconto + doc.frete), qtd: doc.itens.reduce((a, i) => a + i.qtd, 0) };
}

const NfBadge = ({ nf }) => nf

const OrigemBadge = ({ origem }) => origem === 0

// Mini funil de etapas: Pedido → Venda → Nota
function Etapas({ doc, grande }) {
  const passos = [
    { k: 'pedido', nome: 'Pedido', num: doc.pedido, feito: !!doc.pedido, pulado: !doc.pedido && doc.etapa !== 'pedido' },
    { k: 'venda', nome: 'Venda', num: doc.venda, feito: !!doc.venda },
    { k: 'nota', nome: 'Nota fiscal', num: doc.nf ? `${doc.nf.modelo} ${doc.nf.numero}${doc.nf.status === 'cancelada' ? ' · cancelada' : ''}` : null, feito: doc.nf?.status === 'autorizada', erro: doc.nf?.status === 'rejeitada' },
    { k: 'entrega', nome: 'Entrega', num: doc.entrega ? ENTREGA[doc.entrega.status].nome + (atrasada(doc.entrega) ? ' · atrasada' : '') : null,
      feito: concluida(doc.entrega), erro: doc.entrega?.status === 'ocorrencia' || atrasada(doc.entrega) },
  ];
  if (doc.devolucao) passos.push({ k: 'devolucao', nome: 'Devolução', num: DEV[doc.devolucao.status].nome, feito: doc.devolucao.status === 'concluida' });
  // Com nota autorizada e entrega em andamento, a etapa atual passa a ser a entrega; depois, a devolução aberta
  doc = doc.entrega && !concluida(doc.entrega) ? { ...doc, etapa: 'entrega' } : doc;
  doc = doc.devolucao && doc.devolucao.status !== 'concluida' ? { ...doc, etapa: 'devolucao' } : doc;
  if (!grande) return (
    <span className="inline-flex items-center gap-1" aria-label={`Etapa atual: ${doc.etapa}`}>
      {passos.map((p, i) => (
        <React.Fragment key={p.k}>
          {i > 0 && <span className={`w-3 h-[2px] ${p.feito || p.erro ? 'bg-estrutura' : 'bg-line'}`} />}
          <span title={p.nome} className={`w-2.5 h-2.5 rounded-full ${p.erro ? 'bg-bad' : p.feito ? 'bg-estrutura' : p.pulado ? 'bg-white border border-dashed border-ink-soft' : doc.etapa === p.k ? 'bg-acao-600' : 'bg-white border border-line'}`} />
        </React.Fragment>
      ))}
    </span>
  );
  return (
    <ol className={`grid grid-cols-2 gap-2 ${passos.length === 5 ? 'sm:grid-cols-5' : 'sm:grid-cols-4'}`}>
      {passos.map((p, i) => {
        const atual = doc.etapa === p.k && !p.feito && !p.erro;
        return (
          <li key={p.k} className={`rounded-card border px-3 py-2.5 min-w-0 ${p.erro ? 'border-bad bg-bad/5' : atual ? 'border-acao-600 bg-acao-100' : p.feito ? 'border-estrutura/30 bg-white' : 'border-line bg-white'}`}>
            <span className="flex items-center gap-1.5">
              <span className={`w-5 h-5 shrink-0 rounded-full text-[11px] font-bold flex items-center justify-center ${p.erro ? 'bg-bad text-white' : p.feito ? 'bg-estrutura text-white' : atual ? 'bg-acao-600 text-white' : 'bg-fundo text-ink-soft'}`}>
                {p.erro ? '!' : p.feito ? '✓' : i + 1}
              </span>
              <span className={`text-[13px] font-bold truncate ${atual ? 'text-acao-700' : 'text-estrutura'}`}>{p.nome}</span>
            </span>
            <span className="block text-[11.5px] text-ink-soft mt-0.5 truncate tabular-nums">
              {p.pulado ? 'Venda direta, sem pedido' : p.num || (atual ? 'Etapa atual' : 'Aguardando')}
            </span>
          </li>
        );
      })}
    </ol>
  );
}

const Campo = ({ id, label, children, hint }) => (

    {children}
    {hint && <p className="text-[11.5px] text-ink-soft mt-1 px-1">{hint}</p>}

);

/* ---------- LISTA ---------- */
function Lista({ docs, abrir, novo, irImportar, pendentesLoja }) {
  const [filtro, setFiltro] = useState('todos');
  const [canal, setCanal] = useState('todos');
  const [q, setQ] = useState('');

  const cont = k => docs.filter(d => k === 'devolucao' ? d.devolucao && d.devolucao.status !== 'concluida' : k === 'rejeitada' ? d.nf?.status === 'rejeitada' : k === 'nota' ? d.etapa === 'nota' && d.nf?.status !== 'rejeitada' : d.etapa === k);
  const soma = arr => arr.reduce((a, d) => a + totais(d).total, 0);
  const cards = [
    { k: 'pedido', nome: 'Pedidos em aberto', sub: 'Viram venda', icon: 'clip' },
    { k: 'venda', nome: 'Vendas a faturar', sub: 'Aguardam nota', icon: 'cart' },
    { k: 'nota', nome: 'Notas emitidas', sub: 'NF-e e NFC-e', icon: 'doc' },
    { k: 'rejeitada', nome: 'Notas rejeitadas', sub: 'Precisam de correção', icon: 'alert' },
    { k: 'devolucao', nome: 'Devoluções abertas', sub: 'Trocas e reembolsos', icon: 'undo' },
  ];

  const lista = docs.filter(d =>
    (filtro === 'todos' || cont(filtro).includes(d)) &&
    (canal === 'todos' || d.canal === canal) &&
    (!q || `${d.pedido} ${d.venda} ${d.cliente.nome} ${d.cliente.doc} ${d.nf?.numero || ''}`.toLowerCase().includes(q.toLowerCase())));

  const acao = d => {
    if (d.etapa === 'pedido') return ['Converter em venda', true];
    if (d.etapa === 'venda') return [`Emitir ${fiscal(d).modelo}`, true];
    if (d.nf?.status === 'rejeitada') return ['Corrigir nota', true];
    if (d.devolucao?.status === 'solicitada') return ['Receber devolução', true];
    if (d.devolucao?.status === 'recebida') return ['Emitir NF de devolução', true];
    if (d.devolucao?.status === 'concluida') return ['Ver devolução', false];
    if (d.entrega?.status === 'ocorrencia' || atrasada(d.entrega)) return ['Resolver entrega', true];
    if (d.entrega && ['separar', 'embalado'].includes(d.entrega.status)) return ['Expedir', true];
    if (d.entrega && !concluida(d.entrega)) return ['Ver rastreio', false];
    return ['Ver nota', false];
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <h1 className="display text-[21px] pn:text-[26px] leading-tight">
          Vendas<span className="font-body text-[14.5px] font-normal text-ink-soft"> - pedidos, vendas e notas fiscais</span>
        </h1>
        <div className="flex gap-2">
          <button onClick={irImportar} className="px-4 py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center gap-2">
            <Icon n="download" />Importar da loja
            {pendentesLoja > 0 && <span className="text-[11px] bg-acao-600 text-white rounded-full px-1.5 tabular-nums">{pendentesLoja}</span>}
          </button>
          <button onClick={novo} className="px-4 py-2.5 bg-acao-600 hover:bg-acao-700 text-white font-bold text-[13.5px] rounded-full shadow-acao flex items-center gap-2">
            <Icon n="plus" />Nova venda ou pedido
          </button>
        </div>
      </div>

      {/* Funil */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        {cards.map(c => {
          const arr = cont(c.k); const ativo = filtro === c.k;
          return (
            <button key={c.k} onClick={() => setFiltro(ativo ? 'todos' : c.k)} aria-pressed={ativo}
              className={`text-left p-3.5 rounded-card border bg-white shadow-card ${ativo ? 'border-acao-600 ring-2 ring-acao-300' : 'border-line hover:border-estrutura'}`}>
              <span className="flex items-center justify-between">
                <span className="label">{c.nome}</span>
                <span className={c.k === 'rejeitada' && arr.length ? 'text-bad' : 'text-estrutura'}><Icon n={c.icon} /></span>
              </span>
              <span className={`display block text-2xl tabular-nums mt-1 ${c.k === 'rejeitada' && arr.length ? '!text-bad' : ''}`}>{arr.length}</span>
              <span className="block text-[12px] text-ink-soft tabular-nums">{brl(soma(arr))} · {c.sub}</span>
            </button>
          );
        })}
      </div>

      {/* Filtros */}
      <div className="flex flex-col sm:flex-row gap-3">
        <div className="relative flex-1">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-ink-soft"><Icon n="search" className="w-5 h-5" /></span>
          <label htmlFor="q" className="sr-only">Buscar</label>
          <input id="q" value={q} onChange={e => setQ(e.target.value)} placeholder="Nº do pedido, venda, nota, cliente ou CPF/CNPJ"
            className="w-full pl-12 pr-4 py-2.5 bg-white border border-line rounded-full text-sm shadow-card" />
        </div>
        <div className="flex gap-2 overflow-x-auto scrollbar-none">
          {['todos', 'varejo', 'atacado', 'online'].map(c => (
            <button key={c} onClick={() => setCanal(c)} aria-pressed={canal === c}
              className={`px-4 py-2 rounded-full text-[13.5px] whitespace-nowrap border ${canal === c ? 'bg-estrutura border-estrutura text-white font-bold' : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>
              {c === 'todos' ? 'Todos os canais' : CANAIS[c].nome}
            </button>
          ))}
        </div>
      </div>

      {/* Tabela */}
      <div className="bg-white border border-line rounded-card shadow-card overflow-hidden">
        <div className="hidden lg:grid grid-cols-[150px_1fr_120px_88px_130px_150px_170px] gap-3 px-4 py-2.5 bg-fundo/40 border-b border-line">
          {['Documento', 'Cliente', 'Canal', 'Etapa', 'Total', 'Nota / entrega', ''].map((h, i) => <span key={i} className={`label ${i === 4 ? 'text-right' : ''}`}>{h}</span>)}
        </div>
        <ul className="divide-y divide-fundo">
          {lista.map(d => {
            const t = totais(d); const [lbl, prim] = acao(d);
            return (
              <li key={d.id} className="grid grid-cols-[1fr_auto] lg:grid-cols-[150px_1fr_120px_88px_130px_150px_170px] gap-x-3 gap-y-1.5 items-center px-4 py-3 hover:bg-fundo/20">
                <button onClick={() => abrir(d.id)} className="text-left min-w-0">
                  <span className="block font-bold text-estrutura text-sm tabular-nums">{d.venda || d.pedido}</span>
                  <span className="block text-[11.5px] text-ink-soft tabular-nums">{d.venda && d.pedido ? `de ${d.pedido} · ` : ''}{d.criado}</span>
                </button>
                <span className="lg:hidden justify-self-end font-display font-bold text-estrutura tabular-nums">{brl(t.total)}</span>
                <span className="min-w-0 col-span-2 lg:col-span-1">
                  <span className="block text-sm font-semibold text-ink truncate">{d.cliente.nome}</span>
                  <span className="block text-[11.5px] text-ink-soft tabular-nums truncate">
                    {d.cliente.doc || 'Sem CPF'} · {d.cliente.uf}{d.origemLoja && ` · loja ${d.origemLoja}`}{t.imp > 0 && ' · tem importado'}
                  </span>
                </span>
                <span className="flex lg:block items-center gap-2 col-span-2 lg:col-span-1 flex-wrap">
                  <CanalBadge canal={d.canal} />
                  <span className="lg:hidden"><Etapas doc={d} /></span>
                  <span className="lg:hidden"><NfBadge nf={d.nf} /></span>
                  <span className="lg:hidden"><EntregaBadge e={d.entrega} /></span>
                  <span className="lg:hidden"><DevBadge dv={d.devolucao} /></span>
                </span>
                <span className="hidden lg:block"><Etapas doc={d} /></span>
                <span className="hidden lg:block text-right font-display font-bold text-estrutura tabular-nums">{brl(t.total)}</span>
                <span className="hidden lg:flex flex-col items-start gap-1"><NfBadge nf={d.nf} /><EntregaBadge e={d.entrega} /><DevBadge dv={d.devolucao} /></span>
                <button onClick={() => abrir(d.id)}
                  className={`col-span-2 lg:col-span-1 px-3.5 py-2 rounded-full text-[13px] font-bold flex items-center justify-center gap-1.5 ${prim
                    ? (d.nf?.status === 'rejeitada' || lbl === 'Resolver entrega' ? 'bg-bad text-white hover:opacity-90' : 'bg-acao-600 hover:bg-acao-700 text-white')
                    : 'bg-white border-[1.5px] border-line text-estrutura hover:border-estrutura'}`}>
                  {lbl}<Icon n="arrow" className="w-3.5 h-3.5" />
                </button>
              </li>
            );
          })}
          {lista.length === 0 && <li className="p-10 text-center text-sm text-ink-soft">Nenhum documento com esses filtros.</li>}
        </ul>
      </div>
    </div>
  );
}

/* ---------- AVISO DE RASTREIO AO CLIENTE ---------- */
function AvisoCliente({ d, e, salvar, notify }) {
  const [copiado, setCopiado] = useState(false);
  const txtRef = useRef(null);
  const temEmail = emailOk(d.cliente.email || '');
  const postado = ['postado', 'transito', 'saiu', 'entregue', 'ocorrencia'].includes(e.status);
  const avisos = e.avisos || [];
  const msg = msgRastreio(d, e);

  const reenviar = () => {
    salvar({ ...d, entrega: { ...e, avisos: [novoAviso('Código de rastreio reenviado', d.cliente, 'Manual'), ...avisos] } });
    notify(`Código de rastreio enviado para ${d.cliente.email}`);
  };
  const copiar = async () => {
    try { await navigator.clipboard.writeText(msg); setCopiado(true); setTimeout(() => setCopiado(false), 2000); }
    catch { const r = document.createRange(); r.selectNodeContents(txtRef.current); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };

  return (
    <div className="rounded-card border border-line bg-fundo/30 p-3 space-y-2.5">
      <span className="label">Aviso ao cliente</span>

      {!postado && (
        <p className="text-[12.5px] text-ink-soft flex gap-1.5">
          <Icon n="mail" className="w-4 h-4 shrink-0 mt-0.5 text-estrutura" />
          {temEmail
            ? <span>O código vai automaticamente para <strong className="text-estrutura">{d.cliente.email}</strong> quando você postar o envio.</span>
            : <span>Cadastre o e-mail do cliente para ele receber o código ao postar.</span>}
        </p>
      )}

      {postado && e.codigo && (<>
        <p ref={txtRef} className="text-[12.5px] text-ink bg-white border border-line rounded-panel p-2.5 leading-snug select-text">{msg}</p>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={reenviar} disabled={!temEmail}
            className="py-2 bg-white border-[1.5px] border-line enabled:hover:border-estrutura text-estrutura font-bold text-[12.5px] rounded-full flex items-center justify-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed">
            <Icon n="mail" className="w-3.5 h-3.5" />Reenviar e-mail
          </button>
          <button onClick={copiar} className="py-2 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[12.5px] rounded-full flex items-center justify-center gap-1.5">
            <Icon n={copiado ? 'check' : 'copy'} className="w-3.5 h-3.5" />{copiado ? 'Copiado' : 'Copiar p/ WhatsApp'}
          </button>
        </div>
      </>)}

      {!temEmail && postado && <p className="text-[12px] text-warn font-semibold">Cliente sem e-mail cadastrado. Copie a mensagem e envie pelo WhatsApp.</p>}

      {avisos.length > 0 && (
        <ul className="space-y-1 pt-1">
          {avisos.map((a, i) => (
            <li key={i} className="text-[11.5px] leading-snug flex gap-1.5">
              <span className="text-ok shrink-0 mt-px"><Icon n="check" className="w-3.5 h-3.5" /></span>
              <span><span className="font-semibold text-ink">{a.tipo}</span> <span className="text-ink-soft tabular-nums">· {a.quando} · {a.modo}</span></span>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* ---------- PAINEL DE ENTREGA (dentro da venda) ---------- */
function EntregaPainel({ d, setD, salvar, notify, focoCodigo }) {
  const e = d.entrega;
  const [erro, setErro] = useState('');
  const codRef = useRef(null);
  useEffect(() => { if (focoCodigo) codRef.current?.focus(); }, [focoCodigo]);
  const upE = patch => setD(x => ({ ...x, entrega: { ...x.entrega, ...patch } }));
  const gravar = () => salvar(d);
  const retirada = e.transportadora === 'Retirada na loja';

  const ir = status => {
    if (status === 'postado' && !retirada && !proprio(e) && !e.codigo.trim()) { setErro('Informe o código de rastreio para postar.'); codRef.current?.focus(); return; }
    setErro('');
    salvar({ ...d, entrega: comEvento(e, status, d.cliente) });
    const avisou = AVISAR[status] && emailOk(d.cliente.email || '');
    notify(`${d.venda}: ${ENTREGA[status].nome.toLowerCase()}${avisou ? ` · cliente avisado em ${d.cliente.email}` : ''}`);
  };
  const prox = retirada ? 'retirado' : proximo(e);
  const rotulo = proprio(e)
    ? { embalado: 'Marcar como embalado', saiu: 'Saiu com o entregador', entregue: 'Marcar como entregue' }[prox]
    : { embalado: 'Marcar como embalado', postado: e.transportadora === 'Plataforma do site' ? 'Coletado pela plataforma' : 'Postar envio', transito: 'Atualizar rastreio', saiu: 'Atualizar rastreio', entregue: 'Atualizar rastreio', retirado: 'Marcar como retirado' }[prox];
  const idx = FLUXO.indexOf(e.status === 'ocorrencia' ? 'saiu' : e.status);

  return (
    <section className={`bg-white border rounded-card shadow-card p-4 space-y-3 ${e.status === 'ocorrencia' || atrasada(e) ? 'border-bad' : 'border-line'}`}>
      <div className="flex items-center justify-between gap-2">
        <h2 className="display text-base">Entrega</h2>
        <EntregaBadge e={e} />
      </div>

      {/* Barra de progresso do envio */}
      {e.status !== 'retirado' && (
        <ol className="flex items-center gap-1" aria-label="Progresso da entrega">
          {FLUXO.map((s, i) => (
            <li key={s} title={ENTREGA[s].nome} className={`h-1.5 flex-1 rounded-full ${e.status === 'ocorrencia' && i === idx ? 'bg-bad' : i <= idx ? (concluida(e) ? 'bg-ok' : 'bg-estrutura') : 'bg-fundo'}`} />
          ))}
        </ol>
      )}

      <div className="grid grid-cols-2 gap-2">
        <div className="col-span-2">
          <Campo id="transp" label="Transportadora">
            <select id="transp" className={inputCls} value={e.transportadora} disabled={concluida(e)}
              onChange={ev => upE({ transportadora: ev.target.value })} onBlur={gravar}>
              {TRANSPORTADORAS.map(x => <option key={x}>{x}</option>)}
            </select>
          </Campo>
        </div>
        {!retirada && (<>
          {proprio(e) ? (
            <p className="text-[12px] text-ink-soft self-center">Sem código: o entregador da loja leva direto ao cliente.</p>
          ) : <Campo id="codigo" label={e.transportadora === 'Plataforma do site' ? 'Código da plataforma' : 'Código de rastreio'}>
            <input id="codigo" ref={codRef} className={`${inputCls} tabular-nums uppercase`} value={e.codigo} disabled={concluida(e)} placeholder="AA000000000BR"
              onChange={ev => upE({ codigo: ev.target.value.toUpperCase() })} onBlur={gravar} />
          </Campo>}
          <Campo id="prazo" label="Prazo (dd/mm)">
            <input id="prazo" className={`${inputCls} tabular-nums ${atrasada(e) ? '!border-bad text-bad font-bold' : ''}`} value={e.prazo} disabled={concluida(e)} placeholder="00/00"
              onChange={ev => upE({ prazo: ev.target.value })} onBlur={gravar} />
          </Campo>
        </>)}
      </div>

      {erro && <p className="text-[13px] text-bad font-semibold">{erro}</p>}

      {!retirada && !proprio(e) && <AvisoCliente d={d} e={e} salvar={salvar} notify={notify} />}
      {proprio(e) && (e.avisos || []).length > 0 && (
        <ul className="space-y-1">
          {e.avisos.map((a, i) => <li key={i} className="text-[11.5px] flex gap-1.5"><span className="text-ok"><Icon n="check" className="w-3.5 h-3.5" /></span><span><span className="font-semibold">{a.tipo}</span> <span className="text-ink-soft tabular-nums">· {a.quando} · {a.modo}</span></span></li>)}
        </ul>
      )}

      {!concluida(e) && (
        <div className="space-y-2">
          <button onClick={() => ir(prox)} className="w-full py-3 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2">
            <Icon n="truck" />{rotulo}
          </button>
          {['postado', 'transito', 'saiu'].includes(e.status) && (
            <button onClick={() => ir('ocorrencia')} className="w-full py-2.5 bg-white border-[1.5px] border-line hover:border-bad hover:text-bad text-ink-soft font-bold text-[13.5px] rounded-full">

            <li key={i} className="pl-4 relative">

              <span className="block text-[11.5px] text-ink-soft tabular-nums">{ev.quando} · {ev.local}</span>
            </li>
          ))}
        </ol>
      </div>
    </section>
  );
}

/* ---------- PAINEL DE DEVOLUÇÃO (dentro da venda) ---------- */
function DevolucaoPainel({ d, salvar, notify, proxNum }) {
  const dv = d.devolucao;
  const [aberto, setAberto] = useState(false);
  const [qtds, setQtds] = useState({});
  const [motivo, setMotivo] = useState(d.canal === 'online' ? MOTIVOS[2] : MOTIVOS[0]);
  const [tipo, setTipo] = useState('troca');
  const [erro, setErro] = useState('');
  const ev = texto => ({ quando: `05/10 · ${agoraHora()}`, texto });
  const btnPri = 'w-full py-3 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2';
  const btnSec = 'w-full py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center justify-center gap-1.5';
  const previa = d.itens.reduce((a, i) => a + (qtds[i.pid] || 0) * i.preco, 0);

  const registrar = () => {
    const itens = d.itens.map(i => ({ pid: i.pid, qtd: qtds[i.pid] || 0 })).filter(i => i.qtd > 0);
    if (!itens.length) return setErro('Escolha pelo menos um item para devolver.');
    setErro('');
    salvar({ ...d, devolucao: { status: 'solicitada', motivo, tipo, itens, avaria: motivo.startsWith('Defeito'), nf: null, credito: null,
      eventos: [ev(`Devolução registrada: ${motivo.toLowerCase()}`)] } });
    notify(`Devolução registrada na ${d.venda}`); setAberto(false); setQtds({});
  };
  const receber = () => {
    if (!dv.avaria) dv.itens.forEach(i => { prod(i.pid).stock += i.qtd; });
    const pecas = dv.itens.reduce((a, i) => a + i.qtd, 0);
    salvar({ ...d, devolucao: { ...dv, status: 'recebida', eventos: [ev(dv.avaria ? 'Itens recebidos e separados como avaria (não voltam ao estoque)' : 'Itens recebidos e conferidos · voltaram ao estoque'), ...dv.eventos] } });
    notify(dv.avaria ? `${pecas} item(ns) recebido(s) como avaria` : `${pecas} item(ns) de volta ao estoque`);
  };
  const emitirDev = () => {
    const nf = { numero: String(proxNum('NF-e')).padStart(6, '0'), cfop: cfopDev(d), status: 'transmitida' };
    const doc = { ...d, devolucao: { ...dv, nf } }; salvar(doc);
    setTimeout(() => {
      const v = valorDev(d);
      const credito = dv.tipo === 'troca' ? `Vale-troca VT-${String(proxNum('VT')).padStart(4, '0')} de ${brl(v)}` : `Reembolso de ${brl(v)} via ${d.forma}`;
      salvar({ ...doc, devolucao: { ...doc.devolucao, status: 'concluida', nf: { ...nf, status: 'autorizada' }, credito,
        eventos: [ev(`${credito} gerado`), ev(`NF-e de devolução ${nf.numero} autorizada (CFOP ${nf.cfop})`), ...dv.eventos] } });
      notify(`Devolução concluída · ${credito}`);
    }, 1300);
  };

  return (
    <section className={`bg-white border rounded-card shadow-card p-4 space-y-3 ${dv && dv.status !== 'concluida' ? 'border-warn' : 'border-line'}`}>
      <div className="flex items-center justify-between gap-2"><h2 className="display text-base">Devolução</h2><DevBadge dv={dv} /></div>

      {!dv && !aberto && (<>
        <p className="text-[12.5px] text-ink-soft">{d.canal === 'online'
          ? 'Compra online: o cliente pode desistir em até 7 dias do recebimento (direito de arrependimento).'
          : 'Troca de produto errado ou avariado, conforme a política da adega.'}</p>
        <button onClick={() => setAberto(true)} className={btnSec}><Icon n="undo" />Registrar devolução</button>
      </>)}

      {!dv && aberto && (
        <div className="space-y-3">
          <span className="label">Itens devolvidos</span>
          <ul className="space-y-2">
            {d.itens.map(i => (
              <li key={i.pid} className="grid grid-cols-[1fr_auto_64px] gap-2 items-center">
                <span className="min-w-0 text-[12.5px] font-semibold truncate">{prod(i.pid).name}</span>
                <span className="text-[11.5px] text-ink-soft tabular-nums whitespace-nowrap">de {i.qtd}</span>
                <input aria-label={`Devolver de ${prod(i.pid).name}`} value={qtds[i.pid] || 0}
                  onChange={e => setQtds(q => ({ ...q, [i.pid]: Math.min(i.qtd, Math.max(0, Number(e.target.value.replace(/\D/g, '')) || 0)) }))}
                  className="px-2 py-1.5 border border-line rounded-full text-center text-sm font-bold text-estrutura tabular-nums" />
              </li>
            ))}
          </ul>
          <Campo id="dev-motivo" label="Motivo">
            <select id="dev-motivo" className={inputCls} value={motivo} onChange={e => setMotivo(e.target.value)}>{MOTIVOS.map(m => <option key={m}>{m}</option>)}</select>
          </Campo>
          <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="O cliente quer">
            {[['troca', 'Troca', 'Gera vale-troca'], ['reembolso', 'Reembolso', `Devolve via ${d.forma}`]].map(([k, n, s]) => (
              <button key={k} role="radio" aria-checked={tipo === k} onClick={() => setTipo(k)}
                className={`p-2.5 rounded-card border text-left ${tipo === k ? 'bg-acao-100 border-acao-600' : 'bg-white border-line hover:border-estrutura'}`}>
                <span className={`block text-sm font-bold ${tipo === k ? 'text-acao-700' : 'text-estrutura'}`}>{n}</span>
                <span className="block text-[11.5px] text-ink-soft">{s}</span>
              </button>
            ))}
          </div>
          {motivo.startsWith('Defeito') && <p className="text-[12px] text-warn font-semibold">Item com defeito não volta ao estoque: fica separado como avaria.</p>}
          <p className="text-[13px] text-ink-soft flex justify-between"><span>Valor da devolução</span><strong className="text-estrutura tabular-nums">{brl(previa)}</strong></p>
          {erro && <p className="text-[13px] text-bad font-semibold">{erro}</p>}
          <div className="grid grid-cols-[1fr_auto] gap-2">
            <button onClick={registrar} className={btnPri}><Icon n="undo" />Registrar devolução</button>
            <button onClick={() => { setAberto(false); setErro(''); }} className="px-4 py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-ink-soft font-bold text-[13.5px] rounded-full">Cancelar</button>
          </div>
        </div>
      )}

      {dv && (<>
        <dl className="text-[13px] space-y-1.5">
          <div className="flex justify-between gap-3"><dt className="text-ink-soft">Motivo</dt><dd className="font-semibold text-right">{dv.motivo}</dd></div>
          <div className="flex justify-between gap-3"><dt className="text-ink-soft">O cliente quer</dt><dd className="font-semibold">{dv.tipo === 'troca' ? 'Troca (vale-troca)' : 'Reembolso'}</dd></div>
          <div className="flex justify-between gap-3"><dt className="text-ink-soft">Valor</dt><dd className="font-bold text-estrutura tabular-nums">{brl(valorDev(d))}</dd></div>
          {dv.nf && <div className="flex justify-between gap-3"><dt className="text-ink-soft">NF de devolução</dt><dd className="font-bold text-estrutura tabular-nums">{dv.nf.numero} · CFOP {dv.nf.cfop}</dd></div>}
        </dl>
        <ul className="text-[12.5px] border border-line rounded-card divide-y divide-fundo">
          {dv.itens.map(i => <li key={i.pid} className="flex justify-between gap-2 px-3 py-2"><span className="truncate">{prod(i.pid).name}</span><strong className="tabular-nums shrink-0">{i.qtd} un.</strong></li>)}
        </ul>
        {dv.avaria && <p className="text-[12px] text-warn font-semibold">Avaria: os itens não voltam ao estoque.</p>}
        {dv.credito && <p className="rounded-card bg-ok/10 border border-ok/30 px-3 py-2 text-[13px] text-ok font-bold">{dv.credito}</p>}

        {dv.status === 'solicitada' && <button onClick={receber} className={btnPri}><Icon n="check" />Confirmar recebimento</button>}
        {dv.status === 'recebida' && !dv.nf && <button onClick={emitirDev} className={btnPri}><Icon n="doc" />Emitir NF de devolução ({cfopDev(d)})</button>}
        {dv.nf?.status === 'transmitida' && <p className="w-full py-3 bg-estrutura-light text-white font-bold rounded-full text-center text-sm">Aguardando retorno da SEFAZ…</p>}

        <div>
          <span className="label mb-2">Histórico</span>
          <ol className="relative border-l-2 border-fundo ml-1.5 space-y-3">
            {dv.eventos.map((e, i) => (
              <li key={i} className="pl-4 relative">
                <span className={`absolute -left-[7px] top-1 w-3 h-3 rounded-full border-2 border-white ${i === 0 ? (dv.status === 'concluida' ? 'bg-ok' : 'bg-warn') : 'bg-line'}`} />
                <span className={`block text-[13px] ${i === 0 ? 'font-bold text-estrutura' : ''}`}>{e.texto}</span>
                <span className="block text-[11.5px] text-ink-soft tabular-nums">{e.quando}</span>
              </li>
            ))}
          </ol>
        </div>
      </>)}
    </section>
  );
}

/* ---------- EDITOR / DETALHE ---------- */
function Editor({ doc: inicial, salvar, voltar, notify, abrirDanfe, abrirEnvio, abrirXml, abrirEspelho, proxNum, foco }) {
  const [d, setD] = useState(inicial);
  const [busca, setBusca] = useState('');
  const [hl, setHl] = useState(0);
  const [erro, setErro] = useState('');
  const [emitirJa, setEmitirJa] = useState(true);
  const buscaRef = useRef(null);
  const novo = !inicial.pedido && !inicial.venda;
  const tipoNovo = d._tipo || 'venda';
  const podeItens = novo || d.etapa === 'pedido';
  const podeCliente = podeItens || d.nf?.status === 'rejeitada';
  const f = fiscal(d); const t = totais(d);

  useEffect(() => setD(inicial), [inicial]);
  const up = patch => setD(x => ({ ...x, ...patch }));
  const upCli = patch => setD(x => ({ ...x, cliente: { ...x.cliente, ...patch } }));

  // Preço segue a tabela do canal
  const mudarCanal = c => setD(x => ({ ...x, canal: c,
    condicao: c === 'atacado' ? x.condicao : 'À vista',
    itens: x.itens.map(i => ({ ...i, preco: c === 'atacado' ? prod(i.pid).atacado : prod(i.pid).varejo })) }));

  const resultados = useMemo(() => {
    const t = busca.trim().toLowerCase(); if (t.length < 2) return [];
    return PRODUTOS.filter(p => p.name.toLowerCase().includes(t) || p.code.includes(t)).slice(0, 6);
  }, [busca]);
  useEffect(() => setHl(0), [busca]);

  const addItem = p => {
    setD(x => {
      const ex = x.itens.find(i => i.pid === p.id);
      return { ...x, itens: ex ? x.itens.map(i => i.pid === p.id ? { ...i, qtd: i.qtd + 1 } : i)
        : [...x.itens, { pid: p.id, qtd: 1, preco: x.canal === 'atacado' ? p.atacado : p.varejo }] };
    });
    setBusca(''); buscaRef.current?.focus();
  };
  const qtd = (pid, n) => setD(x => ({ ...x, itens: x.itens.map(i => i.pid === pid ? { ...i, qtd: Math.max(1, n) } : i) }));
  const del = pid => setD(x => ({ ...x, itens: x.itens.filter(i => i.pid !== pid) }));

  const validar = () => {
    if (!d.itens.length) return 'Adicione pelo menos um produto.';
    if (d.canal === 'atacado' && !ehCNPJ(d.cliente.doc)) return 'Venda no atacado exige CNPJ do cliente.';
    if (d.canal !== 'varejo' && !d.cliente.nome.trim()) return 'Informe o nome do cliente.';
    if (f.modelo === 'NF-e' && !d.cliente.doc.trim()) return 'NF-e exige CPF ou CNPJ do destinatário.';
    return '';
  };

  const emitir = doc => {
    const ff = fiscal(doc);
    const nf = { modelo: ff.modelo, numero: String(proxNum(ff.modelo)).padStart(6, '0'), serie: ff.modelo === 'NFC-e' ? '2' : '1', status: 'transmitida', chave: '', em: `05/10 · ${agoraHora()}`, motivo: '' };
    const enviado = { ...doc, etapa: 'nota', nf };
    salvar(enviado);
    // Simula o retorno da SEFAZ
    setTimeout(() => {
      const rejeita = ff.cnpj && !ff.contribuinte && doc.canal === 'atacado';
      const auto = !rejeita && emailOk(doc.cliente.email || '');
      salvar({ ...enviado, entrega: rejeita ? null : entregaInicial(doc),
        envios: auto ? [{ quando: `05/10 · ${agoraHora()}`, para: [doc.cliente.email], anexos: ['XML', 'PDF'], modo: 'Automático' }, ...(doc.envios || [])] : (doc.envios || []),
        nf: { ...nf, status: rejeita ? 'rejeitada' : 'autorizada', chave: rejeita ? '' : chave44(),
        motivo: rejeita ? 'Rejeição 233: IE do destinatário não informada para operação com contribuinte.' : '' } });
      notify(rejeita ? `${ff.modelo} ${nf.numero} rejeitada pela SEFAZ` : `${ff.modelo} ${nf.numero} autorizada${auto ? ` e enviada para ${doc.cliente.email}` : ''}`);
    }, 1400);
  };

  const concluir = acao => {
    const e = validar(); if (e) return setErro(e); setErro('');
    if (acao === 'salvarPedido') {
      const num = d.pedido || `P-${proxNum('P')}`;
      salvar({ ...d, pedido: num, etapa: 'pedido', _tipo: undefined, criado: d.criado || `05/10 · ${agoraHora()}` });
      notify(`Pedido ${num} salvo`); return voltar();
    }
    if (acao === 'venda') {
      const num = `V-${proxNum('V')}`;
      const doc = { ...d, venda: num, etapa: 'venda', _tipo: undefined, criado: d.criado || `05/10 · ${agoraHora()}` };
      salvar(doc);
      notify(d.pedido ? `Pedido ${d.pedido} virou a venda ${num}` : `Venda ${num} finalizada`);
      if (emitirJa) emitir(doc); else voltar();
      return;
    }
    if (acao === 'emitir' || acao === 'reemitir') return emitir(d);
  };

  const cancelarPedido = () => { salvar({ ...d, _excluir: true }); notify(`Pedido ${d.pedido} cancelado`); voltar(); };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="display text-[21px] pn:text-[26px] leading-tight">
          {novo ? (tipoNovo === 'pedido' ? 'Novo pedido' : 'Nova venda direta') : (d.venda || d.pedido)}
          <span className="font-body text-[14.5px] font-normal text-ink-soft"> - {novo ? 'preencha cliente e produtos' : `${CANAIS[d.canal].nome} · ${d.cliente.nome || 'Consumidor final'}`}</span>
        </h1>
        <button onClick={voltar} className="px-4 py-2 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center gap-1.5">
          <Icon n="back" />Voltar
        </button>
      </div>

      {!novo && <Etapas doc={d} grande />}

      {d.nf?.status === 'rejeitada' && (
        <div className="flex gap-3 p-3.5 rounded-card border border-bad bg-bad/5 text-sm">
          <span className="text-bad shrink-0 mt-0.5"><Icon n="alert" className="w-5 h-5" /></span>
          <span><strong className="text-bad">{d.nf.modelo} {d.nf.numero} rejeitada.</strong> {d.nf.motivo} Corrija os dados do cliente abaixo e reemita.</span>
        </div>
      )}

      <div className={`grid pn:grid-cols-[1fr_340px] gap-4 items-start ${d.entrega || d.devolucao ? 'xl:grid-cols-[1fr_656px]' : 'xl:grid-cols-[1fr_380px]'}`}>
        {/* COLUNA DO DOCUMENTO */}
        <div className="space-y-4 min-w-0">
          {novo && (
            <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-3">
              <span className="label">Tipo de documento</span>
              <div className="grid sm:grid-cols-2 gap-2" role="radiogroup" aria-label="Tipo de documento">
                {[['venda', 'Venda direta', 'Finaliza agora e já pode emitir a nota', 'cart'], ['pedido', 'Pedido', 'Fica reservado e vira venda depois', 'clip']].map(([k, n, s, ic]) => (
                  <button key={k} role="radio" aria-checked={tipoNovo === k} onClick={() => up({ _tipo: k })}
                    className={`flex items-center gap-3 p-3 rounded-card border text-left ${tipoNovo === k ? 'bg-acao-100 border-acao-600' : 'bg-white border-line hover:border-estrutura'}`}>
                    <span className={`w-9 h-9 shrink-0 rounded-full flex items-center justify-center ${tipoNovo === k ? 'bg-acao-600 text-white' : 'bg-fundo text-estrutura'}`}><Icon n={ic} /></span>
                    <span className="min-w-0"><span className={`block text-sm font-bold ${tipoNovo === k ? 'text-acao-700' : 'text-estrutura'}`}>{n}</span><span className="block text-xs text-ink-soft">{s}</span></span>
                  </button>
                ))}
              </div>
            </section>
          )}

          {/* Canal + cliente */}
          <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-4">
            <div>
              <span className="label mb-2">Canal de venda</span>
              <div className="grid grid-cols-3 gap-2" role="radiogroup" aria-label="Canal de venda">
                {Object.entries(CANAIS).map(([k, c]) => (
                  <button key={k} role="radio" aria-checked={d.canal === k} disabled={!podeItens} onClick={() => mudarCanal(k)}
                    className={`flex flex-col items-center gap-1 py-2.5 px-2 rounded-card border text-[13px] disabled:cursor-not-allowed ${d.canal === k
                      ? 'bg-acao-100 border-acao-600 text-acao-700 font-bold' : 'bg-white border-line text-ink-soft font-semibold enabled:hover:border-estrutura enabled:hover:text-estrutura disabled:opacity-50'}`}>
                    <Icon n={c.icon} className="w-5 h-5" />{c.nome}
                  </button>
                ))}
              </div>
              <p className="text-[11.5px] text-ink-soft mt-1.5 px-1">{CANAIS[d.canal].desc}{d.canal === 'atacado' && ' · usa a tabela de preço de atacado'}{d.origemLoja && ` · pedido ${d.origemLoja} da loja`}</p>
            </div>

            <div className="grid sm:grid-cols-2 gap-3">
              <Campo id="cli-nome" label="Cliente">
                <input id="cli-nome" className={inputCls} disabled={!podeCliente} value={d.cliente.nome} onChange={e => upCli({ nome: e.target.value })}
                  placeholder={d.canal === 'varejo' ? 'Consumidor final' : 'Nome ou razão social'} />
              </Campo>
              <Campo id="cli-doc" label={d.canal === 'atacado' ? 'CNPJ' : 'CPF ou CNPJ'}
                hint={d.canal === 'varejo' && !d.cliente.doc ? 'Opcional no varejo (CPF na nota)' : ''}>
                <input id="cli-doc" className={`${inputCls} tabular-nums`} disabled={!podeCliente} value={d.cliente.doc} onChange={e => upCli({ doc: e.target.value })}
                  placeholder={d.canal === 'atacado' ? '00.000.000/0000-00' : '000.000.000-00'} />
              </Campo>
              {ehCNPJ(d.cliente.doc) && (
                <Campo id="cli-ie" label="Inscrição estadual" hint={!d.cliente.ie ? 'Deixe vazio se o cliente for isento (não contribuinte)' : ''}>
                  <input id="cli-ie" className={`${inputCls} tabular-nums ${d.nf?.status === 'rejeitada' && !d.cliente.ie ? '!border-bad' : ''}`} disabled={!podeCliente}
                    value={d.cliente.ie} onChange={e => upCli({ ie: e.target.value })} placeholder="000.000.000.000" />
                </Campo>
              )}
              <Campo id="cli-email" label="E-mail para a nota" hint="Recebe o XML e o PDF automaticamente quando a nota é autorizada">
                <input id="cli-email" type="email" className={inputCls} value={d.cliente.email || ''} placeholder="cliente@email.com"
                  onChange={e => upCli({ email: e.target.value.trim() })} onBlur={() => !novo && salvar(d)} />
              </Campo>
              <Campo id="cli-uf" label="UF de destino">
                <select id="cli-uf" className={inputCls} disabled={!podeCliente} value={d.cliente.uf} onChange={e => upCli({ uf: e.target.value })}>
                  {UFS.map(u => <option key={u}>{u}</option>)}
                </select>
              </Campo>
            </div>
          </section>

          {/* Itens */}
          <section className="bg-white border border-line rounded-card shadow-card overflow-hidden">
            <div className="flex items-center justify-between px-4 py-3 border-b border-line">
              <h2 className="display text-base">Produtos <span className="text-[11px] font-bold px-2 py-0.5 bg-acao-100 text-acao-700 rounded-full font-body tabular-nums align-middle">{t.qtd}</span></h2>
              {t.imp > 0 && <span className="text-[12px] text-ink-soft flex items-center gap-1"><Icon n="ship" className="w-3.5 h-3.5" />{brl(t.imp)} em importados</span>}
            </div>

            {podeItens && (
              <div className="relative p-3 border-b border-line">
                <span className="absolute left-7 top-1/2 -translate-y-1/2 text-ink-soft"><Icon n="search" /></span>
                <label htmlFor="busca" className="sr-only">Adicionar produto</label>
                <input id="busca" ref={buscaRef} value={busca} onChange={e => setBusca(e.target.value)} autoComplete="off"
                  onKeyDown={e => {
                    if (e.key === 'ArrowDown') { e.preventDefault(); setHl(h => Math.min(h + 1, resultados.length - 1)); }
                    if (e.key === 'ArrowUp') { e.preventDefault(); setHl(h => Math.max(h - 1, 0)); }
                    if (e.key === 'Enter') { const ex = PRODUTOS.find(p => p.code === busca.trim()); if (ex) addItem(ex); else if (resultados[hl]) addItem(resultados[hl]); }
                  }}
                  placeholder="Código de barras ou nome para adicionar"
                  className="w-full pl-10 pr-4 py-2.5 bg-white border border-line rounded-full text-sm" />
                {resultados.length > 0 && (
                  <ul className="absolute z-20 left-3 right-3 top-full mt-1 bg-white border border-line rounded-card shadow-soft overflow-hidden">
                    {resultados.map((p, i) => (
                      <li key={p.id}>
                        <button onMouseEnter={() => setHl(i)} onMouseDown={e => e.preventDefault()} onClick={() => addItem(p)}
                          className={`w-full grid grid-cols-[1fr_auto] gap-3 items-center px-4 py-2.5 text-left border-l-[3px] ${i === hl ? 'bg-acao-100 border-acao-600' : 'border-transparent'}`}>
                          <span className="min-w-0">
                            <span className="block text-sm font-semibold truncate">{p.name}</span>
                            <span className="flex items-center gap-1.5 text-[11.5px] text-ink-soft tabular-nums">#{p.code} · {p.stock} un. <OrigemBadge origem={p.origem} /></span>
                          </span>
                          <span className="font-display font-bold text-estrutura tabular-nums">{brl(d.canal === 'atacado' ? p.atacado : p.varejo)}</span>
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            )}

            <div className="hidden sm:grid grid-cols-[1fr_64px_110px_96px_104px_32px] gap-3 px-4 py-2 bg-fundo/40 border-b border-line">
              {['Produto', 'Origem', 'Qtd', 'Unitário', 'Total', ''].map((h, i) => <span key={i} className={`label ${i >= 3 && i < 5 ? 'text-right' : ''} ${i === 2 ? 'text-center' : ''}`}>{h}</span>)}
            </div>
            <ul className="divide-y divide-fundo">
              {d.itens.map(i => {
                const p = prod(i.pid);
                return (
                  <li key={i.pid} className="grid grid-cols-[1fr_auto] sm:grid-cols-[1fr_64px_110px_96px_104px_32px] gap-x-3 gap-y-2 items-center px-4 py-3">
                    <span className="min-w-0">
                      <span className="block text-sm font-semibold truncate">{p.name}</span>
                      <span className="block text-[11.5px] text-ink-soft tabular-nums">#{p.code} · NCM {p.ncm}<span className="sm:hidden"> · {brl(i.preco)} un.</span></span>
                    </span>
                    <span className="sm:hidden justify-self-end font-display font-bold text-estrutura tabular-nums">{brl(i.preco * i.qtd)}</span>
                    <span className="sm:justify-self-start"><OrigemBadge origem={p.origem} /></span>
                    {podeItens ? (
                      <span className="flex items-center gap-1 border border-line p-0.5 rounded-full justify-self-end sm:justify-self-center">
                        <button onClick={() => qtd(i.pid, i.qtd - 1)} aria-label={`Diminuir ${p.name}`} className="w-7 h-7 rounded-full flex items-center justify-center text-ink-soft hover:text-estrutura hover:bg-fundo"><Icon n="minus" className="w-3.5 h-3.5" /></button>
                        <input aria-label={`Quantidade de ${p.name}`} value={i.qtd} onChange={e => qtd(i.pid, Number(e.target.value.replace(/\D/g, '')) || 1)}
                          className="w-9 text-center text-sm font-bold text-estrutura tabular-nums bg-transparent border-0 p-0" />
                        <button onClick={() => qtd(i.pid, i.qtd + 1)} aria-label={`Aumentar ${p.name}`} className="w-7 h-7 rounded-full flex items-center justify-center text-ink-soft hover:text-estrutura hover:bg-fundo"><Icon n="plus" className="w-3.5 h-3.5" /></button>
                      </span>
                    ) : <span className="text-sm font-bold text-estrutura tabular-nums justify-self-end sm:justify-self-center">{i.qtd}</span>}
                    <span className="hidden sm:block text-right text-[13px] text-ink-soft tabular-nums">{brl(i.preco)}</span>
                    <span className="hidden sm:block text-right font-display font-bold text-estrutura tabular-nums">{brl(i.preco * i.qtd)}</span>
                    {podeItens
                      ? <button onClick={() => del(i.pid)} aria-label={`Remover ${p.name}`} className="justify-self-end p-1.5 text-ink-soft hover:text-acao-700 hover:bg-acao-100 rounded-panel"><Icon n="trash" /></button>
                      : <span className="hidden sm:block" />}
                  </li>
                );
              })}
              {d.itens.length === 0 && <li className="p-8 text-center text-sm text-ink-soft">Nenhum produto. Use a busca acima.</li>}
            </ul>
          </section>
        </div>

        {/* COLUNA(S) DA DIREITA: resumo + nota | entrega + ações (lado a lado em telas largas) */}
        <aside className={`grid gap-4 items-start ${d.entrega || d.devolucao ? 'xl:grid-cols-2' : ''}`}>
          <div className="space-y-4 min-w-0">
          <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-3">
            <h2 className="display text-base">Resumo</h2>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between text-ink-soft"><span>Subtotal ({t.qtd} itens)</span><span className="tabular-nums">{brl(t.sub)}</span></div>
              {[['desconto', 'Desconto (R$)'], ['frete', 'Frete (R$)']].map(([k, l]) => (
                <div key={k} className="flex justify-between items-center text-ink-soft">
                  <label htmlFor={k}>{l}</label>
                  <input id={k} type="number" min="0" step="0.01" disabled={!podeItens} value={d[k] || ''} placeholder="0,00"
                    onChange={e => up({ [k]: Math.max(0, Number(e.target.value)) })}
                    className="w-28 px-3 py-1.5 bg-white border border-line rounded-full text-right text-[13px] tabular-nums" />
                </div>
              ))}
            </div>
            <div className="rounded-card bg-acao-100 border border-acao-300 px-4 py-3">
              <span className="label">Total</span>
              <span className="display block text-[30px] leading-tight tabular-nums">{brl(t.total)}</span>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Campo id="forma" label="Pagamento">
                <select id="forma" className={inputCls} disabled={!podeItens} value={d.forma} onChange={e => up({ forma: e.target.value, condicao: e.target.value === 'Boleto' ? d.condicao : 'À vista' })}>
                  {FORMAS.map(x => <option key={x}>{x}</option>)}
                </select>
              </Campo>
              <Campo id="cond" label="Condição">
                <select id="cond" className={inputCls} disabled={!podeItens || d.forma !== 'Boleto'} value={d.condicao} onChange={e => up({ condicao: e.target.value })}>
                  {CONDICOES.map(x => <option key={x}>{x}</option>)}
                </select>
              </Campo>
            </div>
          </section>

          {/* Fiscal */}
          <section className="bg-white border border-line rounded-card shadow-card p-4 space-y-2.5">
            <div className="flex items-center justify-between">
              <h2 className="display text-base">Nota fiscal</h2>
              {d.nf ? <NfBadge nf={d.nf} /> : <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-estrutura text-white">{f.modelo} · modelo {f.codModelo}</span>}
            </div>
            <dl className="text-[13px] space-y-1.5">
              <div className="flex justify-between gap-3"><dt className="text-ink-soft">CFOP</dt><dd className="font-bold text-estrutura tabular-nums">{f.cfop}</dd></div>
              <p className="text-[11.5px] text-ink-soft -mt-1">{f.cfopDesc}</p>
              <div className="flex justify-between gap-3"><dt className="text-ink-soft">Destinatário</dt><dd className="font-semibold text-right">{f.cnpj ? (f.contribuinte ? 'Contribuinte de ICMS' : 'Não contribuinte') : d.cliente.doc ? 'Pessoa física' : 'Consumidor sem identificação'}</dd></div>
              <div className="flex justify-between gap-3"><dt className="text-ink-soft">Itens importados</dt><dd className="font-semibold tabular-nums">{d.itens.filter(i => prod(i.pid).origem !== 0).length} de {d.itens.length}</dd></div>
              {d.nf?.numero && <div className="flex justify-between gap-3"><dt className="text-ink-soft">Número / série</dt><dd className="font-bold text-estrutura tabular-nums">{d.nf.numero} / {d.nf.serie}</dd></div>}
            </dl>
            {d.nf?.status === 'autorizada' && (
              <div className="pt-2 border-t border-fundo">
                <span className="label mb-1.5">Envios da nota</span>
                {(d.envios || []).length === 0
                  ? <p className="text-[12px] text-warn font-semibold">Ainda não enviada ao cliente.</p>
                  : <ul className="space-y-1.5">{d.envios.map((e, i) => (
                      <li key={i} className="text-[12px] leading-snug">
                        <span className="font-semibold text-ink">{e.anexos.join(' + ')}</span> <span className="text-ink-soft">para {e.para.join(', ')}</span>
                        <span className="block text-[11px] text-ink-soft tabular-nums">{e.quando} · {e.modo}</span>
                      </li>))}</ul>}
              </div>
            )}
            {d.canal === 'atacado' && f.cnpj && !f.contribuinte && !d.nf && (
              <p className="text-[12px] text-warn font-semibold flex gap-1.5"><Icon n="alert" className="w-4 h-4 shrink-0" />Cliente de atacado sem IE: a SEFAZ costuma rejeitar. Confira a inscrição estadual.</p>
            )}
          </section>

          </div>
          <div className="space-y-4 min-w-0">
          {d.entrega && <EntregaPainel d={d} setD={setD} salvar={salvar} notify={notify} focoCodigo={foco === 'codigo'} />}
          {(d.devolucao || (d.nf?.status === 'autorizada' && concluida(d.entrega))) && <DevolucaoPainel key={d.id} d={d} salvar={salvar} notify={notify} proxNum={proxNum} />}

          {/* Ações por etapa */}
          <section className="space-y-2">
            {erro && <p className="text-[13px] text-bad font-semibold px-1">{erro}</p>}

            {novo && tipoNovo === 'pedido' && (
              <button onClick={() => concluir('salvarPedido')} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2"><Icon n="clip" className="w-5 h-5" />Salvar pedido</button>
            )}

            {(novo && tipoNovo === 'venda' || d.etapa === 'pedido' && !novo) && (<>
              <label className="flex items-center gap-2 text-[13px] text-ink-soft px-1 cursor-pointer">
                <input type="checkbox" checked={emitirJa} onChange={e => setEmitirJa(e.target.checked)} className="w-4 h-4 accent-[#A85F00]" />
                Emitir {f.modelo} ao finalizar
              </label>
              <button onClick={() => concluir('venda')} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2">
                <Icon n="check" className="w-5 h-5" />{novo ? 'Finalizar venda' : 'Converter em venda'}
              </button>
            </>)}

            {d.etapa === 'pedido' && !novo && (
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => concluir('salvarPedido')} className="py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full">Salvar pedido</button>
                <button onClick={cancelarPedido} className="py-2.5 bg-white border-[1.5px] border-line hover:border-bad hover:text-bad text-ink-soft font-bold text-[13.5px] rounded-full">Cancelar pedido</button>
              </div>
            )}

            {d.etapa === 'venda' && (
              <button onClick={() => concluir('emitir')} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2"><Icon n="doc" className="w-5 h-5" />Emitir {f.modelo}</button>
            )}

            {!novo && (d.etapa === 'pedido' || d.etapa === 'venda' || d.nf?.status === 'rejeitada') && (
              <button onClick={() => abrirEspelho(d)} className="w-full py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center justify-center gap-1.5">
                <Icon n="doc" />{d.etapa === 'pedido' ? 'Ver espelho do pedido' : 'Ver espelho da nota'}
              </button>
            )}

            {d.nf?.status === 'cancelada' && (
              <p className="w-full px-4 py-3 rounded-card border border-line bg-white text-[13px] text-ink-soft"><strong className="text-estrutura">{d.nf.modelo} {d.nf.numero} cancelada.</strong> {d.nf.motivo}</p>
            )}

            {d.nf?.status === 'transmitida' && (
              <p className="w-full py-3.5 bg-estrutura-light text-white font-bold rounded-full text-center text-sm">Aguardando retorno da SEFAZ…</p>
            )}

            {d.nf?.status === 'rejeitada' && (
              <button onClick={() => concluir('reemitir')} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2"><Icon n="doc" className="w-5 h-5" />Corrigir e reemitir</button>
            )}

            {d.nf?.status === 'autorizada' && (<>
              <button onClick={() => abrirEnvio(d)} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2"><Icon n="mail" className="w-5 h-5" />Enviar XML e PDF</button>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => abrirDanfe(d)} className="py-2.5 bg-estrutura hover:bg-estrutura-light text-white font-bold text-[13.5px] rounded-full flex items-center justify-center gap-1.5"><Icon n="doc" />{d.nf.modelo === 'NFC-e' ? 'DANFE NFC-e' : 'Ver DANFE'}</button>
                <button onClick={() => abrirXml(d)} className="py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center justify-center gap-1.5"><Icon n="code" />Ver XML</button>
              </div>
            </>)}

/* ---------- IMPORTAR DA LOJA ---------- */
function Importar({ pendentes, importar, voltar }) {
  const [sel, setSel] = useState(pendentes.map(p => p.loja));
  const toggle = l => setSel(s => s.includes(l) ? s.filter(x => x !== l) : [...s, l]);
  useEffect(() => setSel(pendentes.map(p => p.loja)), [pendentes.length]);
  return (
    <div className="space-y-4 max-w-4xl">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="display text-[21px] pn:text-[26px] leading-tight">Importar da loja online<span className="font-body text-[14.5px] font-normal text-ink-soft"> - pedidos pagos do e-commerce</span></h1>
        <button onClick={voltar} className="px-4 py-2 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full flex items-center gap-1.5"><Icon n="back" />Voltar</button>
      </div>
      <p className="text-sm text-ink-soft max-w-2xl">Cada pedido importado entra como <strong className="text-estrutura">Pedido</strong> no canal Loja online. Depois você converte em venda e emite a NF-e, como os outros pedidos.</p>
      <div className="bg-white border border-line rounded-card shadow-card overflow-hidden">
        <ul className="divide-y divide-fundo">
          {pendentes.map(p => {
            const tot = p.itens.reduce((a, i) => a + i.preco * i.qtd, 0) + p.frete;
            const imp = p.itens.some(i => prod(i.pid).origem !== 0);
            const on = sel.includes(p.loja);
            return (
              <li key={p.loja}>
                <label className={`grid grid-cols-[24px_1fr_auto] gap-3 items-center px-4 py-3.5 cursor-pointer ${on ? 'bg-acao-100/50' : ''}`}>
                  <input type="checkbox" checked={on} onChange={() => toggle(p.loja)} className="w-4 h-4 accent-[#A85F00]" />
                  <span className="min-w-0">
                    <span className="block text-sm"><strong className="text-estrutura tabular-nums">{p.loja}</strong> · <span className="font-semibold">{p.cliente.nome}</span></span>
                    <span className="block text-[11.5px] text-ink-soft tabular-nums truncate">
                      {p.data} · {p.cliente.doc} · {p.cliente.uf} · {p.itens.reduce((a, i) => a + i.qtd, 0)} itens · {p.forma}{imp && ' · tem importado'}
                    </span>
                  </span>
                  <span className="font-display font-bold text-estrutura tabular-nums">{brl(tot)}</span>
                </label>
              </li>
            );
          })}
          {pendentes.length === 0 && <li className="p-10 text-center text-sm text-ink-soft">Nenhum pedido novo na loja online.</li>}
        </ul>
      </div>
      {pendentes.length > 0 && (
        <button disabled={!sel.length} onClick={() => importar(sel)}
          className="px-6 py-3.5 bg-acao-600 hover:bg-acao-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-full shadow-acao flex items-center gap-2">
          <Icon n="download" className="w-5 h-5" />Importar {sel.length} {sel.length === 1 ? 'pedido' : 'pedidos'}
        </button>
      )}
    </div>
  );
}

/* ---------- EXPEDIÇÃO (fila de envios e rastreio) ---------- */
function Expedicao({ docs, salvar, abrir, notify }) {
  const [filtro, setFiltro] = useState('pendentes');
  const [q, setQ] = useState('');
  const envios = docs.filter(d => d.entrega && d.entrega.status !== 'retirado');
  const retirados = docs.filter(d => d.entrega?.status === 'retirado').length;
  const grupos = {
    pendentes: { nome: 'A expedir', sub: 'Separar e embalar', f: e => ['separar', 'embalado'].includes(e.status), icon: 'clip' },
    caminho: { nome: 'A caminho', sub: 'Postado, em trânsito, saiu', f: e => ['postado', 'transito', 'saiu'].includes(e.status), icon: 'truck' },
    problemas: { nome: 'Com problema', sub: 'Ocorrência ou atraso', f: e => e.status === 'ocorrencia' || atrasada(e), icon: 'alert' },
    entregues: { nome: 'Entregues', sub: 'Concluídas', f: e => e.status === 'entregue', icon: 'check' },
  };
  const lista = envios.filter(d => (filtro === 'todos' || grupos[filtro].f(d.entrega)) &&
    (!q || `${d.venda} ${d.cliente.nome} ${d.entrega.codigo} ${d.entrega.transportadora}`.toLowerCase().includes(q.toLowerCase())));

  const acao = d => {
    const e = d.entrega;
    if (e.status === 'separar') return { lbl: 'Marcar embalado', go: 'embalado' };
    if (e.status === 'embalado' && proprio(e)) return { lbl: 'Saiu c/ entregador', go: 'saiu' };
    if (e.status === 'embalado') return e.codigo ? { lbl: 'Postar', go: 'postado' } : { lbl: 'Informar rastreio', abrir: true };
    if (e.status === 'saiu' && proprio(e)) return { lbl: 'Marcar entregue', go: 'entregue' };
    if (e.status === 'ocorrencia') return { lbl: 'Resolver', abrir: true, perigo: true };
    if (['postado', 'transito', 'saiu'].includes(e.status)) return { lbl: 'Atualizar rastreio', go: PROXIMO[e.status], sec: true };
    return { lbl: 'Ver', abrir: true, sec: true };
  };
  const executar = d => {
    const a = acao(d);
    if (a.abrir) return abrir(d.id, a.lbl === 'Informar rastreio' ? 'codigo' : null);
    salvar({ ...d, entrega: comEvento(d.entrega, a.go, d.cliente) });
    const avisou = AVISAR[a.go] && emailOk(d.cliente.email || '');
    notify(`${d.venda}: ${ENTREGA[a.go].nome.toLowerCase()}${avisou ? ` · cliente avisado` : ''}`);
  };

  return (
    <div className="space-y-4">
      <h1 className="display text-[21px] pn:text-[26px] leading-tight">
        Expedição<span className="font-body text-[14.5px] font-normal text-ink-soft"> - envios e rastreio das vendas com nota autorizada</span>
      </h1>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {Object.entries(grupos).map(([k, g]) => {
          const n = envios.filter(d => g.f(d.entrega)).length; const on = filtro === k;
          const alerta = k === 'problemas' && n > 0;
          return (
            <button key={k} onClick={() => setFiltro(on ? 'todos' : k)} aria-pressed={on}
              className={`text-left p-3.5 rounded-card border bg-white shadow-card ${on ? 'border-acao-600 ring-2 ring-acao-300' : 'border-line hover:border-estrutura'}`}>
              <span className="flex items-center justify-between"><span className="label">{g.nome}</span><span className={alerta ? 'text-bad' : 'text-estrutura'}><Icon n={g.icon} /></span></span>
              <span className={`display block text-2xl tabular-nums mt-1 ${alerta ? '!text-bad' : ''}`}>{n}</span>
              <span className="block text-[12px] text-ink-soft">{g.sub}</span>
            </button>
          );
        })}
      </div>

      <div className="flex flex-col sm:flex-row gap-3 sm:items-center">
        <div className="relative flex-1">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-ink-soft"><Icon n="search" className="w-5 h-5" /></span>
          <label htmlFor="qexp" className="sr-only">Buscar envio</label>
          <input id="qexp" value={q} onChange={e => setQ(e.target.value)} placeholder="Venda, cliente, código de rastreio ou transportadora"
            className="w-full pl-12 pr-4 py-2.5 bg-white border border-line rounded-full text-sm shadow-card" />
        </div>
        <button onClick={() => setFiltro('todos')} aria-pressed={filtro === 'todos'}
          className={`px-4 py-2.5 rounded-full text-[13.5px] whitespace-nowrap border ${filtro === 'todos' ? 'bg-estrutura border-estrutura text-white font-bold' : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>
          Todos os envios ({envios.length})
        </button>
      </div>

      <div className="bg-white border border-line rounded-card shadow-card overflow-hidden">
        <div className="hidden lg:grid grid-cols-[110px_1fr_210px_90px_170px_170px] gap-3 px-4 py-2.5 bg-fundo/40 border-b border-line">
          {['Venda', 'Destinatário', 'Transportadora / código', 'Prazo', 'Situação', ''].map((h, i) => <span key={i} className="label">{h}</span>)}
        </div>
        <ul className="divide-y divide-fundo">
          {lista.map(d => {
            const e = d.entrega; const a = acao(d); const ult = e.eventos[0];
            return (
              <li key={d.id} className="grid grid-cols-[1fr_auto] lg:grid-cols-[110px_1fr_210px_90px_170px_170px] gap-x-3 gap-y-1.5 items-center px-4 py-3">
                <button onClick={() => abrir(d.id)} className="text-left">
                  <span className="block font-bold text-estrutura text-sm tabular-nums">{d.venda}</span>
                  <span className="block text-[11.5px] text-ink-soft">NF {d.nf.numero}</span>
                </button>
                <span className="lg:hidden justify-self-end"><EntregaBadge e={e} /></span>
                <span className="min-w-0 col-span-2 lg:col-span-1">
                  <span className="block text-sm font-semibold truncate">{d.cliente.nome}</span>
                  <span className="block text-[11.5px] text-ink-soft truncate" title={ult.texto}>{d.cliente.uf} · {ult.texto}</span>
                </span>
                <span className="min-w-0 col-span-2 lg:col-span-1">
                  <span className="block text-[13px] font-semibold text-ink truncate">{e.transportadora}</span>
                  <span className={`block text-[12px] tabular-nums truncate ${e.codigo ? 'text-estrutura font-bold select-all' : proprio(e) ? 'text-ink-soft' : 'text-warn font-semibold'}`}>{e.codigo || (proprio(e) ? 'Entregador da loja' : 'Sem código de rastreio')}</span>
                </span>
                <span className={`text-[13px] tabular-nums ${atrasada(e) ? 'text-bad font-bold' : 'text-ink-soft'}`}>
                  <span className="lg:hidden label inline mr-1">Prazo</span>{e.prazo || '—'}
                </span>
                <span className="hidden lg:block"><EntregaBadge e={e} /></span>
                <button onClick={() => executar(d)}
                  className={`col-span-2 lg:col-span-1 px-3.5 py-2 rounded-full text-[13px] font-bold flex items-center justify-center gap-1.5 ${a.perigo ? 'bg-bad text-white hover:opacity-90'
                    : a.sec ? 'bg-white border-[1.5px] border-line text-estrutura hover:border-estrutura' : 'bg-acao-600 hover:bg-acao-700 text-white'}`}>
                  {a.lbl}<Icon n="arrow" className="w-3.5 h-3.5" />
                </button>
              </li>
            );
          })}
          {lista.length === 0 && <li className="p-10 text-center text-sm text-ink-soft">Nenhum envio nesta situação.</li>}
        </ul>
      </div>
      <p className="text-[12px] text-ink-soft">{retirados} {retirados === 1 ? 'venda de balcão retirada' : 'vendas de balcão retiradas'} na loja hoje não {retirados === 1 ? 'entra' : 'entram'} na fila de expedição.</p>
    </div>
  );
}

/* ---------- ENVIAR XML E PDF ---------- */
function EnvioModal({ doc, fechar, salvar, notify }) {
  const [para, setPara] = useState(doc.cliente.email || '');
  const [contador, setContador] = useState(false);
  const [xml, setXml] = useState(true);
  const [pdf, setPdf] = useState(true);
  const [erro, setErro] = useState('');
  const nome = `${doc.nf.modelo === 'NFC-e' ? 'NFCe' : 'NFe'}${doc.nf.chave.replace(/\s/g, '')}`;

  const enviar = () => {
    const lista = para.split(/[,;\s]+/).filter(Boolean).concat(contador ? [CONTADOR] : []);
    if (!lista.length) return setErro('Informe pelo menos um e-mail.');
    const ruim = lista.find(e => !emailOk(e)); if (ruim) return setErro(`E-mail inválido: ${ruim}`);
    if (!xml && !pdf) return setErro('Marque XML, PDF ou os dois.');
    const anexos = [xml && 'XML', pdf && 'PDF'].filter(Boolean);
    salvar({ ...doc, envios: [{ quando: `05/10 · ${agoraHora()}`, para: lista, anexos, modo: 'Manual' }, ...(doc.envios || [])] });
    notify(`${anexos.join(' e ')} da ${doc.nf.modelo} ${doc.nf.numero} enviados para ${lista.length} ${lista.length === 1 ? 'destinatário' : 'destinatários'}`);
    fechar();
  };

  const Anexo = ({ on, set, tipo, arq, desc }) => (
    <label className={`flex items-center gap-3 p-3 rounded-card border cursor-pointer ${on ? 'bg-acao-100 border-acao-600' : 'bg-white border-line hover:border-estrutura'}`}>
      <input type="checkbox" checked={on} onChange={e => set(e.target.checked)} className="w-4 h-4 accent-[#A85F00]" />
      <span className={`w-9 h-9 shrink-0 rounded-panel flex items-center justify-center text-[11px] font-extrabold ${on ? 'bg-acao-600 text-white' : 'bg-fundo text-estrutura'}`}>{tipo}</span>
      <span className="min-w-0">
        <span className="block text-[12.5px] font-bold text-estrutura truncate tabular-nums">{arq}</span>
        <span className="block text-[11.5px] text-ink-soft">{desc}</span>
      </span>
    </label>
  );

  return (
    <div className="fixed inset-0 z-50 bg-estrutura/60 flex items-end sm:items-center justify-center sm:p-4" onClick={fechar}>
      <div role="dialog" aria-modal="true" aria-labelledby="envio-titulo" onClick={e => e.stopPropagation()}
        className="bg-white w-full sm:max-w-lg max-h-[92%] overflow-y-auto rounded-t-banner sm:rounded-banner shadow-soft">
        <div className="flex items-center justify-between px-5 py-4 border-b border-line">
          <div>
            <h2 id="envio-titulo" className="display text-lg leading-tight">Enviar XML e PDF</h2>
            <p className="text-[13px] text-ink-soft">{doc.nf.modelo} {doc.nf.numero} · {doc.venda} · {doc.cliente.nome || 'Consumidor final'}</p>
          </div>
          <button onClick={fechar} aria-label="Fechar" className="p-1 text-ink-soft hover:text-estrutura"><Icon n="x" className="w-6 h-6" /></button>
        </div>
        <div className="p-5 space-y-4">
          <Campo id="envio-para" label="Para" hint="Separe vários e-mails com vírgula">
            <input id="envio-para" type="text" className={inputCls} value={para} onChange={e => setPara(e.target.value)} placeholder="cliente@email.com" autoFocus />
          </Campo>
          <label className="flex items-center gap-2 text-[13px] text-ink cursor-pointer px-1">
            <input type="checkbox" checked={contador} onChange={e => setContador(e.target.checked)} className="w-4 h-4 accent-[#A85F00]" />
            Enviar cópia para a contabilidade <span className="text-ink-soft">({CONTADOR})</span>
          </label>
          <div className="space-y-2">
            <span className="label">Anexos</span>
            <Anexo on={xml} set={setXml} tipo="XML" arq={`${nome}.xml`} desc="Arquivo fiscal com validade jurídica. Empresas precisam dele para escriturar a compra." />
            <Anexo on={pdf} set={setPdf} tipo="PDF" arq={`${nome}.pdf`} desc={doc.nf.modelo === 'NFC-e' ? 'DANFE NFC-e, o cupom com QR Code para consulta' : 'DANFE, a representação impressa da nota'} />
          </div>
          <div className="rounded-card bg-fundo/40 border border-line p-3 text-[12.5px] text-ink-soft space-y-1">
            <p><strong className="text-estrutura">Assunto:</strong> Nota fiscal {doc.nf.numero} · ADEGA SB</p>
            <p>Olá{doc.cliente.nome ? `, ${doc.cliente.nome.split(' ')[0]}` : ''}! Segue a nota fiscal da sua compra de {brl(totais(doc).total)}. Os arquivos estão em anexo.</p>
          </div>
          {erro && <p className="text-[13px] text-bad font-semibold">{erro}</p>}
          <button onClick={enviar} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2">
            <Icon n="mail" className="w-5 h-5" />Enviar {[xml && 'XML', pdf && 'PDF'].filter(Boolean).join(' e ') || 'nota'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- VISUALIZAR XML ---------- */
function XmlModal({ doc, fechar }) {
  const texto = useMemo(() => gerarXml(doc), [doc]);
  const [ok, setOk] = useState(false);
  const preRef = useRef(null);
  const copiar = async () => {
    try { await navigator.clipboard.writeText(texto); setOk(true); setTimeout(() => setOk(false), 2000); }
    catch { const r = document.createRange(); r.selectNodeContents(preRef.current); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-estrutura/60 flex items-end sm:items-center justify-center sm:p-4" onClick={fechar}>
      <div role="dialog" aria-modal="true" aria-label="XML da nota" onClick={e => e.stopPropagation()}
        className="bg-white w-full sm:max-w-3xl max-h-[92%] flex flex-col rounded-t-banner sm:rounded-banner shadow-soft overflow-hidden">
        <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-line shrink-0">
          <div className="min-w-0">
            <h2 className="display text-lg leading-tight">XML · {doc.nf.modelo} {doc.nf.numero}</h2>
            <p className="text-[12px] text-ink-soft">Versão simplificada para conferência. O arquivo real traz todos os grupos exigidos pela SEFAZ e a assinatura digital.</p>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={copiar} className="px-3.5 py-2 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13px] rounded-full flex items-center gap-1.5">
              <Icon n={ok ? 'check' : 'copy'} />{ok ? 'Copiado' : 'Copiar'}
            </button>
            <button onClick={fechar} aria-label="Fechar" className="p-1 text-ink-soft hover:text-estrutura"><Icon n="x" className="w-6 h-6" /></button>
          </div>
        </div>
        <pre ref={preRef} className="flex-1 overflow-auto p-5 text-[12px] leading-relaxed bg-[#F6F7F8] text-estrutura font-mono whitespace-pre">{texto}</pre>
      </div>
    </div>
  );
}
