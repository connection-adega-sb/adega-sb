                <p className="display text-2xl tabular-nums">{numero}</p>
                <p className="text-[11.5px] text-ink-soft tabular-nums">Emitido em {hoje}{doc.pedido && !ehPedido ? ` · pedido ${doc.pedido}` : ''}</p>
                {!ehPedido && <p className="text-[11.5px] text-ink-soft">{f.modelo} (modelo {f.codModelo}) · série {f.modelo === 'NFC-e' ? 2 : 1}</p>}
              </div>
            </div>

            <div className="relative grid sm:grid-cols-[1fr_auto_auto] gap-2">
              <Cx l={ehPedido ? 'Cliente' : 'Destinatário'}>
                <p className="font-bold text-estrutura truncate">{doc.cliente.nome || 'Consumidor final'}</p>
                <p className="text-[11.5px] text-ink-soft tabular-nums">{doc.cliente.doc || 'Sem CPF/CNPJ'}{doc.cliente.ie ? ` · IE ${doc.cliente.ie}` : ''} · {doc.cliente.uf}{doc.cliente.email ? ` · ${doc.cliente.email}` : ''}</p>
              </Cx>
              <Cx l="Canal"><p className="font-semibold">{CANAIS[doc.canal].nome}{doc.origemLoja ? ` · loja ${doc.origemLoja}` : ''}</p></Cx>
              <Cx l={ehPedido ? 'Data do pedido' : 'Natureza da operação'}><p className="font-semibold">{ehPedido ? doc.criado : `Venda de mercadoria · CFOP ${f.cfop}`}</p></Cx>
            </div>

            <div className="relative overflow-x-auto border border-line rounded-panel">
              <table className="w-full text-[12px] tabular-nums">
                <thead className="bg-fundo/70 text-left">
                  <tr>{['Código', 'Descrição', ...(ehPedido ? [] : ['NCM', 'Orig.', 'CFOP']), 'Qtd', 'Vl. unit.', 'Vl. total'].map(h => <th key={h} className={`text-[9.5px] font-extrabold uppercase tracking-[.1em] text-ink-soft px-2.5 py-2 whitespace-nowrap ${['Qtd', 'Vl. unit.', 'Vl. total'].includes(h) ? 'text-right' : ''}`}>{h}</th>)}</tr>
                </thead>
                <tbody className="divide-y divide-fundo">
                  {doc.itens.map(i => { const p = prod(i.pid); return (
                    <tr key={i.pid}>
                      <td className="px-2.5 py-2 whitespace-nowrap text-ink-soft">{p.code}</td>
                      <td className="px-2.5 py-2 min-w-[180px]">{p.name}</td>
                      {!ehPedido && <><td className="px-2.5 py-2 whitespace-nowrap">{p.ncm}</td><td className="px-2.5 py-2">{p.origem}</td><td className="px-2.5 py-2">{f.cfop}</td></>}
                      <td className="px-2.5 py-2 text-right">{i.qtd}</td>
                      <td className="px-2.5 py-2 text-right whitespace-nowrap">{brl(i.preco)}</td>
                      <td className="px-2.5 py-2 text-right whitespace-nowrap font-bold text-estrutura">{brl(i.preco * i.qtd)}</td>
                    </tr>
                  ); })}
                </tbody>
              </table>
            </div>

            <div className="relative grid sm:grid-cols-2 gap-4">
              <div className="space-y-2">
                <Cx l="Pagamento">
                  <p className="font-semibold">{doc.forma} · {doc.condicao}</p>
                  {doc.forma === 'Boleto' && <ul className="mt-1 text-[11.5px] text-ink-soft tabular-nums">{parcelas.map(p => <li key={p.n}>Parcela {p.n} · {p.dias ? `${p.dias} dias` : 'à vista'} · {brl(p.valor)}</li>)}</ul>}
                </Cx>
                <Cx l="Observações">
                  <p className="text-[11.5px] text-ink-soft">{ehPedido
                    ? 'Pedido sujeito à disponibilidade de estoque. Preços válidos por 7 dias. Prazo de entrega a combinar.'
                    : `Documento de conferência. A ${f.modelo} oficial é emitida após a autorização da SEFAZ.${doc.pedido ? ` Ref. pedido ${doc.pedido}.` : ''}`}</p>
                </Cx>
              </div>
              <div className="border border-line rounded-panel p-3 space-y-1 text-[12.5px] tabular-nums self-start">
                <div className="flex justify-between text-ink-soft"><span>Subtotal ({t.qtd} itens)</span><span>{brl(t.sub)}</span></div>
                {doc.desconto > 0 && <div className="flex justify-between text-ink-soft"><span>Desconto</span><span>- {brl(doc.desconto)}</span></div>}
                {doc.frete > 0 && <div className="flex justify-between text-ink-soft"><span>Frete</span><span>{brl(doc.frete)}</span></div>}
                <div className="flex justify-between items-baseline pt-2 mt-1 border-t border-line"><span className="display text-sm">{ehPedido ? 'Total do pedido' : 'Valor total da nota'}</span><span className="display text-xl">{brl(t.total)}</span></div>
              </div>
            </div>

            {ehPedido && (
              <div className="relative grid grid-cols-2 gap-8 pt-8">
                {['ADEGA SB', `Aceite do cliente${doc.cliente.nome ? ` · ${doc.cliente.nome}` : ''}`].map(a => <div key={a} className="border-t border-ink pt-1 text-center text-[11px] text-ink-soft">{a}</div>)}
              </div>
            )}
          </div>
        </div>

        <div className="p-4 bg-white border-t border-line flex flex-wrap gap-2 justify-end shrink-0">
          <button onClick={fechar} className="px-5 py-2.5 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full">Fechar</button>
          <button onClick={enviar} className="px-5 py-2.5 bg-acao-600 hover:bg-acao-700 text-white font-bold text-[13.5px] rounded-full shadow-acao flex items-center gap-2"><Icon n="mail" />Enviar ao cliente por e-mail</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- DANFE (visualização) ---------- */
function Danfe({ doc, fechar, abrirEnvio, abrirXml }) {
  const f = fiscal(doc); const t = totais(doc);
  return (
    <div className="fixed inset-0 z-50 bg-estrutura/60 flex items-end sm:items-center justify-center sm:p-4" onClick={fechar}>
      <div role="dialog" aria-modal="true" aria-label="Visualização da nota" onClick={e => e.stopPropagation()}
        className="bg-white w-full sm:max-w-2xl max-h-[92%] overflow-y-auto rounded-t-banner sm:rounded-banner shadow-soft">
        <div className="flex items-center justify-between px-5 py-4 border-b border-line sticky top-0 bg-white">
          <h2 className="display text-lg">{doc.nf.modelo} {doc.nf.numero} · série {doc.nf.serie}</h2>
          <button onClick={fechar} aria-label="Fechar" className="p-1 text-ink-soft hover:text-estrutura"><Icon n="x" className="w-6 h-6" /></button>
        </div>
        <div className="p-5 space-y-4 text-[13px]">
          <div className="grid sm:grid-cols-2 gap-3">
            <div className="border border-line rounded-card p-3">
              <span className="label mb-1">Emitente</span>
              <p className="font-bold text-estrutura">{EMITENTE.nome}</p>
              <p className="text-ink-soft tabular-nums">CNPJ {EMITENTE.cnpj} · IE {EMITENTE.ie}</p>
              <p className="text-ink-soft">{EMITENTE.cidade} / {EMITENTE.uf}</p>
            </div>
            <div className="border border-line rounded-card p-3">
              <span className="label mb-1">Destinatário</span>
              <p className="font-bold text-estrutura">{doc.cliente.nome || 'Consumidor final'}</p>
              <p className="text-ink-soft tabular-nums">{doc.cliente.doc || 'Não identificado'}{doc.cliente.ie && ` · IE ${doc.cliente.ie}`}</p>
              <p className="text-ink-soft">UF {doc.cliente.uf} · CFOP {f.cfop}</p>
            </div>
          </div>
          <div className="border border-line rounded-card overflow-x-auto">
            <table className="w-full text-[12.5px] tabular-nums">
              <thead className="bg-fundo/40"><tr className="text-left">
                {['Produto', 'NCM', 'Orig.', 'Qtd', 'Unit.', 'Total'].map(h => <th key={h} className="text-[10.5px] font-extrabold uppercase tracking-[.1em] text-ink-soft px-3 py-2">{h}</th>)}
              </tr></thead>
              <tbody className="divide-y divide-fundo">
                {doc.itens.map(i => { const p = prod(i.pid); return (
                  <tr key={i.pid}><td className="px-3 py-2">{p.name}</td><td className="px-3 py-2 whitespace-nowrap">{p.ncm}</td><td className="px-3 py-2">{p.origem}</td>
                    <td className="px-3 py-2">{i.qtd}</td><td className="px-3 py-2 whitespace-nowrap">{brl(i.preco)}</td><td className="px-3 py-2 whitespace-nowrap font-bold text-estrutura">{brl(i.preco * i.qtd)}</td></tr>
                ); })}
              </tbody>
            </table>
          </div>
          <div className="flex flex-wrap justify-between gap-3 items-end">
            <div className="text-ink-soft">
              <p>Desconto {brl(doc.desconto)} · Frete {brl(doc.frete)}</p>
              <p>{doc.forma} · {doc.condicao}</p>
            </div>
            <div className="text-right"><span className="label">Valor total da nota</span><span className="display text-2xl tabular-nums">{brl(t.total)}</span></div>
          </div>
          <div className="border border-ok/40 bg-ok/5 rounded-card p-3">
            <span className="label mb-1">Chave de acesso · autorizada {doc.nf.em}</span>
            <p className="font-bold text-estrutura tabular-nums break-all select-all">{doc.nf.chave}</p>
          </div>
          <div className="grid sm:grid-cols-2 gap-2">
            <button onClick={() => { fechar(); abrirEnvio(doc); }} className="py-3 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2"><Icon n="mail" />Enviar XML e PDF</button>
            <button onClick={() => { fechar(); abrirXml(doc); }} className="py-3 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold rounded-full flex items-center justify-center gap-2"><Icon n="code" />Ver XML</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- APP ---------- */
function App() {
  const [docs, setDocs] = useState(DOCS_INICIAIS);
  const [view, setView] = useState({ tela: 'lista' });
  const [pendentes, setPendentes] = useState(LOJA_PENDENTES);
  const [danfe, setDanfe] = useState(null);
  const [envio, setEnvio] = useState(null);
  const [espelho, setEspelho] = useState(null);
  const [xmlDoc, setXmlDoc] = useState(null);
  const [toast, setToast] = useState(null);
  const contadores = useRef({ P: 1061, V: 2241, 'NF-e': 4534, 'NFC-e': 18813, VT: 32 });
  const tRef = useRef(null);

  const notify = m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), 3200); };
  const proxNum = k => contadores.current[k]++;

  const salvar = doc => {
    setDocs(ds => {
      if (doc._excluir) return ds.filter(x => x.id !== doc.id);
      return ds.some(x => x.id === doc.id) ? ds.map(x => x.id === doc.id ? doc : x) : [doc, ...ds];
    });
    setView(v => v.tela === 'editor' ? { ...v, id: doc.id } : v);
  };

  const novo = () => {
    const id = 'n' + Date.now();
    setView({ tela: 'editor', id, rascunho: { id, pedido: null, venda: null, etapa: null, _tipo: 'venda', canal: 'varejo', criado: null,
      cliente: novoCliente(), itens: [], desconto: 0, frete: 0, forma: 'PIX', condicao: 'À vista', nf: null, origemLoja: null } });
  };

  const importar = lojas => {
    const novos = pendentes.filter(p => lojas.includes(p.loja)).map(p => ({
      id: 'i' + p.loja, pedido: `P-${proxNum('P')}`, venda: null, etapa: 'pedido', canal: 'online', criado: p.data,
      cliente: { ...p.cliente }, itens: p.itens.map(i => ({ ...i })), desconto: 0, frete: p.frete,
      forma: p.forma, condicao: 'À vista', nf: null, origemLoja: p.loja }));
    setDocs(ds => [...novos, ...ds]);
    setPendentes(ps => ps.filter(p => !lojas.includes(p.loja)));
    notify(`${novos.length} ${novos.length === 1 ? 'pedido importado' : 'pedidos importados'} da loja online`);
    setView({ tela: 'lista' });
  };

  const docAtual = view.tela === 'editor' ? (docs.find(d => d.id === view.id) || view.rascunho) : null;
  const abas = [['lista', 'Vendas'], ['expedicao', 'Expedição'], ['importar', 'Importar da loja']];
  const filaExp = docs.filter(d => d.entrega && (['separar', 'embalado', 'ocorrencia'].includes(d.entrega.status) || atrasada(d.entrega))).length;
  const abrirDoc = (id, foco = null) => setView({ tela: 'editor', id, foco, de: view.tela === 'expedicao' ? 'expedicao' : 'lista' });

  return (
    <div className="min-h-full flex flex-col bg-fundo font-body text-ink">
      <header className="bg-estrutura border-b border-white/10 shrink-0">
        <div className="flex items-center justify-between gap-3 px-4 pn:px-6 py-3">
          <div className="flex items-center gap-3 min-w-0">
            <img src={LOGO} alt="ADEGA SB" className="h-10 sm:h-11 w-auto shrink-0" />
            <div className="min-w-0">
              <p className="sr-only">ADEGA SB</p>
              <p className="text-[10.5px] font-extrabold uppercase tracking-[.1em] text-white/70 truncate">ERP · Vendas · {hoje}</p>
            </div>
          </div>
          <nav className="flex gap-1.5 overflow-x-auto scrollbar-none" aria-label="Seções de vendas">
            {abas.map(([k, l]) => {
              const on = view.tela === k || (view.tela === 'editor' && (view.de || 'lista') === k);
              const badge = k === 'importar' ? pendentes.length : k === 'expedicao' ? filaExp : 0;
              return (
                <button key={k} onClick={() => setView({ tela: k })} aria-current={on ? 'page' : undefined}
                  className={`px-3.5 py-2 rounded-full text-[13.5px] whitespace-nowrap flex items-center gap-1.5 ${on ? 'bg-acao-600 text-white font-bold' : 'text-white/85 font-semibold hover:bg-white/10'}`}>
                  {l}{badge > 0 && <span className={`text-[11px] rounded-full px-1.5 tabular-nums ${on ? 'bg-white text-acao-700' : 'bg-acao-600 text-white'}`}>{badge}</span>}
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      <main className="flex-1 w-full max-w-[1440px] mx-auto px-4 pn:px-8 py-5 pn:py-6">
        {view.tela === 'lista' && <Lista docs={docs} abrir={id => abrirDoc(id)} novo={novo} irImportar={() => setView({ tela: 'importar' })} pendentesLoja={pendentes.length} />}
        {view.tela === 'expedicao' && <Expedicao docs={docs} salvar={salvar} abrir={abrirDoc} notify={notify} />}
        {view.tela === 'editor' && docAtual && <Editor key={docAtual.id} doc={docAtual} foco={view.foco} salvar={salvar} voltar={() => setView({ tela: view.de || 'lista' })} notify={notify} abrirDanfe={setDanfe} abrirEnvio={setEnvio} abrirXml={setXmlDoc} abrirEspelho={setEspelho} proxNum={proxNum} />}
        {view.tela === 'importar' && <Importar pendentes={pendentes} importar={importar} voltar={() => setView({ tela: 'lista' })} />}
      </main>

      {danfe && <Danfe doc={danfe} fechar={() => setDanfe(null)} abrirEnvio={setEnvio} abrirXml={setXmlDoc} />}
      {envio && <EnvioModal doc={docs.find(x => x.id === envio.id) || envio} fechar={() => setEnvio(null)} salvar={salvar} notify={notify} />}
      {espelho && <EspelhoModal doc={espelho} fechar={() => setEspelho(null)} notify={notify} />}
      {xmlDoc && <XmlModal doc={xmlDoc} fechar={() => setXmlDoc(null)} />}
      {toast && (
        <div role="status" className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-2 px-5 py-3 bg-estrutura text-white font-semibold text-sm rounded-full shadow-soft max-w-[calc(100%-32px)]">
          <span className="text-acao-300"><Icon n="check" /></span>{toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
