<style>
  /* Layout: busca com resultados sob demanda sobre fundo fundo + comanda branca fixa (drawer abaixo de 900px) + painel de caixa em modal — ADEGA SB · azul profundo, laranja e pérola (brandbook 2026) · Simone Alves Nascimento, CNPJ 43.466.024/0001-43 */
  :root {
    --bg-fundo:#E9EAEC; --white:#FFFFFF;
    --estrutura:#232F3E; --estrutura-light:#2E3D50;
    --acao-100:#FFF1DC; --acao-300:#FFC266; --acao-600:#A85F00; --acao-600-dark:#8F4A00;
    --ink:#10151C; --ink-soft:#525B6B; --ink-faint:#C9CDD3; --border:#CDD1D6; --line-input:#7A7F87;
    --ok:#1E7F4F; --bad:#B42318; --warn:#B54708;
    --font-display:'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; background: var(--bg-fundo); color: var(--ink); font-family: var(--font-body); }
  #root { height: 100%; }
  .display { font-family: var(--font-display); font-weight: 700; color: var(--estrutura); letter-spacing: .01em; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { scrollbar-width: none; }
  button, input, select { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s, transform .15s; }
  button:focus-visible { outline: 2px solid var(--estrutura); outline-offset: 2px; }
  /* Borda de controle com contraste ≥ 3:1 (WCAG 1.4.11): cards usam --border, inputs usam --line-input */
  input[class*="border-line"], select[class*="border-line"], textarea[class*="border-line"] { border-color: var(--line-input); }
  input:focus, select:focus { outline: none; border-color: var(--estrutura) !important; }
  .label { display:block; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const dataExtenso = (d = new Date()) => `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
// Valor por extenso em reais (até milhões)
function extenso(v) {
  const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = n => {
    if (!n) return ''; if (n === 100) return 'cem';
    const p = [], c = Math.floor(n / 100), r = n % 100;
    if (c) p.push(C[c]);
    if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
    return p.join(' e ');
  };
  const inteiro = Math.floor(v + 1e-9), cent = Math.round((v - inteiro) * 100);
  const mi = Math.floor(inteiro / 1e6), mil = Math.floor((inteiro % 1e6) / 1000), resto = inteiro % 1000;
  const g = [];
  if (mi) g.push(ate999(mi) + (mi === 1 ? ' milhão' : ' milhões'));
  if (mil) g.push(mil === 1 ? 'mil' : ate999(mil) + ' mil');
  if (resto) g.push(ate999(resto));
  let reais = g.length > 1 && (resto < 100 || resto % 100 === 0) && resto ? g.slice(0, -1).join(' ') + ' e ' + g[g.length - 1] : g.join(' ');
  if (inteiro) reais += (inteiro % 1e6 === 0 && mi ? ' de reais' : inteiro === 1 ? ' real' : ' reais');
  const cents = cent ? ate999(cent) + (cent === 1 ? ' centavo' : ' centavos') : '';
  return [reais, cents].filter(Boolean).join(' e ') || 'zero real';
}

/* ---------- CUPOM FISCAL (DANFE NFC-e) E RECIBO ---------- */
// Chave de acesso NFC-e: cUF(35) AAMM CNPJ mod(65) série nNF tpEmis cNF DV (módulo 11)
const mascaraCpf = v => v.replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
function cpfValido(d) {
  if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0; for (let i = 0; i < t; i++) s += Number(d[i]) * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(d[t])) return false;
  }
  return true;
}
function chaveNfce(numero, serie, quando) {
  const aamm = String(quando.getFullYear()).slice(2) + String(quando.getMonth() + 1).padStart(2, '0');
  const cnf = String(Math.floor(Math.random() * 1e8)).padStart(8, '0');
  const base = '35' + aamm + EMPRESA.cnpj.replace(/\D/g, '') + '65' + String(serie).padStart(3, '0') + String(numero).padStart(9, '0') + '1' + cnf;
  let soma = 0, peso = 2;
  for (let i = base.length - 1; i >= 0; i--) { soma += Number(base[i]) * peso; peso = peso === 9 ? 2 : peso + 1; }
  const r = soma % 11, dv = r < 2 ? 0 : 11 - r;
  return (base + dv).replace(/(\d{4})/g, '$1 ').trim();
}
// QR Code ilustrativo (o real é gerado pela biblioteca a partir da URL de consulta da SEFAZ-SP)
function QrSimulado({ texto, size = 116 }) {
  const n = 25, cel = size / n; let h = 0;
  for (const ch of texto) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const finder = (x, y) => [[x, y, 7], [x + 1, y + 1, 5], [x + 2, y + 2, 3]];
  const quads = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const emFinder = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!emFinder && rnd() > 0.52) quads.push([x, y]);
  }
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="QR Code de consulta (ilustrativo)">
      <rect width={size} height={size} fill="#FFFFFF" />
      {[[0, 0], [n - 7, 0], [0, n - 7]].map(([x, y], i) => finder(x, y).map(([a, b, s], j) => (
        <rect key={`${i}-${j}`} x={a * cel} y={b * cel} width={s * cel} height={s * cel} fill={j === 1 ? '#FFFFFF' : '#111111'} />)))}
      {quads.map(([x, y]) => <rect key={`${x}-${y}`} x={x * cel} y={y * cel} width={cel + 0.2} height={cel + 0.2} fill="#111111" />)}
    </svg>
  );
}

            <div className="mx-auto w-full max-w-[380px] bg-white shadow-card px-5 py-5 text-[12.5px] text-ink">
              <div className="flex items-center gap-3 pb-3 border-b border-line">
                <img src={LOGO_ESCURO} alt="" className="h-10 w-auto" />
                <div className="min-w-0">
                  <p className="display text-[17px] leading-tight">{EMPRESA.fantasia}</p>
                  <p className="text-[10.5px] text-ink-soft">CNPJ {EMPRESA.cnpj} · {EMPRESA.fone}</p>

              </div>
              <div className="flex items-baseline justify-between gap-3 mt-3">
                <p className="label !text-estrutura">Recibo nº {v.recibo}</p>
                <p className="display text-xl tabular-nums">{brl(v.total)}</p>
              </div>
              <p className="mt-3 leading-relaxed">
                Recebemos de <strong>{v.cpf ? `cliente CPF ${v.cpf}` : 'consumidor final'}</strong> a importância de <strong>{brl(v.total)}</strong> ({extenso(v.total)}),
                referente à compra das mercadorias abaixo, paga em <strong>{formaNome}</strong>.
              </p>
              <table className="w-full mt-3 text-[12px] tabular-nums">
                <thead><tr className="text-left text-ink-soft"><th className="font-semibold pb-1">Item</th><th className="font-semibold pb-1 text-center">Qtd</th><th className="font-semibold pb-1 text-right">Total</th></tr></thead>
                <tbody className="divide-y divide-fundo">
                  {v.itens.map(i => <tr key={i.id}><td className="py-1 pr-2">{i.name}</td><td className="py-1 text-center">{i.quantity}</td><td className="py-1 text-right">{brl(i.price * i.quantity)}</td></tr>)}
                </tbody>
              </table>
              <div className="mt-2 pt-2 border-t border-line space-y-0.5 tabular-nums">
                {v.desconto > 0 && <div className="flex justify-between text-ink-soft"><span>Desconto</span><span>- {brl(v.desconto)}</span></div>}
                <div className="flex justify-between font-bold text-estrutura"><span>Total pago</span><span>{brl(v.total)}</span></div>
                {v.forma === 'cash' && <div className="flex justify-between text-ink-soft"><span>Recebido / troco</span><span>{brl(v.recebido)} / {brl(v.troco)}</span></div>}
              </div>
              <p className="mt-4">{EMPRESA.cidade}, {dataExtenso()}.</p>
              <div className="mt-8 border-t border-ink w-56 mx-auto pt-1 text-center text-[11px] text-ink-soft">{EMPRESA.fantasia} · {v.operador}</div>
              <p className="mt-4 text-[10.5px] text-ink-soft text-center">Documento sem valor fiscal. Referente à NFC-e nº {v.numero}.</p>
              <div className="mt-3 pt-2 border-t border-dashed border-line text-center text-[11px] text-ink-soft leading-snug">
                <p>Operador(a): {v.operador} · Caixa #01</p>
                <p>Trocas com este cupom ou o recibo</p>
              </div>
            </div>
          )}
        </div>

        <div className="p-4 border-t border-line grid gap-2 shrink-0">
          <button onClick={fechar} className="w-full py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2"><Icon n="check" className="w-5 h-5" />Nova venda (Enter)</button>
          <p className="text-[11.5px] text-ink-soft text-center">Vai entregar? Feche e use <strong className="text-estrutura">F9 › Balcão › Enviar por delivery</strong>. No sistema real, o cupom sai na térmica de 80 mm.</p>
        </div>
      </div>
    </div>
  );
}

const PAY = [
  { id: 'pix', label: 'PIX', icon: 'qr' },
  { id: 'card', label: 'Cartão', icon: 'card' },
  { id: 'cash', label: 'Dinheiro', icon: 'cash' },
];

// O dia começa com o caixa fechado: o operador abre informando o valor de abertura
const SESSAO_INICIAL = { aberto: false, operador: null, fundo: 0, vendas: [], movs: [] };

function resumo(s) {
  const por = m => s.vendas.filter(v => v.metodo === m).reduce((a, v) => a + v.total, 0);
  const sup = s.movs.filter(m => m.tipo === 'suprimento').reduce((a, m) => a + m.valor, 0);
  const san = s.movs.filter(m => m.tipo === 'sangria').reduce((a, m) => a + m.valor, 0);
  const cash = por('cash'), pix = por('pix'), card = por('card');
  return { cash, pix, card, sup, san, vendas: cash + pix + card, qtd: s.vendas.filter(v => !v.taxa).length, gaveta: s.fundo + cash + sup - san };
}

/* ---------- PAINEL DE CAIXA ---------- */
function CaixaModal({ sessao, setSessao, onClose, notify }) {
  const r = resumo(sessao);
  const [tab, setTab] = useState('mov');
  const [tipo, setTipo] = useState('sangria');
  const [valor, setValor] = useState('');
  const [motivo, setMotivo] = useState('');
  const [contado, setContado] = useState('');
  const [novoOp, setNovoOp] = useState(OPERADORES[0]);
  const [fundo, setFundo] = useState('');
  const [erro, setErro] = useState('');

  const lancar = () => {
    const v = Number(valor);
    if (!v || v <= 0) return setErro('Informe um valor maior que zero.');
    if (tipo === 'sangria' && v > r.gaveta) return setErro(`A gaveta tem só ${brl(r.gaveta)} em dinheiro.`);
    if (!motivo.trim()) return setErro('Descreva o motivo do lançamento.');
    setSessao(s => ({ ...s, movs: [...s.movs, { hora: agora(), tipo, valor: v, motivo: motivo.trim() }] }));
    setValor(''); setMotivo(''); setErro('');
    notify(`${tipo === 'sangria' ? 'Sangria' : 'Suprimento'} de ${brl(v)} lançado`);
  };

  const diff = contado === '' ? null : Number(contado) - r.gaveta;

  const fechar = () => {
    if (contado === '') return setErro('Conte o dinheiro da gaveta antes de fechar.');
    setSessao(s => ({ ...s, aberto: false, fechamento: agora(), contado: Number(contado), diferenca: diff }));
    setErro(''); setContado('');
    notify(`Caixa fechado por ${sessao.operador}`);
  };

  const abrir = () => {
    const f = Number(fundo);
    if (fundo === '' || isNaN(f) || f < 0) return setErro('Informe o valor de abertura (pode ser 0,00).');
    setSessao({ aberto: true, operador: novoOp, abertura: agora(), fundo: f, vendas: [], movs: [] });
    setErro(''); setTab('mov'); setFundo('');
    notify(`Caixa aberto por ${novoOp} com ${brl(f)}`);
    onClose();
  };

  const Linha = ({ k, v, strong, cls = '' }) => (
    <div className={`flex justify-between py-1.5 text-sm ${strong ? 'font-bold text-estrutura' : 'text-ink-soft'}`}>
      <span>{k}</span><span className={`tabular-nums ${cls}`}>{v}</span>
    </div>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-estrutura/60 sm:p-4" onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-labelledby="caixa-titulo" onClick={e => e.stopPropagation()}
        className="bg-white w-full sm:max-w-xl max-h-[92%] flex flex-col rounded-t-banner sm:rounded-banner shadow-soft overflow-hidden">

        <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-line shrink-0">
          <div className="min-w-0">
            <h2 id="caixa-titulo" className="display text-xl leading-tight">Caixa #01</h2>
            <p className="text-[13px] text-ink-soft truncate">
              {sessao.aberto ? `Aberto às ${sessao.abertura} por ${sessao.operador} · ${hoje}` : sessao.fechamento ? `Fechado às ${sessao.fechamento} · ${hoje}` : `Nenhum caixa aberto · ${hoje}`}
            </p>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full ${sessao.aberto ? 'bg-ok/10 text-ok' : 'bg-fundo text-ink-soft'}`}>
              {sessao.aberto ? 'ABERTO' : 'FECHADO'}
            </span>
            <button onClick={onClose} aria-label="Fechar painel do caixa" className="p-1 text-ink-soft hover:text-estrutura"><Icon n="x" className="w-6 h-6" /></button>
          </div>
        </div>

        <div className="overflow-y-auto p-5 space-y-5">
          {sessao.aberto ? (<>
            {/* Resumo do dia */}
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              {[
                ['Valor de abertura', brl(sessao.fundo)],
                [`Vendas (${r.qtd})`, brl(r.vendas)],
                ['Em dinheiro na gaveta', brl(r.gaveta)],
              ].map(([k, v], i) => (
                <div key={k} className={`p-3 rounded-card border ${i === 2 ? 'border-acao-600 bg-acao-100 col-span-2 sm:col-span-1' : 'border-line'}`}>
                  <span className="label">{k}</span>
                  <span className="display text-lg tabular-nums">{v}</span>
                </div>
              ))}
            </div>

            <div className="flex gap-2" role="tablist">
              {[['mov', 'Movimentação'], ['fechar', 'Fechar caixa']].map(([id, l]) => (
                <button key={id} role="tab" aria-selected={tab === id} onClick={() => { setTab(id); setErro(''); }}
                  className={`px-4 py-2 rounded-full text-[13.5px] border ${tab === id
                    ? 'bg-estrutura border-estrutura text-white font-bold' : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>{l}</button>
              ))}
            </div>

            {tab === 'mov' && (<>
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Tipo de lançamento">
                  {[['sangria', 'Sangria', 'Retirada da gaveta', 'out'], ['suprimento', 'Suprimento', 'Entrada na gaveta', 'in']].map(([id, l, d, ic]) => (
                    <button key={id} role="radio" aria-checked={tipo === id} onClick={() => setTipo(id)}
                      className={`flex items-center gap-2.5 p-3 rounded-card border text-left ${tipo === id
                        ? 'bg-acao-100 border-acao-600' : 'bg-white border-line hover:border-estrutura'}`}>
                      <span className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center ${id === 'sangria' ? 'bg-bad/10 text-bad' : 'bg-ok/10 text-ok'}`}><Icon n={ic} /></span>
                      <span className="min-w-0">
                        <span className={`block text-sm font-bold ${tipo === id ? 'text-acao-700' : 'text-estrutura'}`}>{l}</span>
                        <span className="block text-xs text-ink-soft">{d}</span>
                      </span>
                    </button>
                  ))}
                </div>
                <div className="grid grid-cols-[120px_1fr] gap-2">
                  <div>
                    <label htmlFor="mov-valor" className="label mb-1">Valor (R$)</label>
                    <input id="mov-valor" type="number" min="0" step="0.01" value={valor} onChange={e => setValor(e.target.value)} placeholder="0,00"
                      className="w-full px-3.5 py-2.5 border border-line rounded-full text-sm tabular-nums" />
                  </div>
                  <div>
                    <label htmlFor="mov-motivo" className="label mb-1">Motivo</label>
                    <input id="mov-motivo" type="text" value={motivo} onChange={e => setMotivo(e.target.value)}
                      placeholder={tipo === 'sangria' ? 'Ex: depósito no cofre' : 'Ex: troco em moedas'}
                      className="w-full px-3.5 py-2.5 border border-line rounded-full text-sm" />
                  </div>
                </div>
                {erro && <p className="text-[13px] text-bad font-semibold">{erro}</p>}
                <button onClick={lancar} className="w-full py-3 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao">
                  Lançar {tipo === 'sangria' ? 'sangria' : 'suprimento'}
                </button>
              </div>

              <div>
                <span className="label mb-2">Movimentos do dia</span>
                <div className="border border-line rounded-card divide-y divide-fundo">
                  {sessao.movs.length === 0 && <p className="p-3 text-sm text-ink-soft">Nenhum lançamento ainda.</p>}
                  {[...sessao.movs].reverse().map((m, i) => (
                    <div key={i} className="flex items-center gap-3 px-3 py-2.5 text-sm">
                      <span className="text-xs text-ink-soft tabular-nums w-10 shrink-0">{m.hora}</span>
                      <span className="flex-1 min-w-0">
                        <span className="block font-semibold text-ink">{m.tipo === 'sangria' ? 'Sangria' : 'Suprimento'}</span>
                        <span className="block text-xs text-ink-soft truncate">{m.motivo}</span>
                      </span>
                      <span className={`font-bold tabular-nums ${m.tipo === 'sangria' ? 'text-bad' : 'text-ok'}`}>
                        {m.tipo === 'sangria' ? '−' : '+'} {brl(m.valor)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </>)}

            {tab === 'fechar' && (
              <div className="space-y-4">
                <div className="border border-line rounded-card px-4 py-2 divide-y divide-fundo">
                  <div>
                    <Linha k="Vendas no PIX" v={brl(r.pix)} />
                    <Linha k="Vendas no cartão" v={brl(r.card)} />
                    <Linha k="Vendas em dinheiro" v={brl(r.cash)} />
                  </div>
                  <div>
                    <Linha k="Valor de abertura" v={brl(sessao.fundo)} />
                    <Linha k="Suprimentos" v={`+ ${brl(r.sup)}`} cls="text-ok" />
                    <Linha k="Sangrias" v={`− ${brl(r.san)}`} cls="text-bad" />
                  </div>
                  <Linha k="Dinheiro esperado na gaveta" v={brl(r.gaveta)} strong />
                </div>
                <div>
                  <label htmlFor="contado" className="label mb-1">Dinheiro contado na gaveta (R$)</label>
                  <input id="contado" type="number" min="0" step="0.01" value={contado} onChange={e => setContado(e.target.value)} placeholder="0,00"
                    className="w-full px-4 py-2.5 border border-line rounded-full text-sm tabular-nums" />
                  {diff !== null && (
                    <p className={`mt-2 text-sm font-bold ${Math.abs(diff) < 0.005 ? 'text-ok' : diff > 0 ? 'text-warn' : 'text-bad'}`}>
                      {Math.abs(diff) < 0.005 ? 'Caixa confere.' : diff > 0 ? `Sobra de ${brl(diff)}` : `Falta de ${brl(-diff)}`}
                    </p>
                  )}
                </div>
                {erro && <p className="text-[13px] text-bad font-semibold">{erro}</p>}
                <button onClick={fechar} className="w-full py-3 bg-estrutura hover:bg-estrutura-light text-white font-bold rounded-full flex items-center justify-center gap-2">
                  <Icon n="lock" />Fechar caixa de {sessao.operador}
                </button>
                <p className="text-xs text-ink-soft text-center">Depois de fechar, o próximo operador abre o caixa com o próprio usuário.</p>
              </div>
            )}
          </>) : (
            /* Caixa fechado: resumo do turno anterior + abertura */
            <div className="space-y-5">
              {sessao.fechamento && <div className="border border-line rounded-card px-4 py-2">
                <span className="label pt-1.5">Último turno · {sessao.operador}</span>
                <Linha k={`Vendas (${r.qtd})`} v={brl(r.vendas)} />
                <Linha k="Dinheiro esperado" v={brl(r.gaveta)} />
                <Linha k="Dinheiro contado" v={brl(sessao.contado)} />
                <Linha k="Diferença" strong
                  v={Math.abs(sessao.diferenca) < 0.005 ? 'Confere' : `${sessao.diferenca > 0 ? 'Sobra' : 'Falta'} ${brl(Math.abs(sessao.diferenca))}`}
                  cls={Math.abs(sessao.diferenca) < 0.005 ? 'text-ok' : sessao.diferenca > 0 ? 'text-warn' : 'text-bad'} />
              </div>}
              <div className="space-y-3">
                <h3 className="display text-base">Abrir caixa</h3>
                <div>
                  <span className="label mb-1.5">Operador</span>
                  <div className="flex flex-wrap gap-2" role="radiogroup" aria-label="Operador">
                    {OPERADORES.map(o => (
                      <button key={o} role="radio" aria-checked={novoOp === o} onClick={() => setNovoOp(o)}
                        className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-[13.5px] border ${novoOp === o
                          ? 'bg-acao-100 border-acao-600 text-acao-700 font-bold' : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>
                        <Icon n="user" className="w-3.5 h-3.5" />{o}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label htmlFor="fundo" className="label mb-1">Valor de abertura (R$)</label>
                  <input id="fundo" type="number" min="0" step="0.01" value={fundo} onChange={e => setFundo(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && abrir()} placeholder="0,00" autoFocus
                    className="w-full px-4 py-3 border-[1.5px] border-acao-600 rounded-full text-lg font-bold text-estrutura tabular-nums" />
                  <p className="text-xs text-ink-soft mt-1.5 px-1">Dinheiro que fica na gaveta para troco no início do turno.</p>
                </div>
                {erro && <p className="text-[13px] text-bad font-semibold">{erro}</p>}
                <button onClick={abrir} className="w-full py-3 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-2">
                  <Icon n="unlock" />Abrir caixa como {novoOp}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function hidratarVenda(v, base = Date.now()) {
  const itens = v.itens.map(linhaItem), subtotal = somaItens(itens);
  return { ...v, itens, subtotal, total: +(subtotal - v.desconto).toFixed(2), hora: base - v.min * 60000 };
}
function hidratarEntrega(e, vendas, base = Date.now()) {
  const venda = e.nota ? vendas.find(v => v.numero === e.nota) : null;
  const itens = venda ? venda.itens : e.itens.map(linhaItem);
  const valorItens = venda ? venda.total : somaItens(itens);
  const taxa = taxaBairro(e.endereco.bairro), total = +(valorItens + taxa).toFixed(2);
  return { ...e, itens, valorItens, taxa, total, cobrarTipo: e.cobrar, cobrar: e.cobrar === 'total' ? total : e.cobrar === 'taxa' ? taxa : 0,

    eventos: e.eventos.map(([m, texto]) => ({ quando: base - m * 60000, texto })).reverse() };
}

/* Balcão → delivery: endereço, bairro (taxa) e como a taxa é cobrada */
function EnviarDelivery({ v, caixaAberto, cancelar, confirmar }) {
  const [f, setF] = useState({ nome: '', fone: '', rua: '', bairro: '', compl: '', ref: '', taxa: 'entrega', forma: 'cash', trocoPara: '' });
  const [erro, setErro] = useState('');
  const up = p => { setF(x => ({ ...x, ...p })); setErro(''); };
  const taxa = f.taxa === 'gratis' ? 0 : taxaBairro(f.bairro);
  const cobrar = f.taxa === 'entrega' ? taxa : 0;
  const ok = () => {
    if (!f.nome.trim()) return setErro('Informe o nome de quem recebe.');
    if (f.fone.replace(/\D/g, '').length < 10) return setErro('Informe o telefone com DDD para o entregador falar com o cliente.');
    if (!f.rua.trim()) return setErro('Informe a rua e o número.');
    if (!f.bairro) return setErro('Escolha o bairro: ele define a taxa de entrega.');
    if (f.taxa === 'agora' && !caixaAberto) return setErro('Abra o caixa para receber a taxa agora, ou cobre na entrega.');
    if (f.taxa === 'entrega' && f.forma === 'cash' && f.trocoPara !== '' && Number(f.trocoPara) < cobrar) return setErro(`Troco para precisa ser maior ou igual a ${brl(cobrar)}.`);
    confirmar({ ...f, taxaValor: taxa, cobrar });
  };
  return (
    <div className="fixed inset-0 z-[55] bg-estrutura/60 flex items-end sm:items-center justify-center sm:p-4" onClick={cancelar}>
      <div role="dialog" aria-modal="true" aria-labelledby="env-titulo" onClick={e => e.stopPropagation()}
        onKeyDown={e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); ok(); } }}
        className="bg-white w-full sm:max-w-lg max-h-[94%] overflow-y-auto rounded-t-banner sm:rounded-banner shadow-soft p-5 space-y-4">
        <div>
          <h2 id="env-titulo" className="display text-xl leading-tight">Enviar por delivery</h2>
          <p className="text-[13px] text-ink-soft tabular-nums">NFC-e {v.numero} · {qtdItens(v.itens)} {qtdItens(v.itens) === 1 ? 'item' : 'itens'} · {brl(v.total)} pago no {FORMA_NOME[v.forma]} · {hhmm(v.hora)}</p>
          {temAdulto(v.itens) && <p className="mt-1"><AvisoAdulto /></p>}
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Campo id="env-nome" label="Quem recebe" className="col-span-2">
            <input id="env-nome" autoFocus autoComplete="off" className={inputCls} value={f.nome} onChange={e => up({ nome: e.target.value })} placeholder="Nome do cliente" />
          </Campo>
          <Campo id="env-fone" label="Telefone / WhatsApp">
            <input id="env-fone" inputMode="tel" autoComplete="off" className={`${inputCls} tabular-nums`} value={f.fone} onChange={e => up({ fone: mascaraFone(e.target.value) })} placeholder="(11) 90000-0000" />
          </Campo>
          <Campo id="env-bairro" label="Bairro (taxa)">
            <select id="env-bairro" className={inputCls} value={f.bairro} onChange={e => up({ bairro: e.target.value })}>
              <option value="">Escolha</option>
              {BAIRROS.map(b => <option key={b.nome} value={b.nome}>{b.nome} · {brl(b.taxa)}</option>)}
            </select>
          </Campo>
          <Campo id="env-rua" label="Rua e número" className="col-span-2">
            <input id="env-rua" autoComplete="off" className={inputCls} value={f.rua} onChange={e => up({ rua: e.target.value })} placeholder="Rua, número" />
          </Campo>
          <Campo id="env-compl" label="Complemento">
            <input id="env-compl" autoComplete="off" className={inputCls} value={f.compl} onChange={e => up({ compl: e.target.value })} placeholder="Apto, bloco, casa" />
          </Campo>
          <Campo id="env-ref" label="Referência">
            <input id="env-ref" autoComplete="off" className={inputCls} value={f.ref} onChange={e => up({ ref: e.target.value })} placeholder="Perto de..." />
          </Campo>

/* ================= PRECIFICAÇÃO · FICHA TÉCNICA (COPÃO) E FRACIONAMENTO =================
   Ficha técnica: custo na receita = preço de compra ÷ tamanho da embalagem × quantidade usada; CMV = soma dos insumos;
   preço sugerido = CMV × markup. Fracionamento: custo unitário = custo da embalagem ÷ unidades; preço = custo × (1 + margem).
   Produto fumígeno não pode ser fracionado: venda só na embalagem original lacrada (Lei 9.294/1996 e ANVISA). */
const num = v => { const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const arred = (v, passo) => passo > 0 ? Math.ceil(v / passo - 1e-9) * passo : v;
const pct = v => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';

  const sugerido = cmv * num(f?.markup), redondo = passoF > 0 ? Math.max(passoF, Math.round(sugerido / passoF) * passoF) : sugerido;   // múltiplo mais próximo

  // fracionamento

          {lista.map(p => { const n = cart.find(i => i.id === p.id)?.quantity; return (
            <li key={p.id} className="bg-white border border-line rounded-card p-2.5 flex items-center gap-2">
              {p.img ? <img src={p.img} alt="" loading="lazy" className="w-12 h-12 rounded-panel object-cover shrink-0 bg-acao-100" />

              <span className="min-w-0 flex-1">
                <span className="block text-[12.5px] font-semibold text-ink leading-tight">{p.name}</span>

              </span>
              {n ? (
                <span className="flex items-center gap-1 border border-line rounded-full p-0.5 shrink-0">
                  <button onClick={() => qty(p.id, -1)} aria-label="Menos" className="w-7 h-7 rounded-full flex items-center justify-center text-ink-soft"><Icon n="minus" className="w-3.5 h-3.5" /></button>
                  <span className="w-5 text-center text-[12px] font-bold text-estrutura tabular-nums">{n}</span>
                  <button onClick={() => add(p)} aria-label="Mais" className="w-7 h-7 rounded-full flex items-center justify-center text-ink-soft"><Icon n="plus" className="w-3.5 h-3.5" /></button>
                </span>
              ) : <button onClick={() => add(p)} aria-label={`Adicionar ${p.name}`} className="w-9 h-9 rounded-full bg-acao-600 text-white flex items-center justify-center shrink-0"><Icon n="plus" /></button>}
            </li>); })}
          {!lista.length && <li className="p-6 text-center text-[12px] text-ink-soft">Nada encontrado</li>}
        </ul>
        {cart.length > 0 && (
          <button onClick={() => setTela('carrinho')} className="m-3 mt-0 px-4 py-3 bg-acao-600 text-white font-bold rounded-full shadow-acao flex items-center justify-between text-[13.5px] shrink-0">
            <span className="flex items-center gap-2"><Icon n="cart" />{qtdItens(cart)} {qtdItens(cart) === 1 ? 'item' : 'itens'}</span><span className="tabular-nums">{brl(itensVal)} →</span>
          </button>
        )}
      </>)}

      {tela === 'carrinho' && (
        <div className="flex-1 overflow-y-auto p-3 space-y-3" onKeyDown={e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); pedir(); } }}>
          <button onClick={() => setTela('loja')} className="text-[12.5px] font-bold text-estrutura">← Continuar comprando</button>
          <div className="bg-white border border-line rounded-card p-3 space-y-1.5">
            {cart.map(i => <div key={i.id} className="flex justify-between gap-2 text-[12.5px]"><span className="min-w-0">{i.quantity}× {i.name}</span><span className="tabular-nums shrink-0">{brl(i.price * i.quantity)}</span></div>)}
          </div>
          <div className="bg-white border border-line rounded-card p-3 space-y-2">
            <div className="flex items-center justify-between"><span className="label">Entregar em</span><button onClick={exemplo} className="text-[11.5px] font-bold text-acao-700">Usar endereço de exemplo</button></div>
            <input aria-label="Seu nome" className={`${inputCls} !py-2 !text-[13px]`} value={f.nome} onChange={e => up({ nome: e.target.value })} placeholder="Seu nome" />
            <input aria-label="Telefone" inputMode="tel" className={`${inputCls} !py-2 !text-[13px] tabular-nums`} value={f.fone} onChange={e => up({ fone: mascaraFone(e.target.value) })} placeholder="Telefone com DDD" />
            <select aria-label="Bairro" className={`${inputCls} !py-2 !text-[13px]`} value={f.bairro} onChange={e => up({ bairro: e.target.value })}>
              <option value="">Bairro</option>{BAIRROS.map(b => <option key={b.nome} value={b.nome}>{b.nome} · entrega {brl(b.taxa)}</option>)}
            </select>
            <input aria-label="Rua e número" className={`${inputCls} !py-2 !text-[13px]`} value={f.rua} onChange={e => up({ rua: e.target.value })} placeholder="Rua e número" />
            <input aria-label="Complemento" className={`${inputCls} !py-2 !text-[13px]`} value={f.compl} onChange={e => up({ compl: e.target.value })} placeholder="Complemento (opcional)" />
          </div>
          <div className="bg-white border border-line rounded-card p-3 space-y-2">
            <span className="label">Pagamento</span>
            <Pills rotulo="Pagamento no app" valor={f.pag} set={k => up({ pag: k })} opcoes={[['pix', 'PIX no app'], ['card', 'Cartão no app'], ['cash', 'Dinheiro na entrega']]} />
            {f.pag === 'cash' && <input aria-label="Troco para" type="number" min="0" step="0.01" className={`${inputCls} !py-2 !text-[13px]`} value={f.troco} onChange={e => up({ troco: e.target.value })} placeholder="Troco para quanto? (opcional)" />}
            {adulto && (
              <label className="flex items-start gap-2 text-[12px] text-ink pt-1">
                <input type="checkbox" checked={f.maior} onChange={e => up({ maior: e.target.checked })} className="mt-0.5 accent-[var(--acao-600)]" />
                <span>Tenho 18 anos ou mais e vou mostrar um documento na entrega.</span>
              </label>
            )}
          </div>
          <div className="bg-white border border-line rounded-card p-3 text-[13px] tabular-nums space-y-1">
            <div className="flex justify-between text-ink-soft"><span>Itens</span><span>{brl(itensVal)}</span></div>
            <div className="flex justify-between text-ink-soft"><span>Entrega</span><span>{f.bairro ? brl(taxa) : '—'}</span></div>
            <div className="flex justify-between font-bold text-estrutura"><span>Total</span><span>{brl(total)}</span></div>
          </div>
          {erro && <p className="text-[12px] text-bad font-semibold">{erro}</p>}
          <button onClick={pedir} className="w-full py-3 bg-acao-600 text-white font-bold rounded-full shadow-acao">Fazer pedido · {brl(total)}</button>
        </div>
      )}

      {tela === 'acompanhar' && ped && (
        <div className="flex-1 overflow-y-auto p-3 space-y-3">
          <div className="bg-white border border-line rounded-card p-3">
            <p className="label">Pedido {ped.pedidoApp}</p>
            <p className="display text-lg leading-tight mt-0.5">{{ falhou: 'Não conseguimos entregar', cancelado: 'A loja recusou o pedido' }[ped.status] || PASSOS_APP[Math.max(0, passo)][1]}</p>
            <p className="text-[12px] text-ink-soft mt-0.5">{ped.status === 'entregue' ? `Entregue às ${hhmm(ped.fim)}` : FINAL.includes(ped.status) ? (ped.motivo || '') : `Chega até ${hhmm(ped.criado + SLA_MIN * 60000)}`}</p>
            <ol className="mt-3 space-y-2.5">
              {PASSOS_APP.map(([k, l], i) => (
                <li key={k} className="flex items-center gap-2.5 text-[12.5px]">
                  <span className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${i <= passo ? 'bg-ok text-white' : 'bg-fundo text-ink-soft'}`}>{i <= passo ? <Icon n="check" className="w-3.5 h-3.5" /> : i + 1}</span>
                  <span className={i <= passo ? 'font-bold text-ink' : 'text-ink-soft'}>{l}{k === 'rota' && i <= passo && ped.entregador ? ` · ${ped.entregador}` : ''}</span>
                </li>
              ))}
            </ol>
          </div>
          <div className="bg-white border border-line rounded-card p-3 text-[12.5px] space-y-1">
            <p className="font-semibold">{ped.endereco.rua} · {ped.endereco.bairro}</p>
            <p className="text-ink-soft tabular-nums">{qtdItens(ped.itens)} itens · {brl(ped.total)} · {ped.cobrar > 0 ? `pagar na entrega (${FORMA_NOME[ped.forma]})` : `pago no app (${FORMA_NOME[ped.forma]})`}</p>
          </div>
          <p className="text-[11.5px] text-ink-soft text-center">Mova o pedido no painel ao lado (aba App) e veja este status mudar.</p>
          <button onClick={() => { setTela('loja'); setPedidoId(null); }} className="w-full py-2.5 bg-white border-[1.5px] border-line text-estrutura font-bold rounded-full text-[13px]">Fazer outro pedido</button>
        </div>
      )}
    </div>
  );
}

function VendasModal({ vendasDia, setVendasDia, entregas, setEntregas, agoraMs, sessao, setSessao, onClose, notify, novoId, novoPedidoApp }) {
  const [aba, setAba] = useState('balcao');
  const [busca, setBusca] = useState('');
  const [aberto, setAberto] = useState(null);
  const [escolha, setEscolha] = useState({});
  const [falha, setFalha] = useState(null);
  const [enviando, setEnviando] = useState(null);   // venda de balcão sendo transformada em delivery
  const [romaneio, setRomaneio] = useState(null);
  const [app, setApp] = useState(false);
  // Esc fecha primeiro o que está por cima (formulário, romaneio, app)
  useEffect(() => {
    const h = e => { if (e.key === 'Escape' && (enviando || romaneio || app)) { e.stopPropagation(); if (enviando) setEnviando(null); else if (romaneio) setRomaneio(null); else setApp(false); } };
    window.addEventListener('keydown', h, true); return () => window.removeEventListener('keydown', h, true);
  });

  const balcao = vendasDia.filter(v => v.tipo === 'balcao').sort((a, b) => b.hora - a.hora);
  const loja = entregas.filter(d => d.origem === 'loja'), doApp = entregas.filter(d => d.origem === 'app');
  const ativos = entregas.filter(d => !FINAL.includes(d.status));
  const atrasados = ativos.filter(d => minutos(d.criado, agoraMs) > SLA_MIN);
  const naRua = entregas.filter(d => d.status === 'rota').reduce((a, d) => a + d.cobrar, 0);
  const t = busca.trim().toLowerCase();
  const balcaoF = balcao.filter(v => !t || v.numero.includes(t) || (v.cpf || '').includes(t) || v.itens.some(i => i.name.toLowerCase().includes(t)));

  const mover = (d, status, texto, extra = {}) => {
    const tm = Date.now();
    setEntregas(l => l.map(x => x.id !== d.id ? x : { ...x, ...extra, status, fim: FINAL.includes(status) ? tm : null, eventos: [{ quando: tm, texto }, ...x.eventos] }));
    setFalha(null);
  };
  // Acerto do entregador: o que foi cobrado na entrega entra no caixa quando ele confirma a entrega
  const acertar = d => {
    if (!d.cobrar) return '';
    if (!sessao.aberto) return ' · abra o caixa para lançar o recebimento';
    setSessao(s => ({ ...s, vendas: [...s.vendas, { hora: agora(), total: d.cobrar, metodo: d.forma, delivery: d.id, taxa: d.cobrarTipo === 'taxa' }] }));
    return ` · ${brl(d.cobrar)} lançado no caixa`;
  };
  const enviar = (v, f) => {
    const id = novoId(), tm = Date.now();
    const ent = { id, origem: 'loja', nota: v.numero, pedidoApp: null, quem: 'propria',
      cliente: { nome: f.nome.trim(), fone: f.fone }, endereco: { rua: f.rua.trim(), bairro: f.bairro, compl: f.compl.trim(), ref: f.ref.trim() },
      itens: v.itens, valorItens: v.total, taxa: f.taxaValor, total: +(v.total + f.taxaValor).toFixed(2),
      cobrarTipo: f.cobrar > 0 ? 'taxa' : '', cobrar: f.cobrar, forma: f.forma, trocoPara: f.taxa === 'entrega' && f.forma === 'cash' && f.trocoPara !== '' ? Number(f.trocoPara) : 0,
      pagoDesc: `Venda paga no caixa · ${FORMA_NOME[v.forma]}${f.taxaValor === 0 ? ' · entrega grátis' : f.taxa === 'agora' ? ` · taxa paga no caixa (${FORMA_NOME[f.forma]})` : ''}`,
      status: 'novo', criado: tm, fim: null, entregador: '', codigo: '', motivo: '',
      eventos: [{ quando: tm, texto: `Venda NFC-e ${v.numero} enviada por delivery · ${sessao.operador || 'operador'}` }] };
    setEntregas(l => [...l, ent]);
    setVendasDia(l => l.map(x => x.numero === v.numero ? { ...x, tipo: 'delivery', entregaId: id } : x));
    if (f.taxa === 'agora' && f.taxaValor > 0) setSessao(s => ({ ...s, vendas: [...s.vendas, { hora: agora(), total: f.taxaValor, metodo: f.forma, delivery: id, taxa: true }] }));
    setEnviando(null); setAba('delivery'); setRomaneio(id);
    notify(`NFC-e ${v.numero} virou o delivery ${id}`);
  };
  const fazerPedido = (f, cart) => {
    const { id, ped, n } = novoPedidoApp(), tm = Date.now();
    const itens = cart.map(i => ({ ...i })), valorItens = somaItens(itens), taxa = taxaBairro(f.bairro), total = +(valorItens + taxa).toFixed(2);
    const naEntrega = f.pag === 'cash', quem = naEntrega || n % 2 === 0 ? 'propria' : 'plataforma';
    setEntregas(l => [...l, { id, origem: 'app', pedidoApp: ped, nota: '', quem, cliente: { nome: f.nome.trim(), fone: f.fone },
      endereco: { rua: f.rua.trim(), bairro: f.bairro, compl: f.compl.trim(), ref: f.ref.trim() }, itens, valorItens, taxa, total,
      cobrarTipo: naEntrega ? 'total' : '', cobrar: naEntrega ? total : 0, forma: f.pag, trocoPara: naEntrega && f.troco !== '' ? Number(f.troco) : 0,
      pagoDesc: naEntrega ? '' : `Pago no app · ${FORMA_NOME[f.pag]}`, status: 'novo', criado: tm, fim: null, entregador: '',
      codigo: quem === 'plataforma' ? 'PLT-' + (480000 + n * 37) : '', motivo: '',
      eventos: [{ quando: tm, texto: `Pedido ${ped} recebido do app${naEntrega ? ' · pagar na entrega' : ' · pago online'}` }] }]);
    setAba('app');
    notify(`Novo pedido do app ${ped} (${id})`);
    return id;
  };

  const Botao = ({ onClick, children, sec, perigo }) => (
    <button onClick={e => { e.stopPropagation(); onClick(); }}
      className={`${perigo ? 'flex-none' : 'flex-1 min-w-0'} py-2 px-3 rounded-full text-[12.5px] font-bold flex items-center justify-center gap-1.5 whitespace-nowrap ${perigo
        ? 'bg-white border-[1.5px] border-bad/40 text-bad hover:border-bad' : sec
        ? 'bg-white border-[1.5px] border-line text-estrutura hover:border-estrutura' : 'bg-acao-600 hover:bg-acao-700 text-white shadow-acao'}`}>{children}</button>
  );
  const acoes = d => {
    const plat = d.quem === 'plataforma';
    if (d.status === 'novo') return <>
      <Botao onClick={() => { mover(d, 'preparo', 'Pedido aceito. Separação iniciada'); notify(`${d.id} aceito: separe os itens`); }}>Aceitar</Botao>
      <Botao perigo onClick={() => { mover(d, 'cancelado', 'Pedido recusado pela loja', { motivo: 'Recusado pela loja' }); notify(`${d.id} recusado`); }}>Recusar</Botao>
    </>;
    if (d.status === 'preparo') return <Botao onClick={() => { mover(d, 'pronto', plat ? 'Embalado. Aguardando coleta da plataforma' : 'Embalado. Aguardando entregador'); notify(`${d.id} pronto para sair`); }}>Pronto para sair</Botao>;
    if (d.status === 'pronto') return plat
      ? <Botao onClick={() => { mover(d, 'rota', `Coletado pela plataforma · código ${d.codigo}`, { entregador: 'Plataforma de entrega' }); notify(`${d.id} coletado pela plataforma`); }}>Coletado pela plataforma</Botao>
      : <div className="flex-1 flex gap-2 min-w-0" onClick={e => e.stopPropagation()}>
          <select aria-label={`Entregador do ${d.id}`} value={escolha[d.id] || ENTREGADORES[0]} onChange={e => setEscolha(s => ({ ...s, [d.id]: e.target.value }))}
            className="min-w-0 flex-1 px-3 py-2 bg-white border border-line rounded-full text-[12.5px] text-ink">{ENTREGADORES.map(x => <option key={x}>{x}</option>)}</select>
          <Botao onClick={() => { const en = escolha[d.id] || ENTREGADORES[0]; mover(d, 'rota', `Saiu para entrega com ${en}`, { entregador: en }); notify(`${d.id} saiu com ${en}`); }}><Icon n="truck" />Saiu</Botao>
        </div>;
    if (d.status === 'rota') {
      if (plat) return <Botao sec onClick={() => { mover(d, 'entregue', 'Plataforma confirmou a entrega'); notify(`${d.id} entregue`); }}>Confirmar entrega</Botao>;
      if (falha === d.id) return (
        <div className="flex-1 flex flex-wrap gap-1.5" onClick={e => e.stopPropagation()}>
          {MOTIVOS_FALHA.map(m => <button key={m} onClick={() => { mover(d, 'falhou', `Não entregue: ${m}`, { motivo: m }); notify(`${d.id}: ${m.toLowerCase()}`); }}
            className="px-2.5 py-1 rounded-full border border-bad/40 text-bad text-[11.5px] font-bold hover:border-bad">{m}</button>)}
          <button onClick={() => setFalha(null)} className="px-2.5 py-1 text-[11.5px] text-ink-soft font-semibold hover:text-estrutura">Voltar</button>
        </div>);
      return <>
        <Botao onClick={() => { const r = acertar(d); mover(d, 'entregue', `Entregue por ${d.entregador}`); notify(`${d.id} entregue${r}`); }}><Icon n="check" />Entregue</Botao>
        <Botao perigo onClick={() => setFalha(d.id)}>Não entregue</Botao>
      </>;
    }
    if (d.status === 'falhou') return <Botao sec onClick={() => { mover(d, 'pronto', 'Voltou para a fila: nova tentativa de entrega', { motivo: '' }); notify(`${d.id} voltou para Prontos`); }}>Tentar de novo</Botao>;
    return null;
  };

  const card = d => {
    const fimCol = colunaDe(d) === 'fim';
    const min = minutos(d.criado, d.fim || agoraMs);
    const tarde = !fimCol && min > SLA_MIN, quase = !fimCol && !tarde && min > SLA_MIN - 10;
    const exp = aberto === d.id, bt = acoes(d);
    return (
      <li key={d.id} className={`bg-white border rounded-card shadow-card ${tarde ? 'border-bad' : 'border-line'}`}>
        <button onClick={() => setAberto(exp ? null : d.id)} aria-expanded={exp} className="w-full text-left p-3 space-y-1.5">
          <span className="flex items-center justify-between gap-2">
            <span className="font-display font-bold text-estrutura text-[15px] tabular-nums whitespace-nowrap">{d.id}</span>
            <span className={`${CHIP} !text-[11px] tabular-nums ${fimCol
              ? (d.status === 'entregue' ? 'bg-ok text-white' : d.status === 'falhou' ? 'bg-bad text-white' : 'bg-fundo text-ink-soft')
              : tarde ? 'bg-bad text-white' : quase ? 'bg-warn text-white' : 'bg-fundo text-ink'}`}>
              <Icon n="clock" className="w-3 h-3" />{fimCol ? `${{ entregue: 'Entregue', falhou: 'Não entregue', cancelado: 'Recusado' }[d.status]} · ${min} min` : `${min} min${tarde ? ' · atrasado' : ''}`}
            </span>
          </span>
          <span className="flex flex-wrap gap-1">
            {d.origem === 'app'
              ? <span className={`${CHIP} bg-acao-100 text-acao-700`}><Icon n={d.canal === 'site' ? 'globe' : 'phone'} className="w-3 h-3" />{d.canal === 'site' ? 'Site' : 'App'} {d.pedidoApp}</span>
              : <span className={`${CHIP} bg-acao-100 text-acao-700`}><Icon n="store" className="w-3 h-3" />NFC-e {d.nota}</span>}
            <span className={`${CHIP} bg-estrutura/10 text-estrutura`}>{d.quem === 'plataforma' ? 'Plataforma' : 'Entregador da loja'}</span>
            {temAdulto(d.itens) && <AvisoAdulto />}
            {d.retirar && <span className={`${CHIP} bg-ok/10 text-ok`}>Retirada na loja</span>}
          </span>
          <span className="block text-sm font-semibold text-ink truncate">{d.cliente.nome}</span>
          <span className="flex items-center gap-1 text-[12px] text-ink-soft min-w-0">
            <Icon n="pin" className="w-3 h-3 shrink-0" /><span className="truncate">{d.endereco.bairro} · {qtdItens(d.itens)} {qtdItens(d.itens) === 1 ? 'item' : 'itens'}</span>
            <strong className="ml-auto text-estrutura tabular-nums shrink-0">{brl(d.total)}</strong>
          </span>
          {d.pagoDesc && <span className="block text-[11.5px] font-semibold text-ok">{d.pagoDesc}</span>}
          {d.cobrar > 0 && <span className="block text-[11.5px] font-semibold text-warn">{cobrarTexto(d)}</span>}
          {d.status === 'rota' && <span className="block text-[11.5px] text-ink-soft">Com <strong className="text-estrutura">{d.entregador}</strong> desde {hhmm(d.eventos[0].quando)}</span>}
          {fimCol && d.motivo && <span className="block text-[11.5px] text-bad font-semibold">{d.motivo}</span>}
        </button>
        {exp && (
          <div className="mx-3 mb-3 pt-2 border-t border-fundo space-y-2 text-[12px]">
            <p className="flex items-center gap-1.5"><Icon n="phone" className="w-3.5 h-3.5 text-estrutura shrink-0" /><span className="tabular-nums select-all">{d.cliente.fone}</span></p>
            <p className="flex gap-1.5"><Icon n="pin" className="w-3.5 h-3.5 text-estrutura shrink-0 mt-0.5" />
              <span>{d.endereco.rua} · {d.endereco.bairro}{d.endereco.compl && ` · ${d.endereco.compl}`}{d.endereco.ref && <span className="block text-ink-soft">Ref.: {d.endereco.ref}</span>}</span></p>
            {d.codigo && <p className="text-ink-soft">Código de coleta da plataforma: <strong className="text-estrutura tabular-nums select-all">{d.codigo}</strong></p>}

  const ABAS = [
    ['balcao', 'Balcão', 'store', balcao.length],
    ['delivery', 'Delivery', 'truck', loja.filter(d => !FINAL.includes(d.status)).length],

  const romD = romaneio && entregas.find(d => d.id === romaneio);
  return (<>
    <div className="fixed inset-0 z-50 bg-estrutura/60 flex items-stretch sm:items-center justify-center sm:p-4" onClick={onClose}>

        className="bg-fundo w-full max-w-[1500px] h-full sm:h-[94%] flex flex-col sm:rounded-banner shadow-soft overflow-hidden">
        <div className="bg-white border-b border-line px-4 sm:px-5 py-3.5 flex flex-wrap items-center gap-x-4 gap-y-2 shrink-0">

            <p className="text-[12.5px] text-ink-soft">Escolha o tipo. Em Balcão, escolha a venda que vai virar delivery. Pedido do app já chega como entrega.</p>
