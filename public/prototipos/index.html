            <span className="px-3 py-1.5 rounded-full bg-fundo text-estrutura tabular-nums">{ativos.length} entregas em andamento</span>
            <span className={`px-3 py-1.5 rounded-full tabular-nums ${atrasados.length ? 'bg-bad text-white' : 'bg-fundo text-ink-soft'}`}>{atrasados.length} {atrasados.length === 1 ? 'atrasada' : 'atrasadas'}</span>
            <span className="px-3 py-1.5 rounded-full bg-fundo text-warn tabular-nums" title="Valores a cobrar dos pedidos em rota">A receber na rua: {brl(naRua)}</span>
          </div>
          <button onClick={onClose} aria-label="Fechar" className="p-1 text-ink-soft hover:text-estrutura"><Icon n="x" className="w-6 h-6" /></button>
        </div>

        <div className="px-4 sm:px-5 py-2.5 flex flex-wrap items-center gap-2 shrink-0" role="tablist" aria-label="Tipo de venda">
          {ABAS.map(([k, l, ic, n]) => (
            <button key={k} role="tab" aria-selected={aba === k} onClick={() => setAba(k)}
              className={`px-4 py-2 rounded-full text-[13.5px] border flex items-center gap-1.5 ${aba === k ? 'bg-estrutura border-estrutura text-white font-bold' : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>
              <Icon n={ic} />{l}<span className={`text-[11px] font-bold px-1.5 rounded-full tabular-nums ${aba === k ? 'bg-white/20' : 'bg-fundo'}`}>{n}</span></button>
          ))}
          {aba === 'balcao' && (
            <div className="relative ml-auto w-full sm:w-72">
              <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-soft"><Icon n="search" /></span>
              <input aria-label="Buscar venda" value={busca} onChange={e => setBusca(e.target.value)} placeholder="NFC-e, CPF ou produto"
                className="w-full pl-10 pr-3 py-2 bg-white border border-line rounded-full text-[13px]" />
            </div>
          )}
          {aba === 'app' && (
            <button onClick={() => setApp(a => !a)} className={`ml-auto px-4 py-2 border-[1.5px] font-bold text-[13px] rounded-full flex items-center gap-1.5 ${app ? 'bg-estrutura border-estrutura text-white' : 'bg-white border-line hover:border-estrutura text-estrutura'}`}>
              <Icon n="phone" />{app ? 'Fechar app do cliente' : 'Abrir app do cliente (simulador)'}</button>
          )}
        </div>

        {aba === 'balcao' && (
          <div className="flex-1 min-h-0 overflow-y-auto px-4 sm:px-5 pb-4">
            <div className="bg-white border border-line rounded-card shadow-card overflow-hidden">
              <div className="hidden md:grid grid-cols-[64px_84px_1fr_120px_100px_190px] gap-3 px-4 py-2.5 border-b border-line bg-fundo/40">
                <span className="label">Hora</span><span className="label">NFC-e</span><span className="label">Itens</span><span className="label">Pagamento</span><span className="label text-right">Total</span><span />
              </div>
              <ul className="divide-y divide-fundo">
                {balcaoF.map(v => (
                  <li key={v.numero} className="grid grid-cols-[1fr_auto] md:grid-cols-[64px_84px_1fr_120px_100px_190px] gap-x-3 gap-y-1 items-center px-4 py-3">
                    <span className="hidden md:block text-[13px] text-ink-soft tabular-nums">{hhmm(v.hora)}</span>
                    <span className="hidden md:block text-[13px] font-bold text-estrutura tabular-nums">{v.numero}</span>
                    <span className="min-w-0">
                      <span className="md:hidden block text-[12px] text-ink-soft tabular-nums"><strong className="text-estrutura">NFC-e {v.numero}</strong> · {hhmm(v.hora)} · {FORMA_NOME[v.forma]}</span>
                      <span className="block text-[13px] text-ink truncate">{v.itens.map(i => `${i.quantity}× ${i.name}`).join(' · ')}</span>
                      <span className="block text-[11.5px] text-ink-soft">{v.operador}{v.cpf ? ` · CPF ${v.cpf}` : ''}{temAdulto(v.itens) ? ' · contém bebida alcoólica' : ''}</span>
                    </span>
                    <span className="hidden md:block text-[13px] text-ink-soft">{FORMA_NOME[v.forma]}</span>
                    <span className="text-right font-display font-bold text-estrutura tabular-nums">{brl(v.total)}</span>
                    <button onClick={() => setEnviando(v)} className="col-span-2 md:col-span-1 py-2 px-3 bg-acao-600 hover:bg-acao-700 text-white font-bold text-[12.5px] rounded-full shadow-acao flex items-center justify-center gap-1.5 whitespace-nowrap">
                      <Icon n="truck" />Enviar por delivery</button>
                  </li>
                ))}
                {!balcaoF.length && <li className="p-10 text-center text-sm text-ink-soft">{balcao.length ? 'Nenhuma venda com esse filtro.' : 'Nenhuma venda de balcão hoje.'}</li>}
              </ul>
            </div>
            <p className="text-[12px] text-ink-soft mt-2.5">Toda venda do caixa entra aqui como venda padrão (balcão). Ao enviar por delivery, ela sai desta lista e vai para a aba Delivery.</p>
          </div>
        )}

        {aba === 'delivery' && quadro(loja)}

        {aba === 'app' && (
          <div className="flex-1 min-h-0 flex gap-3 overflow-hidden">
            {quadro(doApp)}
            {app && (
              <div className="fixed inset-0 z-[56] bg-estrutura/60 flex items-center justify-center p-3 lg:static lg:z-auto lg:bg-transparent lg:p-0 lg:pr-5 lg:pb-4 lg:items-start">
                <AppCliente entregas={entregas} fazerPedido={fazerPedido} fechar={() => setApp(false)} />
              </div>
            )}
          </div>
        )}
      </div>
    </div>
    {enviando && <EnviarDelivery v={enviando} caixaAberto={sessao.aberto} cancelar={() => setEnviando(null)} confirmar={f => enviar(enviando, f)} />}
    {romD && <Romaneio d={romD} fechar={() => setRomaneio(null)} />}
  </>);
}

/* ---------- TELA PRINCIPAL ---------- */
// Busca aceita multiplicador: "3*7896002" ou "3*blusa" adiciona 3 unidades
function parseBusca(raw) {
  const m = raw.match(/^\s*(\d{1,3})\s*[*xX]\s*(.*)$/);
  return m ? { mult: Math.max(1, Number(m[1])), termo: m[2].trim() } : { mult: 1, termo: raw.trim() };
}

function PDVScreen() {
  const [search, setSearch] = useState('');
  const [hl, setHl] = useState(0);
  const [lastId, setLastId] = useState(null);
  const [cart, setCart] = useState([]);
  const [discount, setDiscount] = useState(0);
  const [pay, setPay] = useState('pix');
  const [drawer, setDrawer] = useState(false);
  const [toast, setToast] = useState(null);
  const [sessao, setSessao] = useState(SESSAO_INICIAL);
  const [caixaOpen, setCaixaOpen] = useState(true);
  const [cpf, setCpf] = useState('');
  const [etapa, setEtapa] = useState(null);          // F12 abre 'cpf' (venda padrão)
  const [maior18, setMaior18] = useState(false);
  const [vendasDia, setVendasDia] = useState(() => VENDAS_DIA.map(v => hidratarVenda(v)));
  const [entregas, setEntregas] = useState(() => ENTREGAS_INICIAIS.map(e => hidratarEntrega(e, VENDAS_DIA.map(v => hidratarVenda(v)))));
  const [deliveryOpen, setDeliveryOpen] = useState(false);
  const [precoOpen, setPrecoOpen] = useState(false);   // precificação: ficha técnica do copão e fracionamento
  const [siteOpen, setSiteOpen] = useState(false);   // site da loja aberto dentro do PDV (mesma origem: os pedidos chegam na hora)
  useEffect(() => {
    const h = e => { const t = e.data && e.data.erp; if (t === 'abrir-pdv') { setSiteOpen(false); setDeliveryOpen(true); } if (t === 'fechar-site') setSiteOpen(false); };
    window.addEventListener('message', h); return () => window.removeEventListener('message', h);
  }, []);
  const [agoraMs, setAgoraMs] = useState(Date.now());
  const seqDl = useRef({ d: 110, app: 9031 });
  const [cpfErro, setCpfErro] = useState('');
  const [recebido, setRecebido] = useState('');
  const [comprovante, setComprovante] = useState(null);
  const seq = useRef({ nfce: 18813, recibo: 1 });
  useEffect(() => { const t = setInterval(() => setAgoraMs(Date.now()), 15000); return () => clearInterval(t); }, []);
  // Pedidos do site da marca entram na aba App como entrega (canal "site")
  useEffect(() => {
    const importar = () => {
      const fila = lerCanal('pedidos', []);
      if (!fila.length) return;
      setEntregas(l => {
        const novos = fila.filter(p => !l.some(d => d.siteId === p.siteId)).map(entregaDoSite);
        if (!novos.length) return l;
        setTimeout(() => notify(novos.length === 1 ? `Novo pedido do site ${novos[0].pedidoApp} (${novos[0].id})` : `${novos.length} pedidos novos do site`), 0);
        return [...l, ...novos];
      });
    };
    importar();
    const h = e => { if (e.key === CANAL_SITE + ':pedidos') importar(); };
    window.addEventListener('storage', h);
    const t = setInterval(importar, 4000);
    return () => { window.removeEventListener('storage', h); clearInterval(t); };
  }, []);
  // Status de volta para o site (o cliente acompanha ao vivo)
  useEffect(() => {
    const doSite = entregas.filter(d => d.siteId);
    if (!doSite.length) return;
    try {
      const m = lerCanal('status', {});
      doSite.forEach(d => { m[d.siteId] = { status: d.status, entregador: d.entregador, motivo: d.motivo, id: d.id }; });
      localStorage.setItem(CANAL_SITE + ':status', JSON.stringify(m));
    } catch (e) {}
  }, [entregas]);
  const searchRef = useRef(null);
  const toastTimer = useRef(null);

  const notify = msg => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  };

  // Produtos só aparecem com busca (2+ caracteres)
  const { mult, termo } = parseBusca(search);
  const ativo = termo.length >= 2;
  const filtered = useMemo(() => {
    if (!ativo) return [];
    const t = termo.toLowerCase();
    return SAMPLE_PRODUCTS.filter(p =>
      p.name.toLowerCase().includes(t) || p.code.includes(t));
  }, [termo, ativo]);
  useEffect(() => setHl(0), [termo]);

  // Mesmo produto lido de novo: soma na linha existente
  const add = (p, n = 1) => {
    if (!sessao.aberto) return notify('Abra o caixa para vender');
    setCart(prev => prev.find(i => i.id === p.id)
      ? prev.map(i => i.id === p.id ? { ...i, quantity: i.quantity + n } : i)
      : [...prev, { ...p, quantity: n }]);
    setLastId(p.id);
    setSearch('');
    searchRef.current?.focus();
  };
  const qty = (id, d) => setCart(prev => prev.map(i => i.id === id ? { ...i, quantity: Math.max(1, i.quantity + d) } : i));
  const remove = id => setCart(prev => prev.filter(i => i.id !== id));
  const clear = () => { setCart([]); setDiscount(0); setLastId(null); };

  const dlAtivos = entregas.filter(d => !FINAL.includes(d.status)).length;
  const dlAtrasados = entregas.filter(d => !FINAL.includes(d.status) && minutos(d.criado, agoraMs) > SLA_MIN).length;
  const subtotal = cart.reduce((a, i) => a + i.price * i.quantity, 0);
  const totalItems = cart.reduce((a, i) => a + i.quantity, 0);
  const total = Math.max(0, subtotal - discount);

  const adultoNoCarrinho = temAdulto(cart);

  // F12 / Finalizar venda: toda venda do caixa é venda padrão (balcão). Valida e pergunta o CPF na nota.
  // Para entregar, depois: F9 › Balcão › Enviar por delivery.
  const finish = () => {
    if (!cart.length || !sessao.aberto || comprovante || etapa) return;
    const rec = pay === 'cash' && recebido !== '' ? Number(recebido) : total;
    if (pay === 'cash' && rec < total) return notify(`Valor recebido menor que o total (${brl(total)})`);
    setCpf(''); setCpfErro(''); setMaior18(false); setEtapa('cpf');
  };
  const confirmarCpf = () => {
    const d = cpf.replace(/\D/g, '');
    if (d && !cpfValido(d)) return setCpfErro(d.length < 11 ? 'CPF incompleto. Confira os 11 dígitos ou emita sem CPF.' : 'CPF inválido. Confira os dígitos ou emita sem CPF.');
    concluirVenda(d ? mascaraCpf(d) : '');
  };
  // Emite a NFC-e, abre cupom + recibo e registra a venda do dia (tipo balcão)
  const concluirVenda = cpfNota => {
    if (adultoNoCarrinho && !maior18) return setCpfErro('Bebida alcoólica: confirme que o cliente é maior de 18 anos (documento conferido).');
    setEtapa(null);
    const rec = pay === 'cash' && recebido !== '' ? Number(recebido) : total;
    const agoraD = new Date(), numero = seq.current.nfce++, nNota = String(numero).padStart(6, '0');
    const itens = cart.map(i => ({ id: i.id, code: i.code, name: i.name, price: i.price, adult: !!i.adult, quantity: i.quantity }));
    setComprovante({ numero: nNota, serie: 2, chave: chaveNfce(numero, 2, agoraD),
      protocolo: '1352' + String(Math.floor(Math.random() * 1e11)).padStart(11, '0'),
      emissao: agoraD.toLocaleDateString('pt-BR') + ' ' + agoraD.toLocaleTimeString('pt-BR'),
      recibo: String(seq.current.recibo++).padStart(6, '0'), itens: cart.map(i => ({ ...i })), subtotal, desconto: discount, total,
      forma: pay, recebido: rec, troco: Math.max(0, +(rec - total).toFixed(2)), cpf: cpfNota, operador: sessao.operador });
    setVendasDia(l => [...l, { numero: nNota, hora: agoraD.getTime(), itens, subtotal, desconto: discount, total, forma: pay, cpf: cpfNota, operador: sessao.operador, tipo: 'balcao' }]);
    setCpf(''); setRecebido('');
    setSessao(s => ({ ...s, vendas: [...s.vendas, { hora: agora(), total, metodo: pay }] }));
    notify(`Venda finalizada: ${brl(total)} no ${PAY.find(p => p.id === pay).label}`);
    clear(); setDrawer(false);
  };
  const novoId = () => 'D-0' + seqDl.current.d++;
  const novoPedidoApp = () => { const n = seqDl.current.d++; return { id: 'D-0' + n, ped: '#' + seqDl.current.app++, n }; };

  const onSearchKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setHl(h => Math.min(h + 1, filtered.length - 1)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); setHl(h => Math.max(h - 1, 0)); }
    if (e.key === 'Escape' && search) { e.stopPropagation(); setSearch(''); }
    if (e.key === 'Enter') {
      const exato = SAMPLE_PRODUCTS.find(p => p.code === termo);
      if (exato) return add(exato, mult);
      if (filtered[hl]) return add(filtered[hl], mult);
      if (termo) notify(`Nenhum produto com "${termo}"`);
    }
  };

  useEffect(() => {
    const h = e => {
      if (e.key === 'F12') { e.preventDefault(); finish(); }
      if (e.key === 'F8') { e.preventDefault(); setCaixaOpen(true); }
      if (e.key === 'F9') { e.preventDefault(); setDeliveryOpen(true); }
      if (e.key === 'F2') { e.preventDefault(); searchRef.current?.focus(); }
      if (e.key === 'Escape') { setDrawer(false); setCaixaOpen(false); setComprovante(null); setEtapa(null); setDeliveryOpen(false); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  });

  return (
    <div className="flex flex-col h-full bg-fundo text-ink font-body overflow-hidden select-none">

      {/* TOPO */}
      <header className="flex items-center justify-between gap-3 px-4 pn:px-6 py-3 bg-estrutura border-b border-white/10 shrink-0">
        <div className="flex items-center gap-3 min-w-0">
          <img src={LOGO} alt="ADEGA SB" className="h-10 sm:h-11 w-auto shrink-0" />
          <div className="min-w-0">
            <p className="sr-only">ADEGA SB</p>
            <p className="text-[10.5px] font-extrabold uppercase tracking-[.1em] text-white/70 flex items-center gap-2 truncate">
              <span className={`inline-block w-2 h-2 rounded-full shrink-0 ${sessao.aberto ? 'bg-[#25D366]' : 'bg-white/40'}`} aria-hidden="true" />
              PDV · Caixa #01 {sessao.aberto ? 'aberto' : 'fechado'} · {hoje}
            </p>
          </div>
        </div>
        <div className="flex items-center gap-2 sm:gap-3 shrink-0">
          {FICHAS.length > 0 && <button onClick={() => setPrecoOpen(true)} aria-label="Precificação: ficha técnica e fracionamento"
            className="px-3 sm:px-4 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center gap-2 font-bold text-[13px]">
            <Icon n="calc" className="w-5 h-5" /><span className="hidden xl:inline">Precificação</span>
          </button>}
          <button onClick={() => setSiteOpen(true)} aria-label="Abrir o site da loja (visão do cliente)"
            className="px-3 sm:px-4 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center gap-2 font-bold text-[13px]">
            <Icon n="globe" className="w-5 h-5" /><span className="hidden sm:inline">Site da loja</span>
          </button>
          <button onClick={() => setDeliveryOpen(true)} aria-label={`Vendas do dia e entregas: ${dlAtivos} entregas em andamento`}
            className="relative px-3 sm:px-4 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center gap-2 font-bold text-[13px]">
            <Icon n="truck" className="w-5 h-5" />
            <span className="hidden sm:inline">Vendas e entregas<span className="hidden lg:inline font-semibold opacity-70"> (F9)</span></span>
            {dlAtivos > 0 && (
              <span className={`absolute -top-1.5 -right-1.5 text-[11px] font-bold rounded-full min-w-5 h-5 px-1 flex items-center justify-center border-2 border-estrutura tabular-nums ${dlAtrasados ? 'bg-bad text-white' : 'bg-white text-acao-700'}`}>{dlAtivos}</span>
            )}
          </button>
          <div className="hidden md:flex items-center gap-2 text-[13.5px] text-white bg-white/10 px-3.5 py-1.5 rounded-full">
            <Icon n="user" className="w-4 h-4 text-white/80" />
            <span>Operador: <strong>{sessao.aberto ? sessao.operador : '—'}</strong></span>
          </div>
          <button onClick={() => setDrawer(true)}
            className="pn:hidden relative px-4 py-2.5 bg-acao-600 hover:bg-acao-700 text-white rounded-full flex items-center gap-2 font-bold text-[13px] shadow-acao">
            <Icon n="cart" className="w-5 h-5" />
            <span className="hidden sm:inline">Ver comanda</span>
            <span className="sm:hidden tabular-nums">{brl(total)}</span>
            {totalItems > 0 && (
              <span className="absolute -top-1.5 -right-1.5 bg-white text-acao-700 text-[11px] font-bold rounded-full min-w-5 h-5 px-1 flex items-center justify-center border-2 border-estrutura tabular-nums">{totalItems}</span>
            )}
          </button>
        </div>
      </header>

      <div className="flex flex-1 overflow-hidden relative">

        {/* CATÁLOGO EM LISTA */}
        <main className="flex-1 flex flex-col p-4 pn:p-6 gap-4 overflow-hidden min-w-0 relative">
          <h1 className="display text-[21px] pn:text-[26px] leading-tight">
            Ponto de venda<span className="font-body text-[14.5px] font-normal text-ink-soft"> - passe o leitor ou digite o produto</span>
          </h1>

          <div className="flex flex-col sm:flex-row gap-3">
            <div className="relative flex-1">
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-ink-soft"><Icon n="search" className="w-5 h-5" /></span>
              <label htmlFor="busca" className="sr-only">Buscar produto</label>
              <input id="busca" ref={searchRef} type="text" value={search} autoFocus autoComplete="off"
                onChange={e => setSearch(e.target.value)} onKeyDown={onSearchKey}
                placeholder="Nome ou código de barras (Enter adiciona)"
                className="w-full pl-12 pr-16 py-3 bg-white border border-line rounded-full text-ink placeholder-ink-soft/70 text-sm shadow-card" />
              {mult > 1 && (
                <span className="absolute right-10 top-1/2 -translate-y-1/2 text-[11px] font-bold px-2 py-0.5 bg-acao-600 text-white rounded-full tabular-nums">{mult}×</span>
              )}
              {search && (
                <button onClick={() => setSearch('')} aria-label="Limpar busca"
                  className="absolute right-4 top-1/2 -translate-y-1/2 text-ink-soft hover:text-estrutura"><Icon n="x" /></button>
              )}
            </div>
            <div className="hidden sm:flex items-center gap-2 px-4 py-3 bg-white border border-line rounded-full text-[13px] text-ink-soft whitespace-nowrap shadow-card">
              <span className="text-estrutura"><Icon n="barcode" className="w-5 h-5" /></span>
              <span>Leitor ativo · <kbd className="font-bold text-estrutura">F2</kbd></span>
            </div>
          </div>


          <div className="flex-1 min-h-0 flex flex-col bg-white border border-line rounded-card shadow-card overflow-hidden mb-20 pn:mb-0">
            {/* Cabeçalho da lista */}
            <div className={`${ativo ? 'hidden sm:grid' : 'hidden'} grid-cols-[96px_1fr_84px_104px_40px] gap-3 items-center px-4 py-2.5 border-b border-line bg-fundo/40 shrink-0`}>
              <span className="label">Código</span>
              <span className="label">Produto</span>
              <span className="label text-right">Estoque</span>
              <span className="label text-right">Preço</span>
              <span />
            </div>
            <ul className="flex-1 overflow-y-auto divide-y divide-fundo">
              {filtered.map((p, idx) => {
                const inCart = cart.find(i => i.id === p.id);
                const low = p.stock <= 5;
                return (
                  <li key={p.id}>
                    <button onClick={() => add(p, mult)} onMouseEnter={() => setHl(idx)}
                      className={`group w-full grid grid-cols-[1fr_auto_36px] sm:grid-cols-[96px_1fr_84px_104px_40px] gap-3 items-center px-4 py-2.5 text-left border-l-[3px] ${idx === hl ? 'bg-acao-100 border-acao-600' : 'border-transparent'}`}>
                      <span className="hidden sm:block text-xs text-ink-soft tabular-nums">{p.code}</span>
                      <span className="min-w-0 flex items-center gap-2.5">
                        {p.img && <img src={p.img} alt="" loading="lazy" className="w-9 h-9 rounded-lg object-cover shrink-0 bg-acao-100" />}
                        <span className="min-w-0">
                        <span className="block font-semibold text-sm text-ink truncate">{p.name}</span>
                        <span className="block text-[11.5px] text-ink-soft truncate">
                          <span className="sm:hidden tabular-nums">#{p.code} · </span>{p.category}{p.fumigeno && <span className="text-bad font-semibold"> · só maço lacrado, +18</span>}
                          <span className={`sm:hidden tabular-nums ${low ? 'text-warn font-semibold' : ''}`}> · {p.stock} un.{low && ' (baixo)'}</span>
                        </span>
                      </span>
                      </span>
                      <span className={`hidden sm:block text-right text-[13px] tabular-nums ${low ? 'text-warn font-bold' : 'text-ink-soft'}`}>
                        {p.stock}{low && <span className="block text-[10.5px] font-semibold">baixo</span>}
                      </span>
                      <span className="font-display text-[15px] font-bold text-estrutura tabular-nums text-right">{brl(p.price)}</span>
                      <span className={`justify-self-end min-w-8 h-8 px-1.5 rounded-full flex items-center justify-center text-xs font-bold ${inCart
                        ? 'bg-acao-600 text-white'
                        : 'bg-acao-100 text-acao-700 group-hover:bg-acao-600 group-hover:text-white'}`}>
                        {inCart ? inCart.quantity : <Icon n="plus" />}
                      </span>
                    </button>
                  </li>
                );
              })}
              {ativo && filtered.length === 0 && (
                <li className="flex flex-col items-center justify-center p-12 text-ink-soft">
                  <Icon n="pkg" className="w-12 h-12 mb-3 text-ink-faint" />
                  <p className="text-sm font-semibold">Nenhum produto encontrado</p>
                  <p className="text-xs mt-1">Confira o nome ou o código de barras.</p>
                </li>
              )}
              {!ativo && (
                <li className="h-full flex flex-col items-center justify-center text-center p-10 text-ink-soft">
                  <span className="w-16 h-16 rounded-full bg-acao-100 text-acao-700 flex items-center justify-center mb-4">
                    <Icon n={sessao.aberto ? 'barcode' : 'lock'} className="w-8 h-8" />
                  </span>
                  <p className="display text-lg">{sessao.aberto ? 'Pronto para vender' : 'Caixa fechado'}</p>
                  <p className="text-sm mt-1 max-w-xs">
                    {sessao.aberto ? 'Passe o leitor ou digite parte do nome. Os produtos aparecem aqui.' : 'Abra o caixa com o seu operador para começar.'}
                  </p>
                  {!sessao.aberto && (
                    <button onClick={() => setCaixaOpen(true)} className="mt-4 px-5 py-2.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center gap-2">
                      <Icon n="unlock" />Abrir caixa
                    </button>
                  )}
                  {sessao.aberto && (
                    <p className="text-xs mt-3">
                      <kbd className="font-bold text-estrutura">↑↓</kbd> navega · <kbd className="font-bold text-estrutura">Enter</kbd> adiciona · <kbd className="font-bold text-estrutura">3*</kbd> antes do termo adiciona 3 unidades
                    </p>
                  )}
                </li>
              )}
            </ul>
            {ativo && (
              <div className="px-4 py-2 border-t border-line text-xs text-ink-soft tabular-nums shrink-0">
                {filtered.length} {filtered.length === 1 ? 'produto encontrado' : 'produtos encontrados'}
              </div>
            )}
          </div>

          {/* Barra flutuante (mobile) */}
          {cart.length > 0 && sessao.aberto && (
            <button onClick={() => setDrawer(true)}
              className="pn:hidden fixed left-4 right-4 z-30 flex items-center justify-between px-5 py-3.5 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao"
              style={{ bottom: 'calc(16px + env(safe-area-inset-bottom, 0px))' }}>
              <span className="flex items-center gap-2"><Icon n="cart" className="w-5 h-5" />{totalItems} {totalItems === 1 ? 'item' : 'itens'}</span>
              <span className="font-display tabular-nums">{brl(total)} →</span>
            </button>
          )}
          {!sessao.aberto && (
            <button onClick={() => setCaixaOpen(true)}
              className="pn:hidden fixed left-4 right-4 z-30 flex items-center justify-center gap-2 px-5 py-3.5 bg-estrutura text-white font-bold rounded-full shadow-soft"
              style={{ bottom: 'calc(16px + env(safe-area-inset-bottom, 0px))' }}>
              <Icon n="unlock" className="w-5 h-5" />Abrir caixa
            </button>
          )}
        </main>

        <div onClick={() => setDrawer(false)}
          className={`pn:hidden fixed inset-0 z-30 bg-estrutura/60 transition-opacity ${drawer ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} />

        {/* COMANDA */}
        <aside className={`fixed pn:relative inset-y-0 right-0 z-40 w-full sm:w-[420px] pn:w-[360px] xl:w-[420px]
          bg-white border-l border-line flex flex-col transition-transform duration-300 ease-in-out shadow-soft pn:shadow-none
          ${drawer ? 'translate-x-0' : 'translate-x-full pn:translate-x-0'}`}
          style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}
          aria-label="Comanda">
          <div className="px-4 py-4 border-b border-line flex items-center justify-between shrink-0">
            <div className="flex items-center gap-2">
              <span className="text-estrutura"><Icon n="cart" className="w-5 h-5" /></span>
              <h2 className="display text-lg">Comanda</h2>
              <span className="text-[11px] font-bold px-2 py-0.5 bg-acao-100 text-acao-700 rounded-full tabular-nums">{totalItems}</span>
            </div>
            <div className="flex items-center gap-2">
              {cart.length > 0 && (
                <button onClick={clear}
                  className="text-[13px] font-semibold text-ink-soft hover:text-estrutura border border-line hover:border-estrutura px-3 py-1 rounded-full flex items-center gap-1">
                  <Icon n="trash" className="w-3.5 h-3.5" />Limpar
                </button>
              )}
              <button onClick={() => setDrawer(false)} aria-label="Fechar comanda" className="pn:hidden p-1 text-ink-soft hover:text-estrutura">
                <Icon n="x" className="w-6 h-6" />
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
            {cart.map(i => (
              <div key={i.id} className={`flex items-center justify-between p-3 border rounded-card gap-3 ${i.id === lastId ? 'bg-acao-100 border-acao-600' : 'bg-white border-line'}`}>
                <div className="flex-1 min-w-0">
                  <h4 className="font-semibold text-sm text-ink truncate">{i.name}</h4>
                  <div className="text-xs text-ink-soft mt-0.5 tabular-nums">
                    {brl(i.price)} × {i.quantity} = <strong className="text-estrutura">{brl(i.price * i.quantity)}</strong>
                  </div>
                </div>
                <div className="flex items-center gap-1 border border-line p-0.5 rounded-full shrink-0">
                  <button onClick={() => qty(i.id, -1)} aria-label="Diminuir" className="w-7 h-7 rounded-full flex items-center justify-center text-ink-soft hover:text-estrutura hover:bg-fundo"><Icon n="minus" className="w-3.5 h-3.5" /></button>
                  <span className="w-6 text-center text-xs font-bold text-estrutura tabular-nums">{i.quantity}</span>
                  <button onClick={() => qty(i.id, 1)} aria-label="Aumentar" className="w-7 h-7 rounded-full flex items-center justify-center text-ink-soft hover:text-estrutura hover:bg-fundo"><Icon n="plus" className="w-3.5 h-3.5" /></button>
                </div>
                <button onClick={() => remove(i.id)} aria-label="Remover item" className="p-1.5 text-ink-soft hover:text-acao-700 hover:bg-acao-100 rounded-panel">
                  <Icon n="trash" />
                </button>
              </div>
            ))}
            {cart.length === 0 && (
              <div className="h-full flex flex-col items-center justify-center text-ink-soft p-8 text-center">
                <Icon n="cart" className="w-12 h-12 mb-3 text-ink-faint" />
                <p className="text-sm font-semibold">{sessao.aberto ? 'Nenhum item na comanda' : 'Caixa fechado'}</p>
                <p className="text-xs mt-1">{sessao.aberto ? 'Toque nos produtos ou passe o leitor.' : 'Abra o caixa para começar a vender.'}</p>
              </div>
            )}
          </div>

          <div className="p-4 bg-fundo/40 border-t border-line space-y-4 shrink-0">
            <div className="space-y-2 text-sm">
              <div className="flex justify-between text-ink-soft">
                <span>Subtotal</span><span className="tabular-nums">{brl(subtotal)}</span>
              </div>
              <div className="flex justify-between items-center text-ink-soft">
                <label htmlFor="desconto" className="flex items-center gap-1"><Icon n="percent" className="w-3.5 h-3.5" /> Desconto (R$)</label>
                <input id="desconto" type="number" min="0" step="0.01" value={discount || ''}
                  onChange={e => setDiscount(Math.max(0, Number(e.target.value)))} placeholder="0,00"
                  className="w-28 px-3 py-1.5 bg-white border border-line rounded-full text-right text-ink text-[13px] tabular-nums" />
              </div>
              <div className="flex justify-between items-baseline pt-2.5 border-t border-line">
                <span className="display text-base">Total a pagar</span>
                <span className="display text-[26px] tabular-nums">{brl(total)}</span>
              </div>
            </div>

            <div className="space-y-2">
              <span className="label">Forma de pagamento</span>
              <div className="grid grid-cols-3 gap-2" role="radiogroup" aria-label="Forma de pagamento">
                {PAY.map(m => (
                  <button key={m.id} onClick={() => setPay(m.id)} role="radio" aria-checked={pay === m.id}
                    className={`flex flex-col items-center justify-center py-2.5 px-2 rounded-card border text-[13px] ${pay === m.id
                      ? 'bg-acao-100 border-acao-600 text-acao-700 font-bold'
                      : 'bg-white border-line text-ink-soft font-semibold hover:border-estrutura hover:text-estrutura'}`}>
                    <span className="mb-1"><Icon n={m.icon} className="w-5 h-5" /></span>{m.label}
                  </button>
                ))}
              </div>
              {pay === 'cash' && (
                <div className="flex justify-between items-center text-sm text-ink-soft pt-1">
                  <label htmlFor="recebido">Valor recebido</label>
                  <span className="flex items-center gap-2">
                    {recebido !== '' && Number(recebido) >= total && <span className="text-ok font-bold tabular-nums">Troco {brl(Number(recebido) - total)}</span>}
                    <input id="recebido" type="number" min="0" step="0.01" value={recebido} onChange={e => setRecebido(e.target.value)} placeholder={total.toFixed(2).replace('.', ',')}
                      className="w-28 px-3 py-1.5 bg-white border border-line rounded-full text-right text-ink text-[13px] tabular-nums" />
                  </span>
                </div>
              )}
            </div>

            {/* Dois botões: Caixa (secundário) + Finalizar venda (primário) */}
            <div className="grid grid-cols-[auto_1fr] gap-2">
              <button onClick={() => setCaixaOpen(true)}
                className={`px-4 py-3.5 rounded-full font-bold text-[14px] flex items-center justify-center gap-2 border-[1.5px] ${sessao.aberto
                  ? 'bg-white border-line text-estrutura hover:border-estrutura' : 'bg-estrutura border-estrutura text-white hover:bg-estrutura-light'}`}>
                <Icon n="register" className="w-5 h-5" />
                <span>Caixa <span className="font-semibold opacity-70 hidden sm:inline">(F8)</span></span>
              </button>
              <button disabled={!cart.length || !sessao.aberto} onClick={finish}
                className="py-3.5 px-3 bg-acao-600 hover:bg-acao-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-[15px] rounded-full shadow-acao flex items-center justify-center gap-2 active:scale-[0.99] min-w-0">
                <Icon n="check" className="w-5 h-5 shrink-0" /><span className="whitespace-nowrap">Finalizar venda<span className="hidden xl:inline"> (F12)</span></span>
              </button>
            </div>
          </div>
        </aside>
      </div>

      {etapa && (
        <div className="fixed inset-0 z-50 bg-estrutura/60 flex items-end sm:items-center justify-center sm:p-4" onClick={() => setEtapa(null)}>
          <div role="dialog" aria-modal="true" aria-labelledby="cpf-titulo" onClick={e => e.stopPropagation()}
            className={`bg-white w-full sm:max-w-sm max-h-[94%] overflow-y-auto rounded-t-banner sm:rounded-banner shadow-soft p-5 space-y-4`}>

            {etapa === 'cpf' && (<>
            <div>
              <h2 id="cpf-titulo" className="display text-xl leading-tight">CPF na nota?</h2>
              <p className="text-[13px] text-ink-soft tabular-nums">{totalItems} {totalItems === 1 ? 'item' : 'itens'} · {brl(total)} no {PAY.find(p => p.id === pay).label}. Deixe em branco para consumidor não identificado.</p>
            </div>
            <div>
              <label htmlFor="cpf" className="label mb-1">CPF do cliente</label>
              <input id="cpf" autoFocus inputMode="numeric" autoComplete="off" value={cpf} placeholder="000.000.000-00"
                onChange={e => { setCpf(mascaraCpf(e.target.value)); setCpfErro(''); }}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); confirmarCpf(); } }}
                className={`w-full px-4 py-3 border-[1.5px] rounded-full text-lg font-bold text-estrutura tabular-nums ${cpfErro ? 'border-bad' : 'border-acao-600'}`} />
              {cpfErro && <p className="text-[12.5px] text-bad font-semibold mt-1.5 px-1">{cpfErro}</p>}
            </div>
            {adultoNoCarrinho && (
              <label className="flex items-start gap-2.5 p-3 rounded-card border-[1.5px] border-bad/40 bg-bad/5 text-[13px] text-ink cursor-pointer">
                <input type="checkbox" checked={maior18} onChange={e => { setMaior18(e.target.checked); setCpfErro(''); }} className="mt-0.5 w-4 h-4 accent-[var(--acao-600)]" />
                <span><strong className="text-bad">Bebida alcoólica.</strong> Cliente maior de 18 anos, documento conferido.</span>
              </label>
            )}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => concluirVenda('')} className="py-3 bg-white border-[1.5px] border-line hover:border-estrutura text-estrutura font-bold text-[13.5px] rounded-full">Sem CPF</button>
              <button onClick={confirmarCpf} className="py-3 bg-acao-600 hover:bg-acao-700 text-white font-bold rounded-full shadow-acao flex items-center justify-center gap-1.5"><Icon n="check" />Emitir nota</button>
            </div>
            <p className="text-[11.5px] text-ink-soft text-center"><kbd className="font-bold text-estrutura">Enter</kbd> emite · <kbd className="font-bold text-estrutura">Esc</kbd> volta para a venda</p>
            </>)}
          </div>
        </div>
      )}

      {comprovante && <ComprovanteModal v={comprovante} fechar={() => { setComprovante(null); searchRef.current?.focus(); }} />}

      {deliveryOpen && <VendasModal vendasDia={vendasDia} setVendasDia={setVendasDia} entregas={entregas} setEntregas={setEntregas} agoraMs={agoraMs}
        sessao={sessao} setSessao={setSessao} onClose={() => { setDeliveryOpen(false); searchRef.current?.focus(); }} notify={notify}
        novoId={novoId} novoPedidoApp={novoPedidoApp} />}

{precoOpen && <PrecificacaoModal fechar={() => { setPrecoOpen(false); searchRef.current?.focus(); }} notify={notify} />}

      {siteOpen && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-stretch justify-center p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="Site da loja">
          <div className="bg-white w-full max-w-[1400px] sm:rounded-banner overflow-hidden flex flex-col shadow-soft">
            <div className="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2.5 bg-estrutura text-white shrink-0">
              <Icon n="globe" className="w-5 h-5 shrink-0" />
              <div className="min-w-0 flex-1">
                <p className="font-display font-bold text-[15px] leading-tight truncate">Site da loja · visão do cliente</p>
                <p className="text-[11.5px] text-white/75 truncate">Pedido feito aqui chega no PDV em F9 › App em poucos segundos.</p>
              </div>
              <a href="site.html" target="_self" title="Se o site não carregar no quadro, abre nesta mesma janela. Para voltar, use Abrir o PDV no site." className="hidden md:flex px-3 py-2 bg-white/10 hover:bg-white/20 rounded-full font-bold text-[12.5px] items-center gap-1.5"><Icon n="globe" className="w-4 h-4" />Tela cheia</a>
              <button onClick={() => { setSiteOpen(false); setDeliveryOpen(true); }} className="px-3 py-2 bg-white/10 hover:bg-white/20 rounded-full font-bold text-[12.5px] flex items-center gap-1.5"><Icon n="truck" className="w-4 h-4" /><span className="hidden sm:inline">Ver pedidos (F9)</span></button>
              <button onClick={() => { setSiteOpen(false); searchRef.current?.focus(); }} className="px-3 py-2 bg-white text-estrutura rounded-full font-bold text-[12.5px] flex items-center gap-1.5" autoFocus><Icon n="x" className="w-4 h-4" />Voltar ao PDV</button>
            </div>
            <iframe src="site.html" title="Site da loja" className="flex-1 w-full border-0 bg-white" />
          </div>
        </div>
      )}

            {caixaOpen && <CaixaModal sessao={sessao} setSessao={setSessao} onClose={() => setCaixaOpen(false)} notify={notify} />}

      {toast && (
        <div role="status" className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-2 px-5 py-3 bg-estrutura text-white font-semibold text-sm rounded-full shadow-soft max-w-[calc(100%-32px)]">
          <span className="text-acao-300"><Icon n="check" /></span>{toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PDVScreen />);
</script>
